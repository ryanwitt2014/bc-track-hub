<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("hub-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC Track Hub</title>
<meta name="description" content="Benton Central Track & Field: schedule, workouts, athletes, records, and more.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BC Track">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}
.thm{margin-left:8px;flex:none;width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.thm:hover{background:rgba(255,255,255,.08)}
.thm svg{width:18px;height:18px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky lane-stripe nav over one view at a time; hub = tile grid of sections, each view a lane-numbered sheet */
:root{
  --cold:#5b7fa6; --warm:#c8730a;
  --bg:#f5f5f2; --surface:#ffffff; --fg:#0e1611; --muted:#5e6661; --line:#e1e3de;
  --accent:#004631; --accent-ink:#ffffff; --gold:#fcb827; --gold-soft:#fff4d9;
  --brand:#0c0f0e; --brand-2:#050706; --on-brand:#ffffff; --gold-ink:#1a1405; --green:#004631; --green-2:#00281c;
  --track:#b5452f; --chip:#eff0ec;
  --shadow:0 1px 2px rgba(10,20,14,.05),0 10px 30px -18px rgba(10,20,14,.25);
  --radius:12px;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08090a; --surface:#121414; --fg:#f3f4f3; --muted:#9da3a0; --line:#252928;
  --accent:#fcb827; --accent-ink:#161105; --gold:#fcb827; --gold-soft:#2a2210;
  --brand:#000000; --brand-2:#000000; --on-brand:#ffffff; --gold-ink:#161105; --green:#004631; --green-2:#00281c;
  --track:#e0735c; --chip:#1c1f1e; --cold:#86a9cf; --warm:#f0a040; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090a; --surface:#121414; --fg:#f3f4f3; --muted:#9da3a0; --line:#252928;
  --accent:#fcb827; --accent-ink:#161105; --gold:#fcb827; --gold-soft:#2a2210;
  --brand:#000000; --brand-2:#000000; --on-brand:#ffffff; --gold-ink:#161105; --green:#004631; --green-2:#00281c;
  --track:#e0735c; --chip:#1c1f1e; --cold:#86a9cf; --warm:#f0a040; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--gold);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/8 - 2px),rgba(255,255,255,.12) calc(100%/8 - 2px) calc(100%/8))}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-decoration:none;color:var(--gold);text-transform:uppercase;line-height:1}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;display:block;color:var(--on-brand);opacity:.85}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{color:inherit;text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:4px;opacity:.85}
nav.tabs a[aria-current="page"]{background:var(--gold);color:var(--gold-ink);opacity:1}
nav.tabs a:hover{opacity:1}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(34px,6vw,52px);font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.stack{display:grid;gap:24px}
.sample{display:inline-block;color:var(--fg);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-soft);color:var(--fg);border:1px dashed var(--gold);padding:2px 8px;border-radius:3px}
.backlink{font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;gap:6px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.mono,td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Hub */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.nextmeet{background:var(--brand);color:var(--on-brand);border-top:4px solid var(--gold);border-radius:6px;padding:20px;display:grid;gap:6px;position:relative;overflow:hidden}
.nextmeet .count{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;color:var(--gold);margin:6px 0 4px}
.nextmeet .count span{font-size:18px;color:var(--on-brand);margin-left:8px;opacity:.8}
.nm-eye{color:inherit;opacity:.7}
.nm-name{font-size:30px}
.nm-facts{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;margin:6px 0 4px;font-size:15px;position:relative;max-width:calc(100% - 70px)}
.nm-facts dt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.6;padding-top:3px}
.nm-facts dd{margin:0}
.nm-link{color:var(--gold);font-weight:600;margin-top:4px;position:relative}
.nextmeet .lanes{position:absolute;right:-10px;top:0;bottom:0;width:90px;background:repeating-linear-gradient(90deg,var(--track) 0 18px,transparent 18px 22px);opacity:.25}
.week ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.week li{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:15px}
.week li b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:13px;padding-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold);transform:translateY(-2px)}
.tile .lane{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--gold-ink);background:var(--gold);border-radius:4px;min-width:40px;height:40px;display:grid;place-items:center}
.tile h3{font-size:20px}
.tile p{margin:0;color:var(--muted);font-size:14px}
/* toggles */
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto}
.seg button{font:600 14px var(--body);padding:7px 14px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td a{font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--chip);border-radius:3px;padding:1px 7px;margin:1px 2px 1px 0;white-space:nowrap}
.chip.home{background:var(--accent);color:var(--accent-ink)}
.chip.past{opacity:.55}
.lvl{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track)}
/* roster cards */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ath{display:grid;gap:4px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:5px;padding:12px 14px}
.ath:hover{border-color:var(--accent)}
.ath strong{font-size:17px}
.ath span{font-size:13px;color:var(--muted)}
.lk-ed{display:grid;gap:10px;max-width:560px;margin-top:10px}
.cf-yrs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cf-yr{flex:1 1 90px;border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:grid;gap:2px}
.cf-yr span{font:600 12px var(--mono);color:var(--muted)}.cf-yr b{font:800 26px var(--display);line-height:1}.cf-yr small{font-size:12px;color:var(--muted)}
.cf-yr.top{border-color:var(--gold);background:var(--gold-soft)}
.cf-ch{text-align:right;white-space:nowrap}
.cf-d,.cf-p{display:inline-block;font:700 12px var(--mono);border-radius:3px;padding:1px 5px;margin-left:4px;color:var(--muted)}
.cf-d.up,.cf-p.up{color:#145a30;background:#eef1ec}.cf-d.dn,.cf-p.dn{color:#b3261e;background:#fbe7e5}
.cf-d.new{color:var(--gold-ink);background:var(--gold-soft)}
.cf-yd{margin-top:4px}.cf-yd .cf-d:first-child{margin-left:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cf-d.up,:root:not([data-theme="light"]) .cf-p.up{color:#f2bd3a;background:#2b2410}:root:not([data-theme="light"]) .cf-d.dn,:root:not([data-theme="light"]) .cf-p.dn{color:#ff9b91;background:#3a1714}}
:root[data-theme="dark"] .cf-d.up,:root[data-theme="dark"] .cf-p.up{color:#f2bd3a;background:#2b2410}:root[data-theme="dark"] .cf-d.dn,:root[data-theme="dark"] .cf-p.dn{color:#ff9b91;background:#3a1714}
.cf-sub{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:12px}
.cf-card .bar{margin-bottom:6px}
tr.cf-bc td{background:var(--gold-soft);font-weight:700}
.su-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.su-stat{padding:14px 16px;display:grid;gap:2px}.su-stat b{font:800 28px var(--display);line-height:1}.su-stat span{font-size:13px;color:var(--muted)}
.su-stat.gold{border-color:var(--gold);background:var(--gold-soft)}
.su-list{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.su-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.su-row:first-child{border-top:0}.su-row.su-out{opacity:.62}
.su-who{min-width:0;display:grid}.su-who a{color:var(--fg);text-decoration:none}.su-who small{color:var(--muted);font-size:12px}
.su-form{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}.su-form b{color:var(--fg)}
.if-tbl td{vertical-align:top}
.rec-missing{background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:10px 12px;margin-top:8px}.rec-missing select{max-width:100%;font-size:13px}.if-tbl textarea{width:100%;font:12px var(--mono)}
.su-tag{font-size:12px;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap;background:var(--chip)}
.su-tag.su-new{background:var(--gold);color:var(--gold-ink)}.su-tag.su-rec{background:var(--accent);color:var(--accent-ink)}
.su-tag.su-xc{background:var(--gold-soft);border:1px solid var(--gold)}
.su-boxes{display:flex;gap:12px}
.su-box{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.su-box.ro{cursor:default}.su-box.ro input{cursor:default;opacity:1}
.su-wint{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.su-flag{border:1px solid #b4472b;color:#b4472b;background:transparent;cursor:pointer;font:600 12px var(--body)}
.su-box input{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer}
.new-chip{background:var(--gold);color:var(--gold-ink);justify-self:start}
@media (max-width:620px){.su-row{grid-template-columns:minmax(0,1fr) auto}.su-boxes{grid-column:1/-1}}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:600 14px var(--body);display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);cursor:pointer}
.filters button span{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.athtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvlchip{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.weekpick button:disabled{opacity:.35;cursor:default}
.shared{margin-bottom:10px}
.lvsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.lvsplit{grid-template-columns:1fr}}
.lvcol{background:var(--bg);border-radius:5px;padding:10px 12px;min-width:0}
.lvcol ul{margin:4px 0 0}
.lvcol.off{opacity:.6}
.lvhead{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted);font-size:14px;margin:4px 0 0;list-style:none}
.evlist{display:grid;gap:8px;min-width:0}
.evblock{display:grid;grid-template-columns:120px 1fr;gap:12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.evblock:last-child{border-bottom:0;padding-bottom:0}
.evblock ul{margin:0}
.evname{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:2px}
@media (max-width:600px){.evblock{grid-template-columns:1fr;gap:2px}}
.lvsplit{margin-top:6px}
.anetrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.anet{display:inline-flex;gap:6px;align-items:center;font-size:14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px}
.anet b{color:var(--accent)}
.anet:hover{border-color:var(--accent)}
.search{font:15px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 180px;max-width:260px}
.cov{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;font-family:var(--mono);font-size:12px;font-weight:500}
.cov.ok{background:var(--accent);color:var(--accent-ink)}
.cov.thin{background:var(--gold);color:var(--gold-ink)}
.cov.gap{background:var(--track);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend>span{display:inline-flex;gap:6px;align-items:center}
.rec-hit td{background:var(--gold-soft)}
.chip.gold{background:var(--gold);color:var(--gold-ink)}
.staff .open{border-style:dashed;background:transparent}
.staff .open h3{color:var(--muted)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.exp{margin:10px 0 0;padding-left:18px;display:grid;gap:6px}
.btn{font:600 14px var(--body);padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--track);border-color:var(--track);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.ed{display:grid;gap:16px}
.ed-help{font-size:15px;line-height:1.55}
.ed-help code{font-family:var(--mono);font-size:13px;background:var(--chip);padding:1px 5px;border-radius:3px}
.ed-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;max-width:520px}
.ed-row span,.ed-g span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ed input[type=text],.ed input[type=date],.ed input[type=password],.ed input[type=email],.ed textarea{font:15px var(--body);width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);min-width:0}
.ed textarea{resize:vertical;line-height:1.4}
.ed-day{border-top:2px solid var(--line);padding-top:14px;display:grid;gap:10px}
.ed-dayhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ed-dayhead h3{font-size:24px}
.ed-dayhead .btn{margin-left:auto}
.ed-check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.ed-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.ed-grid2{grid-template-columns:1fr}.ed-row{grid-template-columns:1fr;gap:4px}}
.ed-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ed-g{display:grid;gap:4px;min-width:0}
.ed-g.all{grid-column:1/-1}
.ed-g.all span{color:var(--accent)}
.ed-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.ed-save{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:14px}
.ed-save.sticky{position:sticky;bottom:0;z-index:5;background:var(--surface);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 14px -10px rgba(0,0,0,.25)}
.ed-msg{font-size:14px}
.ed-msg.ok{color:var(--accent);font-weight:600}
.ed-msg.err{color:var(--track);font-weight:600}
.ed-acts{white-space:nowrap;display:flex;gap:6px}
.tchip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--gold-soft);border:1px solid var(--gold);border-radius:3px;padding:0 5px;margin-right:5px;white-space:nowrap;vertical-align:1px}
.pbox summary{cursor:pointer;list-style:none}
.pbox summary::-webkit-details-marker{display:none}
.pbtn{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:6px;color:var(--accent);white-space:nowrap;vertical-align:1px}
.pbox[open] .pbtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbody{margin:6px 0 4px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:4px;font-size:14px}
.pbody table{width:100%;border-collapse:collapse}.pbody td{padding:3px 8px 3px 0;vertical-align:top;border-top:1px solid var(--line)}
.pbody .mono{font-family:var(--mono);font-size:13px}

.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.combo-picks .btn{margin-left:auto}
.evblock.combo .evname{color:var(--gold-ink);background:var(--gold);border-radius:3px;padding:2px 6px;align-self:start;justify-self:start}
.rank{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.rk{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--chip);color:var(--fg);border-radius:3px;padding:1px 6px}
.rk.r3{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.rk.r1{background:var(--accent);color:var(--accent-ink)}
.hs-tag{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--gold);color:var(--gold-ink);border-radius:3px;padding:1px 6px;white-space:nowrap}
.pr.pr-hs{box-shadow:inset 0 0 0 2px var(--gold)}
.hs-note{margin:6px 0 0;font-size:13px;color:var(--muted)}
.card-rank{display:flex;flex-wrap:wrap;gap:4px}
.shoecard{display:grid;gap:4px;align-content:start}
.shoe-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.shoe-links .mlabel{flex-basis:100%}
.wk-count{font-family:var(--display);font-weight:800;font-size:48px;line-height:.9;color:var(--accent);margin:8px 0 6px}
.wk-count span{font-size:16px;color:var(--muted);margin-left:8px;font-weight:600}
/* practice sheets */
.sheets-wrap{display:grid;gap:16px}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:14px;font:12px/1.35 var(--body);overflow-x:auto}
.sh-head{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #111;padding-bottom:6px}
.sh-brand{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#444}
.sh-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.1}
.sh-meta{text-align:right;display:grid;gap:4px;font-size:12px}
.sh-work{padding:6px 0;border-bottom:1px solid #999}
.sh-work ol{margin:4px 0 0;padding-left:20px;columns:2;column-gap:24px}
.sh-lines div{border-bottom:1px solid #999;height:18px}
.sh-table{border-collapse:collapse;width:100%;margin-top:8px;font-size:11px}
.sh-table th,.sh-table td{border:1px solid #777;padding:2px 4px;height:24px;text-align:center;color:#111;white-space:nowrap}
.sh-table th{background:#eee;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}
.sh-table .sh-name{text-align:left;min-width:120px}
.sh-table .sh-notes{min-width:90px}
.sh-table .sh-pace{text-align:left;font-size:10px;line-height:1.25;white-space:normal;min-width:120px}.sh-table td.sh-pace b{font-weight:700}
.sh-table .sh-wide{min-width:110px}
.sh-table .sh-last{text-align:left;font-size:9px;line-height:1.2;white-space:normal;max-width:150px;color:#333}
.cover .cv-days{columns:3 260px;column-gap:18px;margin-top:10px;font-size:11px;color:#111}
.cv-day{break-inside:avoid;margin:0 0 10px;border-top:2px solid #111;padding-top:4px}.cv-day h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.cv-blk{margin:0 0 5px}.cv-blk ul{margin:1px 0 0;padding-left:14px}.cv-blk li{margin:0}.cv-f{color:#666;font-style:italic}
.wstars{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wstar{font:600 14px var(--body);border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.wstar span{color:var(--gold);font-size:16px;line-height:1}.wstar small{color:var(--muted);font-weight:500}
.wstar[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.sh-table td.sh-rep{position:relative;min-width:40px}.sh-table td.sh-rep i{position:absolute;top:1px;left:2px;font-style:normal;font-size:7.5px;color:#777}
.sh-table td.sh-na{background:repeating-linear-gradient(45deg,#e6e6e6 0 3px,#fff 3px 6px)}
.sh-table td.sh-runrow{text-align:left;color:#555;font-size:10px;padding-left:8px}
.sh-dist th{background:#fff;border-top:0;border-left:0;border-right:0;font-weight:600}
.sh-dist th:not(:first-child){border:1px solid #777;background:#fffbe6}
.sh-g{font-size:9px;color:#666}
.sh-foot{margin-top:6px;font-size:9.5px;color:#555}
@media print{
  @page{size:letter landscape;margin:0.35in}
  html,body{background:#fff!important}
  :root{padding:0!important}
  body:has(.sheets-wrap) header.top, body:has(.sheets-wrap) #subnav, body:has(.sheets-wrap) #hub-err{display:none!important}
  body:has(.sheets-wrap)::before{display:none!important}
  body:has(.sheets-wrap) #view{padding:0!important;max-width:none!important}
  body:has(.sheets-wrap) #view .stack > :not(.sheets-wrap), body:has(.sheets-wrap) .no-print, body:has(.sheets-wrap) .backlink{display:none!important}
  .sheets-wrap{display:block}
  .sheet{border:0;padding:0;overflow:visible;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sh-table{font-size:11px}
  .sh-table td{height:30px}
  .sheet.dense .sh-table td{height:23px}.sheet.dense .sh-work{font-size:11px}
  .sheet.dense2 .sh-table td{height:18px;padding:0 3px}.sheet.dense2 .sh-table{font-size:10px}.sheet.dense2 .sh-work{font-size:10.5px}.sheet.dense2 .sh-table td.sh-pace{font-size:9px}
}
.hub-week{display:grid;gap:10px}
.ar-dist{--ar:var(--accent)}.ar-mid{--ar:var(--gold)}.ar-spr{--ar:#b4472b}.ar-fld{--ar:#2f4f8f}
.hub-week .seg button.ar-dist,.hub-week .seg button.ar-mid,.hub-week .seg button.ar-spr,.hub-week .seg button.ar-fld{box-shadow:inset 0 -3px 0 var(--ar)}
.outlook .day{border-left:4px solid var(--ar)}
.fldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fld{border-top:4px solid var(--ar);padding:14px 16px}.fld h3{margin:0 0 8px}
.fday{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}.fday b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:13px;padding-top:2px}
.nw{margin:10px 0 12px;font-size:16px}.nw ul{margin:0 0 6px;padding-left:18px;list-style:disc}.week .nw li{display:list-item;margin:3px 0;font-size:16px}
.nw-g{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hub-week h2{font-size:26px}
/* workouts */
.days{display:grid;gap:10px}
.day{display:grid;grid-template-columns:110px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
@media (max-width:600px){.day{grid-template-columns:1fr;gap:6px}}
.day .when{font-family:var(--display);font-weight:600;font-size:20px;text-transform:uppercase;line-height:1.1}
.day .when small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:none}
.day ul{margin:6px 0 0;padding-left:18px}
.day li{margin:2px 0}
.vid{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;text-decoration:none;background:var(--chip);border-radius:20px;padding:2px 10px 2px 4px;margin-left:6px;white-space:nowrap}
.vid i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--track);color:#fff;font-style:normal;font-size:9px}
.grp{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.weekpick{display:flex;gap:8px;align-items:center}
.weekpick button{font:600 18px var(--body);width:36px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:5px;cursor:pointer}
.weekpick b{font-family:var(--display);font-size:22px;text-transform:uppercase;min-width:150px;text-align:center}
/* warmup */
.steps{counter-reset:s;display:grid;gap:8px;list-style:none;padding:0;margin:12px 0 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent)}
.steps em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
/* athlete page */
.prgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pr{background:var(--bg);border-radius:5px;padding:12px}
.pr .ev{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pr .mk{font-family:var(--mono);font-size:24px;font-weight:500}
.pr .when2{font-size:11px;color:var(--muted);line-height:1.3;margin-bottom:4px}
.pr .gl{font-size:13px;color:var(--muted)}
.pr .gl b{color:var(--accent);font-weight:600}
.split{font-family:var(--mono);font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}

/* ===== Elevated look (Nov 2026): forest green + gold, crisp surfaces ===== */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header.top{background:linear-gradient(180deg,var(--brand) 0%,var(--brand-2) 100%);background-image:linear-gradient(180deg,var(--brand) 0%,var(--brand-2) 100%);border-bottom:3px solid var(--gold);box-shadow:0 6px 20px -12px rgba(0,0,0,.5)}
header.top .wrap{padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;letter-spacing:.04em}
.brand .mark{flex:none;width:auto;height:44px;filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.brand .wm{display:block}
nav.tabs a{border-radius:999px;padding:7px 14px;opacity:.8;transition:background .15s,opacity .15s}
nav.tabs a:hover{background:rgba(255,255,255,.08)}
nav.tabs a[aria-current="page"]{background:var(--gold);color:var(--gold-ink)}
.subnav{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.subnav a{border-radius:999px;color:var(--muted);transition:color .15s,background .15s}
.subnav a:hover{color:var(--fg)}
.subnav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{padding-block:28px 72px}
h1{letter-spacing:.005em}
.eyebrow{letter-spacing:.16em}
.panel,.tbl,.tile,.ath,.seg,.cf-yr{border-radius:var(--radius)}
.panel{box-shadow:var(--shadow);border-color:var(--line)}
.tbl{box-shadow:var(--shadow)}
th{background:color-mix(in srgb,var(--chip) 60%,var(--surface))}
.tile{border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.tile:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 14px 30px -18px rgba(10,20,14,.45)}
.tile .lane{border-radius:10px;background:var(--green);color:var(--gold);font-size:24px}
.ath{border-left:4px solid var(--gold);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.ath:hover{transform:translateY(-1px);border-color:var(--gold)}
.btn{border-radius:999px;padding:9px 16px;transition:transform .1s,background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.sm{border-radius:999px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{border-radius:14px;padding:3px;gap:2px;background:var(--chip);border-color:transparent}
.seg button{border-radius:11px;padding:7px 14px;color:var(--muted)}
.subnav-in{flex-wrap:nowrap!important}
.subnav a{flex:none!important}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}}
.chip{border-radius:999px;padding:2px 9px}
.nextmeet{border-radius:var(--radius);border-top:0;background:radial-gradient(120% 140% at 100% 0%,#0a6146 0%,var(--green) 45%,var(--green-2) 100%);box-shadow:0 20px 40px -24px rgba(0,40,28,.8)}
.nextmeet .lanes{opacity:.14;background:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 22px)}
.wk-count{color:var(--fg)}
.mepick select,select,input[type="text"],input[type="password"],input[type="email"],input[type="number"],textarea{border-radius:10px}
a{text-underline-offset:3px}
::selection{background:var(--gold);color:var(--gold-ink)}

/* Today card */
.today{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.today-a{grid-template-columns:1fr}
.today-a .td-side{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:stretch}
@media (max-width:820px){.today{grid-template-columns:1fr}}
.td-hi{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.td-hi h1 span{color:var(--accent)}
.td-who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.td-work{position:relative;overflow:hidden}
.td-work::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--gold)}
.td-when{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.td-when b{background:var(--green);color:var(--gold);border-radius:999px;padding:3px 10px;letter-spacing:.1em}
.td-work h2{margin:8px 0 4px;font-size:32px}
.td-work ul{margin:10px 0 0;padding-left:18px}
.td-work li{margin:3px 0}
.td-side{display:grid;gap:16px;align-content:start}
.td-prs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.td-pr{display:grid;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:92px}
.td-pr span{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.td-pr b{font:800 24px/1.1 var(--display)}
.td-pick{display:grid;gap:10px;background:linear-gradient(135deg,var(--surface) 0%,var(--surface) 60%,var(--gold-soft) 100%)}
.td-pick select{font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);max-width:420px}

/* Records: chasing list */
.chase{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.chase li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chase .bar-in{grid-column:1/-1;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.chase .bar-in i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:inherit}
.chase small{color:var(--muted)}

/* Menu page */
.menu-g{display:grid;gap:10px}
.menu-g h2{font-size:22px;margin-top:6px}
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.menu-list a{display:grid;gap:2px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.menu-list a b{font-weight:600}
.menu-list a span{font-size:13px;color:var(--muted)}


/* Calendar */
.cal-head{align-items:flex-end}
.cal-nav{display:flex;gap:6px}
.cal-filters{display:flex;gap:10px;flex-wrap:wrap}
.cal{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.cal-wh{display:grid;grid-template-columns:repeat(7,1fr);background:var(--green);color:#fff;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase}
.cal-wh div{padding:7px 8px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-d{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px 8px;min-height:150px;font-size:12px;line-height:1.3;min-width:0}
.cal-d:nth-child(7n){border-right:0}
.cal-d.out{opacity:.45}
.cal-d.empty{background:color-mix(in srgb,var(--chip) 50%,transparent)}
.cal-d.rest{background:color-mix(in srgb,var(--chip) 60%,transparent);color:var(--muted)}
.cal-d.meet{background:var(--gold-soft)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cal-dn{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.cal-dn b{font:800 18px/1 var(--display);color:var(--accent)}
.cal-dow{display:none}
.cal-tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 4px;color:var(--muted)}
.cal-tag.cl{background:var(--green);border-color:var(--green);color:#fff}
.cal-ti{display:block;font:700 13px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--fg);text-decoration:none;margin:2px 0 3px}
.cal-ti:hover{color:var(--accent);text-decoration:underline}
.cal-mt{font-weight:700;font-size:12px;background:var(--gold);color:var(--gold-ink);border-radius:5px;padding:2px 5px;margin:2px 0 4px}
.cal-ls div{margin:0 0 3px;overflow-wrap:anywhere}
ul.cal-ls{list-style:none;padding:0;margin:4px 0 0}
ul.cal-ls li{margin:0 0 3px;overflow-wrap:anywhere;list-style:none}
ul.cal-ls li.s-wu,ul.cal-ls li.s-str{margin:3px 0}
ul.cal-ls li.s-str{gap:4px;font-weight:600}
ul.cal-ls button.abbr.s-pill{font-size:11px;padding:1px 8px}
ul.cal-ls button.abbr.vl{font-size:11px;padding:0 7px}
ul.cal-ls .s-opt{color:var(--muted);font-style:italic}
.cal-tg{color:var(--accent)}
.cal-lift{color:var(--accent);font-weight:600}
.cal-opt{color:var(--muted);font-style:italic}
@media (max-width:900px){
  .cal-wh{display:none}
  .cal-g{grid-template-columns:1fr}
  .cal-d{border-right:0;min-height:0}
  .cal-d.out{display:none}
  .cal-dow{display:inline;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .cal-dn b{font-size:20px}
}
@media print{
  @page{size:landscape;margin:.3in}
  header.top,.subnav,.botnav,.cal-nav,.cal-filters,.cal-head + .note,.stack > .note:last-child{display:none!important}
  main{padding:0!important}
  .cal{box-shadow:none;border-color:#bbb}
  .cal-d{min-height:1.2in;font-size:8px;break-inside:avoid}
  .cal-wh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cal-d.meet .cal-mt,.cal-tag.cl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Tap-for-details codes + pop-up */
button.abbr{all:unset;cursor:pointer;color:inherit;font-weight:700;border-bottom:1.5px dotted var(--gold);padding:0 1px;border-radius:3px}
button.abbr:hover,button.abbr:focus-visible{background:var(--gold-soft);outline:none}
button.abbr::after{content:"ⓘ";font-size:.75em;margin-left:2px;color:var(--gold);vertical-align:super}
.ab-dlg{border:0;padding:0;border-radius:16px;max-width:min(720px,94vw);width:100%;max-height:86vh;background:var(--surface);color:var(--fg);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.ab-dlg::backdrop{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ab-in{display:flex;flex-direction:column;max-height:86vh}
.ab-hd{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:16px 18px 12px;border-bottom:3px solid var(--gold);background:var(--brand);color:#fff}
.ab-hd .eyebrow{color:var(--gold)}
.ab-hd h2{margin:2px 0 0;color:#fff;font-size:26px}
.ab-x{flex:none;width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:26px;line-height:1;cursor:pointer}
.ab-x:hover{background:rgba(255,255,255,.1)}
.ab-bd{padding:14px 18px 18px;overflow:auto}
.ab-bd details.lift > summary{display:none}
.ab-dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
.ab-dl dt{font-weight:700;color:var(--accent)}
.ab-dl dd{margin:0}

/* Athlete hub: my week */

.wkd{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.wkd > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.wkd > summary::-webkit-details-marker{display:none}
.wkd-d{display:grid;justify-items:center;min-width:48px;line-height:1.1}
.wkd-d b{font:800 18px var(--display);text-transform:uppercase;color:var(--accent)}
.wkd-d span{font-size:12px;color:var(--muted)}
.wkd-t{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.wkd-t > b{font:700 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.02em}
.wkd-mt{font-weight:700;font-size:12px;background:var(--gold);color:var(--gold-ink);border-radius:5px;padding:2px 6px}
.wkd-now{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:3px 9px}
.wkd-chev{font-size:22px;color:var(--muted);transition:transform .15s}
.wkd[open] .wkd-chev{transform:rotate(90deg)}
.wkd.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.wkd.meet{background:var(--gold-soft)}
.wkd.past{opacity:.6}
.wkd-b{padding:0 14px 12px 72px}
.wkd-b ul.wl{margin:0;padding-left:18px}
@media (max-width:600px){.wkd-b{padding:0 12px 12px 14px}}

.spt-best{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.spt-chg{font:700 12px var(--body);margin-top:2px}
.spt-chg.up{color:var(--accent)}
.spt-chg.down{color:var(--muted)}
.exv-in{width:100%;min-width:220px;font:14px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.exv-in:focus{outline:2px solid var(--gold);outline-offset:1px}
/* Simple view */
.seg-sm button{padding:5px 11px;font-size:13px}
li.s-wu{list-style:none;margin:4px 0 6px -18px}
li.s-wu + li.s-wu{margin-top:0}
button.abbr.s-pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;background:var(--chip)}
button.abbr.s-pill::after{content:"›";font-size:1.1em;vertical-align:baseline;margin-left:6px;color:var(--gold)}
li.s-str{list-style:none;margin:8px 0 4px -18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
button.abbr.vl{border:1px solid var(--gold);border-bottom-width:1px;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--accent);background:transparent}
button.abbr.vl::after{content:""}
li.s-opt{color:var(--muted);font-style:italic}

li.abc{list-style:none;margin:6px 0 8px -18px}
.abc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.abc-top b{font-weight:700}
.abc-seg button{padding:4px 10px;font-size:12.5px}
ul.abc-v{margin:6px 0 0;padding-left:18px}

/* Opening splash: bison + wind farm (once per visit; tap to skip; off for reduced motion) */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;align-content:center;gap:12px;overflow:hidden;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-hi{position:absolute;top:calc(env(safe-area-inset-top,0px) + 9vh);left:0;right:0;text-align:center;color:#cfd3d1;font:600 clamp(15px,3.6vw,20px)/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;animation:spUp .7s .9s ease-out both}
.sp-hi b{display:block;margin-top:6px;color:#fff;font:800 clamp(30px,8vw,52px)/1 var(--display);letter-spacing:.06em}
.sp-hi:empty{display:none}
.sp-glow{position:absolute;width:95vmin;height:95vmin;border-radius:50%;background:radial-gradient(circle,rgba(252,184,39,.42) 0%,rgba(252,184,39,.16) 35%,transparent 64%);top:calc(50% - 66vmin);animation:spGlow 1.2s ease-out both,spPulse 2.4s 1.2s ease-in-out infinite}
@keyframes spPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.06)}}
.sp-logo{position:relative;width:min(56vmin,300px);height:auto;filter:drop-shadow(0 0 2px rgba(255,255,255,.7)) drop-shadow(0 0 28px rgba(252,184,39,.55)) drop-shadow(0 18px 30px rgba(0,0,0,.6));animation:spLogo 1s cubic-bezier(.2,1.4,.4,1) both}
.sp-word{position:relative;font:800 clamp(22px,5vw,40px)/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#fff;animation:spUp .6s .45s ease-out both}
.sp-rule{position:relative;height:4px;width:min(46vmin,260px);background:#fcb827;border-radius:2px;transform-origin:center;animation:spRule .7s .6s cubic-bezier(.3,.9,.3,1) both}
.sp-farm{position:absolute;left:0;right:0;bottom:0;width:100%;height:32vh;fill:#cfd3d1;animation:spUp .9s .15s ease-out both}
.sp-farm rect{fill:#fcb827;opacity:.6}
.sp-farm .bl{animation:spSpin linear infinite}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spLogo{0%{opacity:0;transform:translateY(30px) scale(.6) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes spUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes spRule{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes spGlow{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}

let pcMsg = {kind:"",text:""};
const STR_LINE = /^(weight room|strength|home strength|jh strength)\b/i;
function planIssues(){
  const out = [];
  const where = (w, d, g) => `${dayDate(w, d.day).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})} · ${g}`;
  sortedWeeks().forEach(w => (w.days||[]).forEach(d => {
    const lists = [["Everyone", d.all||[]], ...Object.entries(d.groups||{}), ...(d.combos||[]).map(cb => [cb.groups.join(" + "), cb.items||[]])];
    lists.forEach(([g, arr]) => {
      const seen = new Set();
      arr.filter(Boolean).forEach(it => {
        const k = (it.lv||"") + "|" + it.t;
        if (seen.has(k)) out.push({w:w.start, kind:"dup", where: where(w,d,g), t: it.t, fix:"remove"}); seen.add(k);
        if (!it.lv && isRunLine(it.t)) {
          const hs = staleSet(arr, "HS").has(it), jh = staleSet(arr, "JH").has(it);
          if (hs && jh) out.push({w:w.start, kind:"stale", where: where(w,d,g), t: it.t, fix:"remove"});
          else if (hs || jh) out.push({w:w.start, kind:"stale1", where: where(w,d,g), t: it.t, fix: hs ? "JH" : "HS"});
        }
        const x = splitTags(it.t).text;
        if (STR_LINE.test(x) && !liftCode(x) && !inlineLifts(x) && !/^(weight room|strength)\b.*\b(learn|deload|first day)/i.test(x)) out.push({w:w.start, kind:"lift", where: where(w,d,g), t: it.t});
      });
    });
  }));

  off.forEach(s => out.push({kind:"off", where: `Saved as the week of ${parseD(s).toLocaleDateString("en-US",{month:"short",day:"numeric"})}`, t: `Merged into the week of ${parseD(mondayOf(s)).toLocaleDateString("en-US",{month:"short",day:"numeric"})}. Cleaning up saves it under the Monday.`, fix:"save"}));

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","||c==="\t"){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

function rankMark(a, ev){ const ks = RELAY_PROXY[ev]||[ev]; for(let i=0;i<ks.length;i++){ const k=ks[i]; if(a.prs[k]) return {k, mk:a.prs[k], tier: (k==="400 split"?0:i)}; } return null; }
function rankIds(ev, ids){

    if(mx && my) return (mx.tier-my.tier) || (mx.k===my.k ? better(mx.k)({mk:mx.mk},{mk:my.mk}) : markVal(mx.k,mx.mk)-markVal(my.k,my.mk)) || x.name.localeCompare(y.name);

  });
}

/* ---- Hub: fires to put out ---- */
function coverageGaps(){
  const out = [];
  ["HS","JH"].forEach(lv=>["B","G"].forEach(g=>{
    const team = lv+"-"+g;
    const useA = Object.values(ASSIGN[team]||{}).some(x=>x.length);
    const evs = useA ? teamEvents(team) : COVER_EVENTS[lv][g];
    const gaps = evs.map(ev=>{
      const n = useA ? (((ASSIGN[team]||{})[ev])||[]).length : ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[ev]).length;
      return {ev, n};
    }).filter(x=>x.n<2).sort((a,b)=>a.n-b.n);
    out.push({lv, g, team, gaps, useA});
  }));
  return out;
}
function hotRecruits(n){
  return REC.list.filter(r=>r.status==="open").map(r=>({r, h:heat(r), cs:REC.contacts.filter(c=>c.rid===r.id)}))
    .filter(x=>x.cs.length && x.h.score>0).sort((a,b)=>b.h.score-a.h.score || b.cs.length-a.cs.length).slice(0,n);
}
function recordWatch(n){
  const out = [];
  ["HS","JH"].forEach(lv=>["B","G"].forEach(g=>{
    (RECORDS[lv+"-"+g]||[]).forEach(r=>{
      if(!r.key) return;
      const rv = markVal(r.key, r.mk); if(!isFinite(rv)) return;
      ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[r.key] && !(lv==="HS" && a.grade===9) && !String(r.who).includes(a.name)).forEach(a=>{
        const av = markVal(r.key, a.prs[r.key]); if(!isFinite(av)) return;
        const field = FIELD.has(r.key);
        const gap = field ? rv-av : av-rv;          // >0 means still short of the record
        const pct = gap / rv;
        if(pct <= (field?0.10:0.06)) out.push({a, r, lv, g, gap, pct, field});
      });
    });
  }));
  return out.sort((x,y)=>x.pct-y.pct).slice(0,n);
}

  return `${x.gap<60 ? x.gap.toFixed(2)+"s" : tFmt(x.gap)} off`;
};

/* ---- Training paces (VDOT, Daniels/Gilbert formulas) ---- */
const PACE_SRC = [["1600",1600],["3200",3200],["XC 5K",5000],["XC 3K",3000]];  // 800 only if nothing else
const vdotOf = (m, sec) => { const t = sec/60, v = m/t; const vo2 = -4.60 + 0.182258*v + 0.000104*v*v;
  const pct = 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t); return vo2/pct; };
const vAt = V => (-0.182258 + Math.sqrt(0.182258**2 - 4*0.000104*(-4.60 - V))) / (2*0.000104);  // m/min
const paceFor = (V, frac, dist) => dist / vAt(V*frac) * 60;  // seconds
const mmss = s => { s = Math.round(s); const m = Math.floor(s/60), r = s - m*60; return m ? `${m}:${String(r).padStart(2,"0")}` : `${r}`; };

    if (c === '"' && cell === "") { q = true; continue; }

function cleanLink(v, host){
  v = String(v||"").trim(); if(!v) return "";
  if (host==="athletic.net" && /^\d+$/.test(v)) return v;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { const u = new URL(v); if (u.hostname===host || u.hostname.endsWith("."+host)) return u.href; } catch(e){}

}

function suToggle(id, field){

  const prevOf = (y,g,team) => { const py = C.rows.find(x=>x.yr===y.yr-1); const L = py && list(py,g); if(!L) return undefined; return L.find(r=>r[0]===team) || null; };
  const plD = (cur,prev) => { if(prev===undefined) return ""; if(prev===null) return `<span class="cf-d new">new</span>`; if(!cur[1]||!prev[1]) return `<span class="cf-d">·</span>`;
    const d = prev[1]-cur[1]; return d>0?`<span class="cf-d up" title="Up ${d} from ${ord(prev[1])}">▲${d}</span>`:d<0?`<span class="cf-d dn" title="Down ${-d} from ${ord(prev[1])}">▼${-d}</span>`:`<span class="cf-d" title="Same place">–</span>`; };
  const ptD = (cur,prev) => { if(!prev || cur[2]==null || prev[2]==null) return ""; const d = Math.round((cur[2]-prev[2])*2)/2;
    return `<span class="cf-p ${d>0?"up":d<0?"dn":""}">${d>0?"+":d<0?"−":"±"}${pts(Math.abs(d))}</span>`; };
  const yrs = g => `<div class="cf-yrs">${C.rows.slice().reverse().map(y=>{ const f = fin(y,g), msg = y["msg"+g];
      const bcRow = list(y,g) && list(y,g).find(x=>x[0]===BC), pv = bcRow ? prevOf(y,g,BC) : undefined;
      return `<div class="cf-yr ${f&&f.pl&&f.pl<=3?"top":""}"><span>${y.yr}</span><b>${f&&f.pl?ord(f.pl):"—"}</b><small>${f&&f.pl?pts(f.pts)+" pts · of "+f.of:msg?esc(msg.short||""):f&&f.out?"no team points":"not added yet"}</small>${pv?`<div class="cf-yd">${plD(bcRow,pv)}${ptD(bcRow,pv)}</div>`:""}</div>`; }).join("")}</div>`;
  const trend = g => `<div class="panel cf-trend"><div class="mlabel">${GN[g]}</div>${yrs(g)}</div>`;
  const table = (y,g) => { const L = list(y,g), msg = y["msg"+g];
    if(!L) return `<div class="panel cf-card"><h3 style="margin:0 0 6px">${GN[g]}</h3><p class="note" style="margin:0">${msg?esc(msg.long):"Results not added yet."}</p></div>`;
    const hasPrev = prevOf(y,g,"__")!==undefined; const rows = L.slice().sort((a,b)=>(a[1]??999)-(b[1]??999)); const bc = rows.find(r=>r[0]===BC);
    const above = bc && bc[1]>1 ? rows.filter(r=>r[1] && r[1]<bc[1] && r[2]>bc[2]).pop() : null;
    return `<div class="panel cf-card"><div class="bar"><h3 style="margin:0">${GN[g]}</h3>${bc?`<span class="muted" style="margin:0">BC ${bc[1]?ord(bc[1]):"—"}${above?` · ${pts(above[2]-bc[2])} pts out of ${ord(above[1])}`:""}</span>`:""}</div>
      <div class="tbl" style="border:0"><table><thead><tr><th>Pl</th><th>Team</th><th style="text-align:right">Pts</th>${hasPrev?`<th class="cf-ch" title="Change from ${y.yr-1}">vs ${y.yr-1}</th>`:""}</tr></thead><tbody>
      ${rows.map(r=>{ const pv = prevOf(y,g,r[0]); return `<tr class="${r[0]===BC?"cf-bc":""}"><td class="mono">${r[1]??"—"}</td><td>${esc(r[0])}</td><td class="mono" style="text-align:right">${pts(r[2])}</td>${hasPrev?`<td class="cf-ch">${plD(r,pv)}${ptD(r,pv)}</td>`:""}</tr>`; }).join("")}</tbody></table></div></div>`; };
  const years = () => C.rows.map(y=>`<div><h2 style="margin-bottom:10px">${y.yr}${y.note?` <span class="muted" style="font-size:15px">${esc(y.note)}</span>`:""}</h2><div class="cols">${table(y,"G")}${table(y,"B")}</div></div>`).join("");

  return {trend, yrs, years, legend};
}

function applySelfSignups(){

  const signed = {};
  ATHLETES.forEach(a=>{ const s = SIGN[a.id]; if(a.isNew && s && (s.ff || s.gf)) signed[keyOf(a.fullName||a.name,a.level,a.g)] = s.ff ? {d:s.ffd || "2026-11-03", by:SELF_BY} : {d:s.gfd || ((d=>isNaN(d)?"2026-11-05":iso(d))(new Date((INTEREST[a.id]||{}).ts||""))), by:SELF_GF}; });
  // New kids (not returners, not on the list yet) who signed up get added to the recruiting list automatically
  ATHLETES.forEach(a=>{ const k = keyOf(a.fullName||a.name,a.level,a.g);
    if(signed[k] && !REC.list.some(r=>keyOf(r.fullName||r.name,r.lvl,r.g)===k))
      REC.list.push({id:"ff-"+a.id, name:a.fullName||a.name, lvl:a.level, g:a.g, grade:a.grade, sport:"Other", status:"open", auto:true}); });
  REC.list = REC.list.filter(r=>!r.auto || r.status!=="open" || signed[keyOf(r.fullName||r.name,r.lvl,r.g)]);
  REC.contacts = REC.contacts.filter(c=>!c.self);
  REC.list.forEach(r=>{ const s = signed[keyOf(r.fullName||r.name,r.lvl,r.g)];
    if(s) REC.contacts.push({rid:r.id, by:s.by, self:true, heat:4, d:s.d}); });
}

  calendar(){

    const minM = new Date(2026,11,1), maxM = new Date(2027,5,1), cur = new Date(s.y, s.m, 1);
    const sprNote = s.g==="Sprints" && cur >= new Date(2027,2,1) ? `<p class="note">The spring sprint plan (March to State) is still being built. Meets are shown; daily workouts will fill in once it's posted.</p>` : "";

          <div class="ed-dayhead"><label class="ed-row" for="st-m-${i}" style="flex:1"><span>Muscle</span><input id="st-m-${i}" type="text" value="${esc(g.m)}" oninput="wu.stretch[${i}].m=this.value"></label>

          <label class="ed-row" for="st-w-${i}"><span>Why it matters</span><input id="st-w-${i}" type="text" value="${esc(g.why)}" oninput="wu.stretch[${i}].why=this.value"></label>
          <div class="ed-grid2">

            <label class="ed-g" for="st-x-${i}"><span>Also try</span><textarea id="st-x-${i}" rows="3" oninput="wu.stretch[${i}].x=this.value">${esc(g.x)}</textarea></label></div></div>`).join("")}

        <div class="ed-save"><button type="button" class="btn primary" onclick="wuSave()" ${saving?"disabled":""}>${saving?"Saving…":"Save warm-ups"}</button>

  },
  _sheets(){
    const weeks = printWeeks();
    if (!sh.week && weeks.length) { const cw = currentWeek() || nextWeek() || weeks[weeks.length-1]; sh.week = cw.start; }
    const w = printWeek(weeks.find(x=>x.start===sh.week));
    const toggleG = g => `sh.groups = sh.groups.includes('${g}') ? sh.groups.filter(x=>x!=='${g}') : CATEGORIES.filter(c=>c==='${g}'||sh.groups.includes(c)); render()`;
    const packet = sh.mode==="packet";
    const controls = `<div class="panel ed no-print">
        <div class="ed-row"><span>Print</span>${segBtns(sh.mode,[["day","Day sheets"],["packet","Week packet"]],"(v=>{sh.mode=v;render()})")}</div>
        ${packet ? `<p style="margin:0">A week packet is a cover page with every workout for the week, then a sheet for each group for each practice day (rest days skipped). Pick <b>Full program</b> for the whole thing, or a coach to print just their groups.</p>
        <label class="ed-row" for="sh-coach"><span>Packet for</span><select id="sh-coach" onchange="pickCoach(this.value)"><option value="" ${!sh.coach?"selected":""}>Full program (all groups)</option>
          ${STAFF.filter(s=>s.name).map(s=>`<option value="${esc(s.name)}" ${sh.coach===s.name?"selected":""}>${esc(s.name)} · ${esc(s.groups||s.role)}</option>`).join("")}</select></label>` : ""}
        <p style="margin:0;${packet?"display:none":""}">Pick a day and groups, then print. Each group gets its own page with the workout, the kids assigned to it (from <b>Event Assignments</b>), ${"paces for distance and mid,"} and boxes to write splits or marks.</p>
        <div class="ed-grid2">
          <label class="ed-row" for="sh-week"><span>Week</span><select id="sh-week" onchange="sh.week=this.value;sh.day='All';render()">
            ${weeks.map(x=>`<option value="${x.start}" ${x.start===sh.week?"selected":""}>${esc(weekLabel(x))}${parseD(x.start)>today?" (upcoming)":""}</option>`).join("")}
            <option value="" ${!w?"selected":""}>Blank sheet (no posted workout)</option></select></label>
          ${packet ? "" : w ? `<label class="ed-row" for="sh-day"><span>Day</span><select id="sh-day" onchange="sh.day=this.value;render()">
              <option value="All" ${sh.day==="All"?"selected":""}>Whole week</option>${w.days.map(d=>`<option ${sh.day===d.day?"selected":""}>${d.day}</option>`).join("")}</select></label>`
            : `<label class="ed-row" for="sh-date"><span>Date</span><input id="sh-date" type="date" value="${sh.blankDate}" onchange="sh.blankDate=this.value;render()"></label>`}
        </div>
        ${packet ? `<div class="ed-row"><span>Level</span>${segBtns(sh.plv,[["HS","HS"],["JH","JH"],["Both","HS and JH (separate sheets)"]],"(v=>{sh.plv=v;render()})")}</div>`
          : `<div class="ed-row"><span>Level</span>${segBtns(sh.lv,[["HS","HS"],["JH","JH"],["Both","HS + JH together"]],"(v=>{sh.lv=v;render()})")}</div>`}
        <div class="ed-row" style="align-items:start"><span>Groups</span><div class="combo-picks">${CATEGORIES.map(g=>`<button type="button" class="pick" aria-pressed="${sh.groups.includes(g)}" onclick="${toggleG(g)}">${g}</button>`).join("")}</div></div>
        <div class="ed-grid2">
          <label class="ed-row" for="sh-cols"><span>Boxes per kid</span><input id="sh-cols" type="number" min="3" max="12" value="${sh.cols}" onchange="sh.cols=+this.value;render()"></label>
          <label class="ed-check" for="sh-pace"><input id="sh-pace" type="checkbox" ${sh.paces?"checked":""} onchange="sh.paces=this.checked;render()"> Show paces (Distance &amp; Mid)</label>
        </div>
        <div class="ed-row"><span>Who's on the sheet</span>${segBtns(sh.winter,[["auto","Auto"],["on","★ Winter only"],["off","Everyone"]],"(v=>{sh.winter=v;render()})")}</div>
        <p class="note" style="margin:0"><b>Auto</b> prints only ★ winter conditioning kids before official practice starts (${parseD(OFFICIAL_START).toLocaleDateString("en-US",{month:"short",day:"numeric"})}), and everyone after. ${WINTER.ids.length?`${WINTER.ids.length} kid${WINTER.ids.length===1?"":"s"} starred.`:"No one is starred yet, so everyone prints."}
          <a href="#coaches" onclick="sh.wedit=!sh.wedit;render();return false">${sh.wedit?"Done starring":"★ Star winter kids"}</a></p>
        ${sh.wedit ? (()=>{ const lvs = sh.lv==="Both" ? ["HS","JH"] : [sh.lv];
            const pool = sh.wall ? ATHLETES.filter(a=>lvs.includes(a.level)) : [...new Map(lvs.flatMap(l=>sh.groups.flatMap(g=>groupRoster(l,g))).map(a=>[a.id,a])).values()];
            pool.sort((x,y)=>x.level.localeCompare(y.level) || x.g.localeCompare(y.g) || x.name.localeCompare(y.name));
            return `<div class="panel" style="padding:12px 14px"><div class="bar"><b>Tap to star kids doing December conditioning</b>
              <label class="ed-check" for="w-all"><input id="w-all" type="checkbox" ${sh.wall?"checked":""} onchange="sh.wall=this.checked;render()"> Show every athlete, not just the groups picked above</label></div>
              <p class="note" style="margin:0 0 6px">Tap to cycle: ☆ not doing it → ★ doing it → ◐ maybe / some sessions.</p><div class="wstars">${pool.map(a=>`<button type="button" class="wstar" aria-pressed="${isWinter(a)}" title="${esc(WINTER.maybe[a.id]||"")}" onclick="toggleWinter('${a.id}')"><span>${isWinterMaybe(a)?"◐":isWinter(a)?"★":"☆"}</span>${esc(a.name)} <small>${a.level} ${a.g}</small>${WINTER.follow[a.id]?` <small>⚑</small>`:""}</button>`).join("") || `<span class="muted">No athletes in these groups.</span>`}</div>
              <p class="ed-msg ${wMsg.kind}" role="status" style="margin:6px 0 0">${esc(wMsg.text)}</p></div>`; })() : ""}
        <div class="ed-save"><button type="button" class="btn primary" onclick="window.print()" ${sh.groups.length?"":"disabled"}>${packet?"Print packet":"Print sheets"}</button>
          <span class="note" style="margin:0">To save a PDF instead, choose <b>Save as PDF</b> as the printer.</span></div>
      </div>`;
    const sheets = !sh.groups.length ? `<p class="note">Pick at least one group.</p>` : packet ? buildPacket() : buildSheets();
    const pages = (sheets.match(/<section class="sheet/g)||[]).length;
    return controls + `<div class="sheets-wrap"><div class="no-print mlabel" style="margin:0">Preview · ${pages} page${pages===1?"":"s"}</div>${sheets}</div>`;
  },
  _import(){

          <span class="ed-msg ${imp.msg.kind}" role="status">${esc(imp.msg.text)}</span></div>
        ${imp.rows?`<div class="tbl"><table><thead><tr><th>Athlete</th><th>Date</th><th>What</th></tr></thead><tbody>
          ${imp.rows.map(({r,a})=>`<tr class="${a?"":"dim"}"><td>${a?esc(a.name):`<span class="ed-msg err">No match: ${esc(r.name||r.id||"?")}</span>`}</td><td class="mono">${esc(r.d||(r.meet?"meet":""))}</td><td>${esc(impSummary(r))}</td></tr>`).join("")}
          </tbody></table></div>`:""}
      </div>`;

  _dataEdit(){

        <span class="ed-msg ${dlMsg.kind}" role="status">${esc(dlMsg.text)}</span></div>`;

      <div class="panel ed"><h2>Log a workout</h2>

        <label class="ed-row" for="dl-d"><span>Date</span><input id="dl-d" type="date" value="${wf.d}" onchange="wf.d=this.value"></label>

        ${wf.kind==="lift" ? `<div class="reps"><div class="rephead lift"><span>Exercise</span><span>Sets</span><span>Reps</span><span>Weight (lb)</span><span></span></div>
          ${wf.lifts.map((x,i)=>`<div class="rep lift">
            <input id="lf-e-${i}" type="text" list="lf-names" value="${esc(x.ex)}" placeholder="${i?"":"Back squat"}" aria-label="Exercise ${i+1}" oninput="wf.lifts[${i}].ex=this.value">
            <input id="lf-s-${i}" type="number" min="1" step="1" inputmode="numeric" value="${esc(x.sets)}" aria-label="Exercise ${i+1} sets" oninput="wf.lifts[${i}].sets=this.value">
            <input id="lf-r-${i}" type="text" inputmode="numeric" value="${esc(x.reps)}" placeholder="5" aria-label="Exercise ${i+1} reps" oninput="wf.lifts[${i}].reps=this.value">
            <input id="lf-w-${i}" type="number" min="0" step="2.5" inputmode="decimal" value="${esc(x.wt)}" placeholder="Body" aria-label="Exercise ${i+1} weight" oninput="wf.lifts[${i}].wt=this.value">
            <button type="button" class="btn sm" aria-label="Remove exercise ${i+1}" onclick="wf.lifts.splice(${i},1);render()">×</button></div>`).join("")}
          <datalist id="lf-names">${["Back squat","Front squat","Goblet squat","Trap bar deadlift","RDL","Bench press","Push press","Power clean","Hang clean","Box jumps","Step-ups","Walking lunges","Split squat","Hip thrust","Pull-ups","Rows","Core circuit"].map(n=>`<option value="${n}"></option>`).join("")}</datalist>

          ${wf.reps.map((r,i)=>`<div class="rep"><span class="repn">${i+1}</span>
            <input id="rp-d-${i}" type="number" min="0" step="any" inputmode="decimal" value="${esc(r.dist)}" placeholder="${i?wf.reps[i-1].dist||"400":"400"}" aria-label="Rep ${i+1} distance" oninput="wf.reps[${i}].dist=this.value">
            <select id="rp-u-${i}" aria-label="Rep ${i+1} unit" onchange="wf.reps[${i}].unit=this.value"><option value="m" ${r.unit==="m"?"selected":""}>m</option><option value="mi" ${r.unit==="mi"?"selected":""}>mi</option></select>
            <input id="rp-t-${i}" type="text" inputmode="decimal" value="${esc(r.time)}" placeholder="1:18.4" aria-label="Rep ${i+1} time" oninput="wf.reps[${i}].time=this.value">
            <button type="button" class="btn sm" aria-label="Remove rep ${i+1}" onclick="wf.reps.splice(${i},1);render()">×</button></div>`).join("")}
          <div class="ed-add"><button type="button" class="btn sm" onclick="wf.reps.push(newRep(wf.reps.at(-1)));render()">+ Add rep</button>
            <button type="button" class="btn sm" onclick="const d=wf.reps[0]&&wf.reps[0].dist,u=wf.reps[0]&&wf.reps[0].unit;wf.reps.forEach(r=>{if(!r.dist){r.dist=d;r.unit=u}});render()">Copy rep 1 distance to all</button></div></div>`
        : `<label class="ed-row" for="fa-ev"><span>Event</span><select id="fa-ev" onchange="wf.ev=this.value;render()">${FIELD_EVS.map(([k,l])=>`<option value="${k}" ${wf.ev===k?"selected":""}>${l}</option>`).join("")}</select></label>

        <div class="ed-save"><button type="button" class="btn primary" onclick="dlAddWorkout()" ${saving?"disabled":""}>Add workout</button></div></div>
      <div class="panel ed"><h2>Add a meet result</h2>

          ${a.meets.map((m,i)=>`<tr><td>${esc(m.m)}</td><td>${esc(m.ev)}</td><td class="mono">${esc(m.mk)}${m.pl?` · ${esc(m.pl)}`:""}</td><td class="ed-acts">${rm("meets",i)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">None yet.</p>`}</div>

  _tagEdit(){

          <td>${sel(a.id,"lv",lv==="JH"?LEVEL_NAMES_JH:LEVEL_NAMES,"Level")}</td><td>${sel(a.id,"path",lv==="JH"?PATH_NAMES_JH:PATH_NAMES,"Pathway")}</td>
          ${lv==="JH"?`<td>${chk(a.id,"hs","Invited")}</td><td>${sel(a.id,"champ",CHAMP_NAMES,"Championship")}</td><td>${txt(a.id,"vol","e.g. 90",60)}</td>`:""}

      </tbody></table></div>`;
    return `<p class="lede" style="margin:0">Give each distance and mid-distance runner a level and a pathway. When they pick their name on the Workouts page, they only see their version of each workout, with their paces.</p>
      <div class="panel ed"><h2>High school</h2>${tbl("HS")}</div>
      <div class="panel ed"><h2>Junior high</h2><p class="note" style="margin:0 0 8px"><b>Advanced</b> = established runner with a proven training history (not just a fast PR). <b>Development</b> = consistent JH runner (the as-written plan). <b>Foundation</b> = newer or lower-volume runner. <b>HS group invite</b> lets an advanced runner see the invite to join HS warm-ups, drills, and strength on Tuesdays. Nothing here adds mileage automatically.</p>${tbl("JH")}</div>
      <div class="ed-save sticky"><button type="button" class="btn primary" onclick="dtSave()" ${saving?"disabled":""}>${saving?"Saving…":"Save tags"}</button>

        <li>Start a line in Post Workouts with a tag to show it only to those runners: <span class="tchip">[A]</span><span class="tchip">[B]</span><span class="tchip">[C]</span> for level (JH: Advanced / Development / Foundation), <span class="tchip">[Distance]</span><span class="tchip">[Hybrid]</span><span class="tchip">[Mid]</span> for pathway, <span class="tchip">[Girls]</span><span class="tchip">[Boys]</span>, <span class="tchip">[HS-ready]</span> for invited JH runners.</li>
        <li>Mix them: <b>[B] [Hybrid] 3 × 4 min Tempo</b> shows to Level B hybrids only. A line with no tag is for everyone.</li>
        <li>Use the Paces page words so the Paces button works: <b>Easy, Steady, Tempo, Interval, Rep pace, 800 pace, 1600 pace, 3200 pace</b>. Write rep distances like <b>4 × 200m</b>.</li>
        <li>Runners with no level or pathway set see every version.</li></ul></div>`;
  },

          <div class="ed-add">

            ${contactsFor(sel.id).map(({c,i})=>`<tr><td class="mono">${shortD(c.d)}</td><td>${esc(c.by)}</td><td>${scaleTag(c)}</td>
              <td class="ed-acts">${rcDel==="c"+i?`<button type="button" class="btn sm danger" onclick="rcRemoveContact(${i})">Confirm</button>`:`<button type="button" class="btn sm" onclick="rcDel='c${i}';render()">Remove</button>`}</td></tr>`).join("")}

          <p class="note" style="margin:0">For the form kids fill out after talking to a recruit. (The track <b>interest form</b> goes on <a href="#signups">Sign-ups</a> instead.) Open the form's response sheet, select all, copy, and paste here. Columns are matched by their headers: recruit, your name, how likely (1–5), timestamp. Repeats are skipped.</p>

  _asgEdit(){
    const [lv,g] = asg.team.split("-");
    const w = asgWork(); const t = w[asg.team] || {};
    const pre = (asg.pre||[]).includes(asg.team);
    const pool = ATHLETES.filter(a=>a.level===lv && a.g===g && (asg.cat==="All"||a.cats.includes(asg.cat)) && (!asg.q||a.name.toLowerCase().includes(asg.q.toLowerCase())))
      .sort((a,b)=>a.name.localeCompare(b.name));
    const over = pool.filter(a=>asgCount(asg.team,a.id)>MAX_EVENTS);
    const fresh = pool.filter(a=>!trackEvs(a).length && asgCount(asg.team,a.id)===0);
    const rest = pool.filter(a=>!over.includes(a) && !fresh.includes(a));
    const selA = ATHLETES.find(a=>a.id===asg.sel);
    const teams = [["HS-B","HS Boys"],["HS-G","HS Girls"],["JH-B","JH Boys"],["JH-G","JH Girls"]];
    return `<div class="panel ed-help"><b>How it works.</b> Each athlete gets ${MAX_EVENTS} events max, relays included. Drag an athlete onto an event. On a phone or tablet, tap an athlete, then tap the event. Tap × to take someone off. Hit <b>Save</b> when you're done; the public Coverage page updates from this.</div>
      <div class="bar" style="justify-content:flex-start">
        <div class="seg" role="group" aria-label="Team">${teams.map(([k,l])=>`<button type="button" aria-pressed="${asg.team===k}" onclick="asg.team='${k}';asg.sel=null;render()">${l}</button>`).join("")}</div>
        <button type="button" class="btn primary" onclick="asgSave()" ${!(asg.dirty||pre)||saving?"disabled":""}>${saving?"Saving…":(asg.dirty||pre)?"Save assignments":"Saved"}</button>
        ${asg.dirty?`<button type="button" class="btn sm" onclick="asgDiscard()">Discard changes</button><span class="ed-msg err">Unsaved changes</span>`:pre?`<span class="ed-msg">Pre-loaded from the events each kid has done. Adjust, then save.</span>`:""}
        <span class="ed-msg ${asg.msg.kind}" role="status">${esc(asg.msg.text)}</span>
      </div>
      <div class="asg">
        <aside class="asg-pool panel">
          <h3>${esc(teams.find(x=>x[0]===asg.team)[1])}</h3>
          <input id="asg-q" class="search" type="search" placeholder="Search name" value="${esc(asg.q)}" oninput="asg.q=this.value;render();const e=document.getElementById('asg-q');e.focus();e.setSelectionRange(e.value.length,e.value.length)" style="max-width:none">
          <select id="asg-cat" aria-label="Event group" onchange="asg.cat=this.value;render()"><option value="All">All event groups</option>${CATEGORIES.map(c=>`<option ${asg.cat===c?"selected":""}>${c}</option>`).join("")}</select>
          ${selA?`<p class="asg-hint">Tap an event to add <b>${esc(selA.name)}</b>. <button type="button" class="btn sm" onclick="asg.sel=null;render()">Cancel</button></p>`:""}
          ${(()=>{ const chip = a => { const n = asgCount(asg.team, a.id); return `<button type="button" class="pchip ${asg.sel===a.id?"sel":""} ${n>MAX_EVENTS?"over":n>=MAX_EVENTS?"full":""} ${!trackEvs(a).length&&!n?"fresh":""}" draggable="${n<MAX_EVENTS}"
              ondragstart="dragId='${a.id}';try{event.dataTransfer.setData('text/plain','${a.id}');event.dataTransfer.effectAllowed='copy'}catch(e){}"
              onclick="${n>=MAX_EVENTS?`asg.msg={kind:'err',text:'${esc(a.name).replace(/'/g,"\\'")} already has ${MAX_EVENTS} events.'};render()`:`asg.sel=asg.sel==='${a.id}'?null:'${a.id}';render()`}">
              <span>${esc(a.name)}</span><small>${a.grade??""} · ${n}/${MAX_EVENTS}</small></button>`; };
            const sec = (cls, title, arr) => arr.length ? `<div class="asg-sec ${cls}"><h4>${title} <span>${arr.length}</span></h4><div class="asg-list">${arr.map(chip).join("")}</div></div>` : "";
            return (sec("bad","Too many events. Adjust these", over) + sec("new","No track events yet. Ready to place", fresh) + sec("", "Everyone else", rest)) || `<p class="note">No athletes match.</p>`; })()}
        </aside>
        <div class="asg-evs">${teamEvents(asg.team).map(ev=>{ const ids = t[ev]||[]; const st = ids.length>=2?"ok":ids.length===1?"thin":"gap";
          return `<div class="evbox ${asg.sel?"armed":""}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="asgDrop(event,'${ev}')" onclick="if(asg.sel&&!event.target.closest('.x'))asgAdd('${ev}')">
            <div class="evbox-h"><b>${esc(evLabel(ev))}</b><span class="cov ${st}">${ids.length}</span></div>
            <div class="evbox-b">${rankIds(ev, ids).map(a=>{ const id = a.id; const r = rankMark(a, ev); const mk = r ? (RELAY_PROXY[ev] ? `${evn(r.k).replace(" relay split"," split")} ${r.mk}` : r.mk) : "";
              return `<span class="achip ${asgCount(asg.team,a.id)>MAX_EVENTS?"over":""} ${r?"":"nomark"}">${esc(a.name)}${mk?` <small>${esc(mk)}</small>`:` <small>no mark</small>`}<button type="button" class="x" aria-label="Remove ${esc(a.name)} from ${esc(evLabel(ev))}" onclick="event.stopPropagation();asgRemove('${ev}','${id}')">×</button></span>`; }).join("") || `<span class="muted">Drop athletes here</span>`}</div>
          </div>`; }).join("")}</div>
      </div>`;
  },
  _post(){
    if(!ed) edNew();

    const dayOpts = DAYS.filter(d=>!ed.days.some(x=>x.day===d));
    return `${planCheckHTML()}<p class="lede" style="margin:0">Fill in a week and save. Everyone can see it right away, including future weeks, so runners can look ahead.</p>

      ${weeks.length?`<div><h2 style="margin-bottom:10px">Posted weeks</h2><div class="tbl"><table><thead><tr><th>Week</th><th>Status</th><th>Days</th><th></th></tr></thead><tbody>
        ${weeks.map(w=>`<tr><td><b>Week ${weekNum(w)}</b> · ${esc(weekLabel(w))}</td><td>${parseD(w.start)<=today?`<span class="chip home">Started</span>`:`<span class="chip">Upcoming</span>`}</td>
          <td>${w.days.map(d=>d.day).join(", ")}</td>
          <td class="ed-acts"><button type="button" class="btn sm" onclick="edLoad('${w.start}')">Edit</button><button type="button" class="btn sm" onclick="edDup('${w.start}')">Duplicate</button>

      </tbody></table></div></div>`:""}
      <div class="panel ed">
        <div class="bar"><h2>${ed.editing?`Editing week of ${esc(parseD(ed.editing).toLocaleDateString("en-US",{month:"short",day:"numeric"}))}`:"New week"}</h2>
          ${ed.editing?`<button type="button" class="btn sm" onclick="ed=null;render()">Start a new week instead</button>`:""}</div>
        <label class="ed-row" for="ed-start"><span>Week starts</span><input id="ed-start" type="date" value="${ed.start}" onchange="ed.start=this.value"></label>
        ${ed.days.map((d,di)=>`<div class="ed-day">
          <div class="ed-dayhead"><h3>${d.day}</h3>
            <label class="ed-check" for="ed-mv-${di}">Move to <select id="ed-mv-${di}" style="width:auto" onchange="edMoveDay(${di}, this.value)">${DAYS.map(x=>`<option value="${x}" ${x===d.day?"selected":""} ${x!==d.day&&ed.days.some(y=>y.day===x)?"disabled":""}>${x}</option>`).join("")}</select></label>
            <label class="ed-check" for="ed-split-${di}"><input id="ed-split-${di}" type="checkbox" ${d.split?"checked":""} onchange="ed.days[${di}].split=this.checked;render()"> JH and HS have different focus</label>
            <button type="button" class="btn sm" onclick="ed.days.splice(${di},1);render()" aria-label="Remove ${d.day}">Remove day</button></div>
          <label class="ed-row" for="ed-ss-${di}"><span>HS session</span><select id="ed-ss-${di}" onchange="edSess(${di}, this.value)"><option value="">Not set</option>${Object.entries(SESS_K).map(([k,[l]])=>`<option value="${k}" ${((d.sess||{}).HS||{}).kind===k?"selected":""}>${esc(l)}</option>`).join("")}</select></label>
          <label class="ed-row" for="ed-gm-${di}"><span>Mid Distance focus</span><input id="ed-gm-${di}" type="text" value="${esc((d.gfocus||{})["Mid Distance"]||"")}" placeholder="optional, e.g. Max velocity" oninput="(ed.days[${di}].gfocus=ed.days[${di}].gfocus||{})['Mid Distance']=this.value"></label>
          ${d.split?`<div class="ed-grid2">
              <label class="ed-row" for="ed-fj-${di}"><span>JH focus</span><input id="ed-fj-${di}" type="text" value="${esc(d.fJH)}" placeholder="e.g. Meet" oninput="ed.days[${di}].fJH=this.value"></label>
              <label class="ed-row" for="ed-fh-${di}"><span>HS focus</span><input id="ed-fh-${di}" type="text" value="${esc(d.fHS)}" placeholder="e.g. Speed" oninput="ed.days[${di}].fHS=this.value"></label></div>`
            :`<label class="ed-row" for="ed-f-${di}"><span>Focus</span><input id="ed-f-${di}" type="text" value="${esc(d.focus)}" placeholder="e.g. Speed, Aerobic, Technique" oninput="ed.days[${di}].focus=this.value"></label>`}
          <div class="combos">
            <div class="combos-h"><span class="mlabel" style="margin:0">Same workout for several groups</span>
              <span class="combo-presets">${COMBO_PRESETS.map(([l,...gs])=>`<button type="button" class="btn sm" onclick='edAddCombo(${di}, ${JSON.stringify(gs)})'>+ ${esc(l)}</button>`).join("")}</span></div>
            ${(d.combos||[]).map((cb,ci)=>`<div class="combo-ed">

              <textarea id="ed-${di}-cb${ci}" rows="2" aria-label="Workout for ${esc(cb.groups.join(", "))}" placeholder="e.g. 30 min easy run" oninput="ed.days[${di}].combos[${ci}].txt=this.value">${esc(cb.txt)}</textarea>

        ${dayOpts.length?`<div class="ed-add"><span>Add a day:</span>${dayOpts.map(d=>`<button type="button" class="btn sm" onclick="edAddDay('${d}')">+ ${d}</button>`).join("")}</div>`:""}
        <div class="ed-save"><button type="button" class="btn primary" id="ed-savebtn" onclick="edSave()" ${saving?"disabled":""}>${saving?"Saving…":ed.editing?"Save changes":"Post week"}</button>
          <span class="ed-msg ${edMsg.kind}" role="status">${esc(edMsg.text)}</span></div>

  warmups(){
    const tabs = [["warm","Warm-ups"],["stretch","Stretching"],["sore","Soreness vs. pain"],["injury","Common injuries"],["ice","Ice: the research"]];
    const head = `${back}<div class="stack"><div><div class="eyebrow">Routines &amp; recovery</div><h1>Warm-ups &amp; Care</h1></div>
      <div class="seg" role="group" aria-label="Section">${tabs.map(([k,l])=>`<button type="button" aria-pressed="${wtab===k}" onclick="wtab='${k}';render()">${l}</button>`).join("")}</div>`;
