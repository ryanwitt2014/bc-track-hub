    const tellCoach = `<div class="panel care-alert"><b>If something hurts in a way that changes how you run, stop and tell a coach that day.</b> Coaches and the athletic trainer decide when you're ready to go again. This page is general info, not a diagnosis.</div>`;
    let body = "";
    if (wtab==="stretch") {
      const list = WARMUPS.stretch || STRETCH_DEFAULT;
      body = `<div class="panel"><h2>Stretching basics</h2><ul class="exp">${STRETCH_RULES.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
        <div class="muscles">${list.map(g=>`<div class="panel muscle"><h3>${esc(g.m)}</h3>${g.why?`<p class="note" style="margin:4px 0 0">${esc(g.why)}</p>`:""}
          ${g.s&&g.s.length?`<div class="mlabel">Stretches</div><ul class="mlist">${g.s.map(x=>`<li><span>${itemHTML(x)}</span>${x.d?`<em>${esc(x.d)}</em>`:""}</li>`).join("")}</ul>`:""}
          ${g.x&&g.x.length?`<div class="mlabel">Also try</div><ul class="mlist">${g.x.map(x=>`<li><span>${itemHTML(x)}</span>${x.d?`<em>${esc(x.d)}</em>`:""}</li>`).join("")}</ul>`:""}
        </div>`).join("")}</div>`;
    } else if (wtab==="sore") {
      body = `<div class="cols">
          <div class="panel care-sore"><h2>Normal soreness</h2><p class="note" style="margin:4px 0 0">Keep training, maybe a little easier.</p><ul class="exp">${SORE_VS_PAIN.sore.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
          <div class="panel care-pain"><h2>Pain to report</h2><p class="note" style="margin:4px 0 0">Stop and tell a coach.</p><ul class="exp">${SORE_VS_PAIN.pain.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        </div>
        <div class="panel"><h2>DOMS: the day-after soreness</h2><p style="margin:8px 0 0;max-width:68ch">${esc(DOMS.what)}</p>
          <div class="mlabel">What helps</div><ul class="exp">${DOMS.helps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
          <p class="note">${esc(DOMS.note)}</p></div>
        ${tellCoach}`;
    } else if (wtab==="ice") {
      const R = ICE_RESEARCH;
      const acro = (word, rows) => `<div class="panel"><h2 class="acro-word">${word}</h2><dl class="acro">${rows.map(([l,w,d])=>`<dt>${l}</dt><dd><b>${esc(w)}</b><span>${esc(d)}</span></dd>`).join("")}</dl></div>`;
      body = `<div class="panel care-alert"><b>Short version:</b> ${esc(R.bottom)}</div>
        <div class="cols">${R.points.map(x=>`<div class="panel"><h3>${esc(x.h)}</h3><p style="margin:6px 0 0">${esc(x.p)}</p></div>`).join("")}</div>
        <div><h2>What's replaced RICE: PEACE &amp; LOVE</h2><p class="note" style="margin:4px 0 0">PEACE for the first few days, then LOVE as it heals.</p></div>
        <div class="cols">${acro("PEACE", R.peace)}${acro("LOVE", R.love)}</div>
        <div class="panel"><h3>Sources</h3><ul class="exp">${R.sources.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`).join("")}</ul></div>
        ${tellCoach}`;
    } else if (wtab==="injury") {
      body = `<div class="injuries">${INJURIES.map(i=>`<div class="panel inj"><h3>${esc(i.n)}</h3>
          <dl class="inj-dl"><dt>Feels like</dt><dd>${esc(i.feel)}</dd><dt>Usually from</dt><dd>${esc(i.why)}</dd></dl>
          <div class="mlabel">What helps</div><ul class="exp">${i.help.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
          <p class="inj-flag"><b>See the athletic trainer:</b> ${esc(i.flag)}</p></div>`).join("")}</div>
        <p class="note">Wondering why ice isn't front and center? See <a href="#warmups" onclick="wtab='ice';render();return false">Ice: the research</a>.</p>${tellCoach}`;
    } else {
      body = `<div class="cols">${block("Distance &amp; Mid-Distance", WARMUPS.distance||WARMUPS.practice, "Every distance and 400/800 practice")}${block("Sprints, Hurdles &amp; Jumps", WARMUPS.sprint||WARMUPS.practice, "High school fast days")}</div>
        <div class="cols">${block("Sprints, Hurdles &amp; Jumps · Junior High", WARMUPS.sprintjh||WARMUPS.sprint, "Junior high fast days. One cue at a time.")}</div>
        <div class="cols">${block("General", WARMUPS.practice, "Throwers, combined days, or no group yet")}${block("Cool-down", WARMUPS.cooldown, "Everyone, end of practice")}</div>
        <div><h2>Field events</h2><p class="note" style="margin:4px 0 0">After the Practice warm-up, go to your event.</p></div>
        <div class="cols">${Object.entries(WARMUPS.field).map(([ev,arr])=>block(ev,arr)).join("")}</div>
        <p class="note">After practice, hit the <a href="#warmups" onclick="wtab='stretch';render();return false">Stretching</a> tab for your event's muscles.</p>`;
    }
    return head + body + `</div>`;
  },
  conference(){
    const C = CONF[level], K = meetKit(C);
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">${esc(C.meet)}</div><h1>Conference</h1></div><div class="bar">${levelToggle()}</div></div>
      <div><h2 style="margin-bottom:10px">Benton Central's finish</h2><div class="cols">${K.trend("G")}${K.trend("B")}</div></div>
      ${K.years()}${K.legend}</div>`;
  },
  postseason(){
    const kits = POST.map(C=>({C, K:meetKit(C)}));
    const tab = kits.find(x=>x.C.id===ptab) || kits[0];
    return `${back}<div class="stack"><div><div class="eyebrow">High school · IHSAA postseason</div><h1>Postseason</h1></div>
      <div><h2 style="margin-bottom:10px">Benton Central's finish</h2>
        <div class="cols">${["G","B"].map(g=>`<div class="panel cf-trend"><div class="mlabel">${GN[g]}</div>${kits.map(({C,K})=>`<div class="cf-sub">${esc(C.short)}</div>${K.yrs(g)}`).join("")}</div>`).join("")}</div></div>
      <div class="seg" role="group" aria-label="Meet">${kits.map(({C})=>`<button type="button" aria-pressed="${tab.C.id===C.id}" onclick="ptab='${C.id}';render()">${esc(C.short)}</button>`).join("")}</div>
      ${tab.K.years()}${tab.K.legend}</div>`;
  },
  records(){
    const pool = ATHLETES.filter(a=>a.level===level && a.g===gsel);
    const top = {};
    pool.forEach(a=>Object.entries(a.prs).forEach(([ev,mk])=>{ if(ev==="400 split") return; (top[ev] ||= []).push({a,mk}); }));
    const evs = Object.keys(top).sort((x,y)=>Object.keys(EV_NAME).indexOf(x)-Object.keys(EV_NAME).indexOf(y));
    const recs = RECORDS[level+"-"+gsel] || [];
    const beaters = r => !r.key ? [] : pool.filter(a=>!(level==="HS" && a.grade===9) && a.prs[r.key] && better(r.key)({mk:a.prs[r.key]},{mk:r.mk})<0 && !String(r.who).includes(a.name)).map(a=>({a, mk:a.prs[r.key]}));
    const setTabs = `<div class="seg" role="group" aria-label="Record set">${[["school","High School & Junior High"],["elem","Elementary"]].map(([k,l])=>`<button type="button" aria-pressed="${rset===k}" onclick="rset='${k}';render()">${l}</button>`).join("")}</div>`;
    if (rset==="elem") {
      return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Benton Central feeder schools</div><h1>Records</h1></div>
        <div class="bar">${segBtns(gsel,[["B","Boys"],["G","Girls"]],"setG")}</div></div>${setTabs}
        <div class="elem">${ELEM_SCHOOLS.map(sc=>{ const recs = (ELEM_RECORDS[sc]||{})[gsel]||[];
          return `<div class="panel"><h2>${esc(sc)}</h2><div class="mlabel">${GN[gsel]}</div>
          ${recs.length?`<div class="tbl" style="border:0"><table><thead><tr><th>Event</th><th>Mark</th><th>Holder</th><th>Year</th></tr></thead><tbody>
            ${recs.map(r=>`<tr><td>${esc(r.ev)}</td><td class="mono">${esc(r.mk)}</td><td>${esc(r.who)}</td><td class="mono">${esc(String(r.yr))}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note" style="margin:8px 0 0">Records coming soon.</p>`}</div>`; }).join("")}</div></div>`;
    }
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Benton Central</div><h1>Records</h1></div>
      <div class="bar">${levelToggle()}${segBtns(gsel,[["B","Boys"],["G","Girls"]],"setG")}</div></div>${setTabs}
      <div class="cols">
        <div><h2 style="margin-bottom:10px">School records</h2>
          ${recs.length?`<div class="tbl"><table><thead><tr><th>Event</th><th>Mark</th><th>Holder</th><th>Year</th></tr></thead><tbody>
          ${recs.map(r=>{ const b = beaters(r); return `<tr class="${b.length?"rec-hit":""}"><td>${esc(r.ev)}</td><td class="mono">${esc(r.mk)}</td><td>${esc(r.who)}</td><td class="mono">${r.yr}</td></tr>
            ${b.length?`<tr class="rec-hit"><td colspan="4"><span class="chip gold">Beaten?</span> ${b.map(x=>`<a href="#a-${x.a.id}">${esc(x.a.name)}</a> ${esc(x.mk)}${x.a.pri&&x.a.pri[r.key]?` <span class="muted">(${esc(x.a.pri[r.key])})</span>`:""}`).join(", ")}</td></tr>`:""}`; }).join("")}</tbody></table></div>`
          :`<div class="panel"><p class="note" style="margin:0">${level} ${GN[gsel].toLowerCase()} school records haven't been added yet.</p></div>`}</div>
        <div><h2 style="margin-bottom:10px">Top returning marks</h2><div class="tbl"><table><thead><tr><th>Event</th><th>Athlete</th><th>Mark</th></tr></thead><tbody>
          ${evs.map(ev=>top[ev].sort(better(ev)).slice(0,5).map((x,i)=>`<tr><td>${i?"":`<span class="lvl">${esc(evn(ev))}</span>`}</td><td><a href="#a-${x.a.id}">${esc(x.a.name)}</a> <span class="muted">${x.a.grade}</span></td><td class="mono">${esc(x.mk)}</td></tr>`).join("")).join("")}
        </tbody></table></div><p class="note">Top 5 per event. Track from spring 2026, XC from fall 2026.</p></div>
      </div>
      ${(()=>{ const ch = recordWatch(999).filter(x=>x.lv===level && x.g===gsel);
        if (!ch.length) return "";
        return `<section class="panel"><div class="bar"><div><div class="eyebrow">${level} ${GN[gsel]}</div><h2>Chasing the record</h2></div><span class="muted">${ch.length} within reach</span></div>
          <ul class="chase" style="margin-top:12px">${ch.map(x=>{ const lim = x.field ? 0.10 : 0.06, fill = Math.max(4, Math.round((1 - Math.max(x.pct,0)/lim)*100));
            return `<li><span><b><a href="#a-${x.a.id}">${esc(x.a.name)}</a></b> <small>${esc(x.r.ev)} · ${esc(x.a.prs[x.r.key])} vs record ${esc(x.r.mk)} (${esc(x.r.who)}, ${esc(String(x.r.yr))})</small></span><span class="rw-gap">${gapText(x)}</span><span class="bar-in"><i style="width:${fill}%"></i></span></li>`; }).join("")}</ul>
          <p class="note" style="margin:10px 0 0">Within 6% of a running record or 10% of a field record. Incoming 9th graders show up once they have a high school mark.</p></section>`; })()}
      </div>`;
  },
  coverage(){
    const lv = level;
    const teamHas = g => Object.values(ASSIGN[lv+"-"+g]||{}).some(x=>x.length);
    const cell = (g, ev) => {
      const marks = ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[ev]).sort((x,y)=>better(ev)({mk:x.prs[ev]},{mk:y.prs[ev]}));
      const asgd = rankIds(ev, (((ASSIGN[lv+"-"+g]||{})[ev])||[]));
      const useA = teamHas(g);
      const n = useA ? asgd.length : marks.length;
      const st = n>=2?"ok":n===1?"thin":"gap";
      const list = useA
        ? (asgd.length ? asgd.map(a=>`<a href="#a-${a.id}">${esc(a.name)}</a>${a.prs[ev]?` <span class="muted">${esc(a.prs[ev])}</span>`:""}`).join(", ") : `<span class="muted">Nobody assigned yet</span>`)
        : (marks.length ? marks.map(a=>`<a href="#a-${a.id}">${esc(a.name)}</a>`).join(", ") : `<span class="muted">Nobody with a mark yet</span>`);
      return `<tr><td>${esc(evLabel(ev))}</td><td><span class="cov ${st}">${n}</span></td><td>${list}</td></tr>`;
    };
    const xc = ATHLETES.filter(a=>a.level===lv && Object.keys(a.prs).every(k=>k.startsWith("XC"))).length;
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Goal: two prepared athletes in every event</div><h1>Event Coverage</h1></div>${levelToggle()}</div>
      <div class="legend"><span><span class="cov ok">2+</span> Covered</span><span><span class="cov thin">1</span> Thin</span><span><span class="cov gap">0</span> Gap</span></div>
      <div class="cols">${["B","G"].map(g=>{ const useA = teamHas(g); return `<div><h2 style="margin-bottom:4px">${lv} ${GN[g]}</h2>
        <p class="note" style="margin:0 0 10px">${useA?"Coach event assignments.":"No assignments yet, so this counts athletes with a 2026 mark."}</p>
        <div class="tbl"><table><thead><tr><th>Event</th><th>#</th><th>${useA?"Assigned":"Athletes with a mark"}</th></tr></thead><tbody>
        ${[...COVER_EVENTS[lv][g], ...(useA?RELAYS[lv]:[])].map(ev=>cell(g,ev)).join("")}</tbody></table></div></div>`; }).join("")}</div>
      ${canPost?`<p><a class="anet" href="#coaches" onclick="ctab='assign';asg.team='${lv}-B'"><b>Edit event assignments</b> →</a></p>`:""}
      <p class="note">${xc?`${xc} ${lv} athletes only have cross country times so far.`:""}</p></div>`;
  },
  recruiting(){
    const list = REC.list.filter(r=>(rf.lv==="All"||r.lvl===rf.lv)&&(rf.g==="All"||r.g===rf.g)&&(rf.gr==="All"||(rf.gr==="JH"?r.lvl==="JH":r.lvl==="HS"&&String(r.grade)===rf.gr))&&(!rf.q||r.name.toLowerCase().includes(rf.q.toLowerCase()))&&(!rf.sport||String(r.sport||"").toLowerCase().includes(rf.sport)));
    const rows = list.map(r=>({r, h:heat(r), cs:REC.contacts.filter(c=>c.rid===r.id)}));
    const ORDER = {joined:6,hot:5,warm:4,warming:3,cool:2,cold:1,none:0,closed:-1};
    const pub = !canPost;   // ratings and contact notes are coach-only
    rows.sort((a,b)=> (rf.sort==="name" || pub) ? a.r.name.localeCompare(b.r.name) : (ORDER[b.h.k]-ORDER[a.h.k]) || (b.h.score||0)-(a.h.score||0) || a.r.name.localeCompare(b.r.name));
    const all = REC.list.map(heat);
    const stat = (n,l) => `<div class="rstat"><b>${n}</b><span>${l}</span></div>`;
    const credit = {};
    REC.contacts.filter(c=>!c.self).forEach(c=>{ const x = credit[c.by] ||= {n:0,y:0}; x.n++; if(cHeat(c)>=4) x.y++; });
    const joinedBy = {};
    REC.list.filter(r=>r.status==="joined").forEach(r=>{ new Set(REC.contacts.filter(c=>c.rid===r.id && !c.self).map(c=>c.by)).forEach(b=>{ joinedBy[b]=(joinedBy[b]||0)+1; }); });
    const top = Object.entries(credit).sort((a,b)=>(joinedBy[b[0]]||0)-(joinedBy[a[0]]||0) || b[1].y-a[1].y || b[1].n-a[1].n).slice(0,8);
    const form = r => `<button type="button" class="btn sm" onclick="talkOpen('${r.id}')">I talked to them</button>`;
    return `${back}<div class="stack"><div><div class="eyebrow">Bring a friend out for track</div><h1>Recruiting</h1>
      <p class="lede">Talk to someone on this list? Tap <b>I talked to them</b>, slide how likely they are to come out, and send it so you get credit.</p></div>
      <div class="panel me"><label class="ed-row" for="me-pick"><span>Who are you?</span>
        <select id="me-pick" onchange="setMe(this.value)"><option value="">Pick your name…</option>
          <optgroup label="Coaches">${STAFF.filter(c=>c.name).map(c=>`<option value="c:${esc(c.name)}" ${"c:"+c.name===me?"selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>
          <optgroup label="Athletes">${[...ATHLETES].sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${a.id===me?"selected":""}>${esc(a.name)}</option>`).join("")}</optgroup></select></label>
        <p class="note" style="margin:0">${me?"Saved on this device, so you only pick it once.":"Pick it once and it's remembered on this device."}</p></div>
      ${talk?views._talk():""}
      ${canPost ? friendsHTML() : ""}
      ${pub ? `<div class="rstats">${stat(REC.list.length,"On the list")}${stat(all.filter(h=>h.k==="joined").length,"Joined")}</div>` : `<div class="rstats">${stat(REC.list.length,"On the list")}${stat(all.filter(h=>!["none","closed","joined"].includes(h.k)).length,"Contacted")}${stat(all.filter(h=>h.k==="hot"||h.k==="warm").length,"Warm or hot")}${stat(all.filter(h=>h.k==="joined").length,"Joined")}</div>`}
      ${top.length?`<div class="panel"><h2>Top recruiters</h2><ol class="toprec">${top.map(([n,x])=>`<li><b>${esc(n)}</b><span>${joinedBy[n]?`${joinedBy[n]} joined · `:""}${x.y} warm/hot · ${x.n} talk${x.n===1?"":"s"}</span></li>`).join("")}</ol></div>`:""}
      <div class="bar" style="justify-content:flex-start">
        ${segBtns(rf.lv,[["All","All"],["HS","HS"],["JH","JH"]],"(v=>{rf.lv=v;render()})")}
        ${segBtns(rf.g,[["All","All"],["B","Boys"],["G","Girls"]],"(v=>{rf.g=v;render()})")}
        ${segBtns(rf.gr,[["All","All grades"],["9","Fr"],["10","So"],["11","Jr"],["12","Sr"],["JH","JH"]],"(v=>{rf.gr=v;render()})")}
        ${pub ? "" : segBtns(rf.sort,[["heat","Closest to joining"],["name","A–Z"]],"(v=>{rf.sort=v;render()})")}
        ${rf.sport?`<button type="button" class="chip" onclick="rf.sport='';render()">Only ${rf.g==="G"?"girls ":""}${esc(rf.sport)} ✕</button>`:""}
        <input id="rsearch" class="search" type="search" placeholder="Search name" value="${esc(rf.q)}" oninput="rf.q=this.value;render();const e=document.getElementById('rsearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
      </div>
      ${pub ? "" : `<div class="legend">${["none","cold","cool","warming","warm","hot","joined"].map(k=>meter({k,l:HEAT_NAMES[k],lvl:{none:0,cold:1,cool:2,warming:3,warm:4,hot:5,joined:5}[k]})).join("")}</div>`}
      <div class="tbl"><table class="rtable"><thead><tr><th>Name</th>${pub?"":"<th>Heat</th>"}<th>Talked to</th>${pub?"":"<th>Last contact</th>"}<th></th></tr></thead><tbody>
        ${rows.map(({r,h,cs})=>{ const last = cs[cs.length-1]; const by = [...new Set(cs.filter(c=>!c.self).map(c=>c.by))];
          return `<tr class="${r.status==="closed"?"dim":""}"><td><b>${esc(r.name)}</b><div class="muted">${r.lvl} ${r.g==="B"?"Boys":"Girls"}${recGr(r)?" · "+recGr(r):""}${r.sport&&r.sport!=="Other"?" · "+esc(r.sport):""}</div></td>
            ${pub ? "" : `<td>${meter(h)}</td>`}
            <td>${by.length?by.map(b=>`<span class="chip">${esc(b)}</span>`).join(""):(helpersFor(r).length?"":`<span class="muted">Nobody yet</span>`)}${helpersFor(r).map(b=>`<span class="chip home" title="Named them on the interest form">🤝 ${esc(b)} will help</span>`).join("")}</td>
            ${pub ? "" : `<td>${last?(last.self?`<span class="resp sc-warm">${esc(last.by)}</span>`:`${esc(last.by)} · ${scaleTag(last)}`)+`<div class="muted">${shortD(last.d)}</div>`:"—"}</td>`}
            <td>${r.status==="open"?form(r):r.status==="joined"?'<span class="chip">Joined</span>':""}</td></tr>`; }).join("")}
      </tbody></table></div>
      ${pub ? `<p class="note">Talked to someone? Tap <b>I talked to them</b>. Coaches see how each conversation went; it stays private.</p>` : `<p class="note">Each talk counts toward their heat: Cold −2, Cool −1, Maybe +1, Warm +2, Hot +3. Warming up at 1, Warm at 3, Hot at 5, Cold at −3. Coaches mark kids as Joined. Your report shows up once a coach adds it.</p>`}</div>`;
  },
  _talk(){
    const r = REC.list.find(x=>x.id===talk.rid); if(!r) return "";
    const sc = SCALE[talk.heat];
    return `<div class="panel talk" id="tk-panel"><div class="bar"><h2>You talked to ${esc(r.name)}</h2><button type="button" class="btn sm" onclick="talk=null;render()">Close</button></div>
      <label class="ed-row" for="tk-by"><span>Your name</span><input id="tk-by" type="text" list="tk-people" value="${esc(talk.by)}" placeholder="Your name" oninput="talk.by=this.value;document.getElementById('tk-go').toggleAttribute('aria-disabled',!this.value.trim())"></label>
      <datalist id="tk-people">${[...STAFF.filter(c=>c.name).map(c=>c.name), ...ATHLETES.map(a=>a.name)].map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
      <div class="slider"><label for="tk-heat">How likely are they to come out?</label>
        <input id="tk-heat" type="range" min="1" max="5" step="1" value="${talk.heat}" oninput="talk.heat=+this.value;document.getElementById('tk-val').textContent=SCALE[talk.heat].l+' ('+talk.heat+'/5)';document.getElementById('tk-val').className='tk-val sc-'+SCALE[talk.heat].k">
        <div class="slider-ends"><span>Cold</span><span>Cool</span><span>Maybe</span><span>Warm</span><span>Hot</span></div>
        <div id="tk-val" class="tk-val sc-${sc.k}">${sc.l} (${talk.heat}/5)</div></div>
      ${RECRUIT_FORM ? `<div class="ed-save"><a id="tk-go" class="btn primary" href="#" onclick="if(!talk.by.trim()){return false;}this.href=talkLink();" target="_blank" rel="noopener" ${talk.by.trim()?"":"aria-disabled=\"true\""}>Send it ↗</a>
          <span class="note" style="margin:0">Opens a quick form with everything filled in. Hit Submit there.</span></div>`
        : `<div class="ed-save"><button id="tk-go" type="button" class="btn primary" onclick="if(talk.by.trim())talkCopy()">Copy message</button>
          <span class="note" style="margin:0">Then share it with any coach.</span></div>
          ${talk.sent==="copied"?`<p class="ed-msg ok" style="margin:0">Copied. Share it with any coach.</p>`:talk.sent==="select"?`<p class="note" style="margin:0">Copy this and share it with any coach:</p><input type="text" readonly value="${esc(talkText())}" onfocus="this.select()" aria-label="Message to copy">`:""}`}
    </div>`;
  },
  form(){
    const f = FORM.find(x=>x.id===ftab) || FORM[0];
    return `${back}<div class="stack"><div><div class="eyebrow">Technique</div><h1>Form</h1>
        <p class="lede">Pick your event. Each one has the steps in order, short cues to think about, common mistakes and fixes, and drills.</p></div>
      <div class="filters" role="group" aria-label="Event">${FORM.map(x=>`<button type="button" aria-pressed="${x.id===f.id}" onclick="ftab='${x.id}';render()">${esc(x.ev)}</button>`).join("")}</div>
      <div class="form-top"><h2>${esc(f.ev)}</h2>${f.safety?`<div class="panel form-safety"><b>Safety first.</b> ${esc(f.safety)}</div>`:""}</div>
      <div class="form-grid">
        <div class="panel"><h3>Step by step</h3><ol class="form-steps">${f.phases.map(ph=>`<li><b>${esc(ph.h)}</b><span>${esc(ph.p)}</span></li>`).join("")}</ol></div>
        <div class="stack" style="gap:12px">
          <div class="panel form-cues"><h3>Cues</h3><ul>${f.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
          <div class="panel"><h3>Drills</h3><ol class="steps">${f.drills.map(d=>`<li><span>${itemHTML(d)}</span><em>${esc(d.d||"")}</em></li>`).join("")}</ol></div>
        </div>
      </div>
      ${f.legs?`<div class="panel"><h3>4x100 leg chart</h3><div class="tbl" style="border:0"><table><thead><tr><th>Leg</th><th>Part of the track</th><th>Carry in</th><th>Run on</th><th>The pass</th></tr></thead><tbody>
        ${f.legs.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td><span class="chip ${r[2]==="Right"?"gold":"on"}">${esc(r[2])} hand</span></td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join("")}</tbody></table></div></div>`:""}
      <div class="panel"><h3>Common mistakes</h3><div class="tbl" style="border:0"><table><thead><tr><th>If you're…</th><th>Try this</th></tr></thead><tbody>
        ${f.fixes.map(([m,fx])=>`<tr><td>${esc(m)}</td><td>${esc(fx)}</td></tr>`).join("")}</tbody></table></div></div>
      <p class="note">More drills for each event are in <a href="#warmups">Warm-ups &amp; Care</a> and in each week's workouts.</p></div>`;
  },
  middistance(){

        ${evs.map(e=>{ const m = markRank(a,e); return `<div class="pr ${m&&m.hs?"pr-hs":""}"><div class="ev">${esc(evn(e))}</div><div class="mk">${esc(a.prs[e]||"—")}</div>${a.pri&&a.pri[e]?`<div class="when2">${esc(a.pri[e])}</div>`:""}
          ${m?`<div class="rank"><span class="rk ${m.r===1?"r1":m.r<=3?"r3":""}">${ordinalTag(m,a)}</span>${m.hs?`<span class="hs-tag" title="Rank among all ${a.g==="B"?"boys":"girls"}, HS and JH">★ Top 3 overall · #${m.hs.r} of ${m.hs.n}</span>`:""}</div>`:""}
          <div class="gl">Goal <b>${esc(a.goals[e]||"—")}</b></div></div>`; }).join("")}
      </div></div>
      ${(()=>{ if(!(a.cats.includes("Distance")||a.cats.includes("Mid Distance"))) return ""; const b = athleteVdot(a); if(!b) return ""; const p = paceSet(b.V);
        return `<div class="panel"><div class="bar"><h2>Training paces</h2><span class="muted">VDOT ${b.V.toFixed(1)} · from ${esc(evn(b.k))} ${esc(b.mk)}</span></div>
          <div class="prgrid">${[["Easy","/mi",`${p.easy[0]}–${p.easy[1]}`],["Tempo","/mi",p.tempo],["Tempo","/400",p.tempo400],["Interval","/400",p.int400],["Interval","/800",p.int800],["Rep","/200",p.rep200],["Rep","/400",p.rep400]]
            .map(([l,u,v])=>`<div class="pr"><div class="ev">${l} ${u}</div><div class="mk">${v}</div></div>`).join("")}</div>
          <p class="note" style="margin:8px 0 0">${a.level==="HS"?(()=>{ const t = DTAGS[a.id]||{}; return (t.lv?`<span class="tchip">${esc(TAG_CHIP[t.lv])}</span>`:"")+(t.path?`<span class="tchip">${esc(TAG_CHIP[t.path])}</span>`:"")+``; })():""}<a href="#paces">What each pace means →</a></p></div>`; })()}
      ${myWeekHTML(a)}
      ${sptPanel(a)}
      ${checkHTML(a)}
      <div><h2 style="margin-bottom:10px">Workout log</h2>
        ${a.log.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Workout</th><th>Splits / marks</th><th>Notes</th></tr></thead><tbody>
          ${a.log.map(l=>`<tr><td class="mono">${esc(l.d)}</td><td>${esc(l.w)}</td><td class="split">${esc(splitsText(l))||"—"}</td><td>${esc(l.n)}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note">No workouts logged yet.</p>`}</div>
      <div><h2 style="margin-bottom:10px">Meet results</h2>
        ${a.meets.length?`<div class="tbl"><table><thead><tr><th>Meet</th><th>Event</th><th>Mark</th><th>Place</th></tr></thead><tbody>
          ${a.meets.map(m=>`<tr><td>${esc(m.m)}</td><td>${esc(m.ev)}</td><td class="mono">${esc(m.mk)}</td><td>${esc(m.pl)}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note">No meet results yet.</p>`}</div>
      </div>`;
  },
};

function applyNameMode(){
  const short = PUBLIC_INITIALS && !canPost;
  ATHLETES.forEach(a=>{ a.fullName = a.fullName || a.name; a.name = short ? shortName(a.fullName) : a.fullName; });
  REC.list.forEach(r=>{ r.fullName = r.fullName || r.name; r.name = short ? shortName(r.fullName) : r.fullName; });
}
function render(){
  applyNameMode();
  const h = (location.hash || "#hub").slice(1);
  const isAth = h.startsWith("a-");
  if (h==="post") { ctab="workouts"; }
  const key = isAth ? "athletes" : h==="post" ? "coaches" : (views[h] && h!=="athlete" && !h.startsWith("_") ? h : "hub");
  const curG = (SECTIONS.find(x=>x.id===key)||{}).g || "";
  const top = [`<a href="#hub" ${key==="hub"?'aria-current="page"':""}>Hub</a>`,
    ...NAV_GROUPS.map(([g,l])=>{ const first = SECTIONS.find(x=>x.g===g); return `<a href="#${first.id}" ${curG===g?'aria-current="page"':""}>${l}</a>`; }),
    `<a href="#coaches" ${key==="coaches"?'aria-current="page"':""}>${canPost?"Coaches":"Coach login"}</a>`].join("");
  document.getElementById("tabs").innerHTML = top;
  const sub = document.getElementById("subnav");
  if (curG) { sub.hidden = false; const seen = new Set();
    sub.innerHTML = `<div class="wrap subnav-in">${SECTIONS.filter(x=>x.g===curG && (!x.coach || canPost)).map(x=>{ const P = PAGE_GROUPS.find(p=>p.kids.some(([k])=>k===x.id));
      if (P) { if (seen.has(P.name)) return ""; seen.add(P.name); const on = P.kids.some(([k])=>k===key); const first = P.kids.find(([k])=>SECTIONS.some(s=>s.id===k))[0];
        return `<a href="#${on ? key : first}" ${on?'aria-current="page"':""}>${P.name}</a>`; }
      return `<a href="#${x.id}" ${x.id===key?'aria-current="page"':""}>${x.name}</a>`; }).join("")}</div>`; }
  else { sub.hidden = true; sub.innerHTML = ""; }
  document.getElementById("view").innerHTML = isAth ? views.athlete(h.slice(2)) : views[key]();
  { const P = !isAth && PAGE_GROUPS.find(p=>p.kids.some(([k])=>k===key));
    if (P) document.getElementById("view").insertAdjacentHTML("afterbegin", `<div class="pg-tabs"><div class="eyebrow">${esc(P.name)}</div><div class="seg" role="group" aria-label="${esc(P.name)}">${P.kids.filter(([k])=>SECTIONS.some(s=>s.id===k)).map(([k,l])=>`<a role="button" href="#${k}" aria-pressed="${k===key}">${esc(l)}</a>`).join("")}</div></div>`); }
  const bn = document.getElementById("botnav"); if (bn) bn.innerHTML = botnavHTML(key, isAth);
  thmIcon(); LI_ATH = null;
  try { enhanceAbbr(document.getElementById("view")); } catch(e) { console.warn("abbr", e); }
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => { if(location.hash!==lastHash){ lastHash=location.hash; awIdx=null; fmp=false; window.scrollTo(0,0); lk={id:null,msg:{kind:"",text:""}}; } render(); });
render();
async function loadAll(){
  if (!SB) return;
  const {data, error} = await SB.from("hub_data").select("key,value,updated_at");
  if (error || !data) return;
  const byKey = {}; data.forEach(r=>{ byKey[r.key] = r.value; STAMP[r.key] = r.updated_at; });
  const w = byKey.workouts, wu0 = byKey.warmups, lg = byKey.logs, rj = byKey.recruits, aj = byKey.assignments;
  if (aj && typeof aj === "object") ASSIGN = Object.assign({"HS-B":{}, "HS-G":{}, "JH-B":{}, "JH-G":{}}, aj);
  if (rj && Array.isArray(rj.list)) REC = {list: rj.list, contacts: (rj.contacts||[]).map(({note, ...c})=>c)};
  if (Array.isArray(w)) { RAW_STARTS = w.filter(x=>x && typeof x.start==="string").map(x=>x.start); WORKOUTS = mergeWeeks(w); }
  if (wu0 && wu0.practice) WARMUPS = Object.assign({}, WARMUPS, wu0);
  if (lg && typeof lg === "object") LOGS = lg;
  if (byKey.links && typeof byKey.links === "object") LINKS = byKey.links;
  if (byKey.dtags && typeof byKey.dtags === "object") { DTAGS = byKey.dtags; dtDraft = null; }
  if (byKey.vdot && typeof byKey.vdot === "object") VOVR = byKey.vdot;
  if (byKey.winter && Array.isArray(byKey.winter.ids)) { WINTER = {ids: byKey.winter.ids, maybe: byKey.winter.maybe||{}, follow: byKey.winter.follow||{}, done: byKey.winter.done||[]}; wDirty = false; applyWinterDecisions(); }
  wLoaded = true; persistWinterDecisions();
  if (byKey.interest && typeof byKey.interest === "object") INTEREST = byKey.interest;
  if (byKey.midnotes && typeof byKey.midnotes === "object") { MDNOTES = Object.assign({general:"", mods:""}, byKey.midnotes); mdn = null; }
  if (byKey.signups && typeof byKey.signups === "object") SIGN = Object.assign(JSON.parse(JSON.stringify(SIGNUPS_SEED)), byKey.signups);
  // "Izzy" on the interest form is Ezreall Roberson, not a new athlete: move anything saved under the old id
  const MOVED = {"hs-izabella-bauer":"hs-ezreall-roberson"};
  Object.entries(MOVED).forEach(([from, to]) => [INTEREST, SIGN, byKey.sgroups, LOGS, DTAGS].forEach(o => { if (o && typeof o==="object" && o[from]) { if (!o[to]) o[to] = o[from]; else if (o===SIGN) o[to] = Object.assign({}, o[from], o[to]); delete o[from]; } }));
  if (INTEREST["hs-ezreall-roberson"]) INTEREST["hs-ezreall-roberson"].name = "Ezreall Roberson";
  applyLogs();
  applySelfSignups();
  if (byKey.exvideos && typeof byKey.exvideos === "object") { EXV = byKey.exvideos; exvDraft = null; }
  if (byKey.sptests && typeof byKey.sptests === "object") { SPT = byKey.sptests; spt.draft = null; }
  window.HUB_BYKEY = byKey; if (window.SP && SP.onData) SP.onData(byKey);
  render();
}

/* ---- Coach sign-in (email link) ---- */
let checking = false;
async function checkCoach(session){
  if (!SB) return;
  if (session === undefined) { try { const r = await withTimeout(SB.auth.getSession(), 8000); session = r.data.session; } catch(e) { session = null; } }
  coachEmail = session && session.user ? (session.user.email||"").toLowerCase() : "";
  if (!coachEmail) { canPost = false; render(); return; }
  let data = null, error = null;
  try { ({data, error} = await withTimeout(SB.from("coaches").select("email").eq("email", coachEmail).maybeSingle(), 10000)); } catch(e) { error = e; }
  canPost = !!data && !error;
  persistWinterDecisions();
  // Just came back from a sign-in link: go straight to the Coaches tab
  if (AUTH_RETURN && !checking) { checking = true; if (!/^#(coaches|post)$/.test(location.hash)) location.hash = "#coaches"; }
  render();
}
async function sendLogin(){
  const email = (document.getElementById("lg-email")||{}).value || "";
  if (!/.+@.+\..+/.test(email.trim())) { login.msg = "Enter your email address."; render(); return; }
  login.email = email.trim();
  const {error} = await SB.auth.signInWithOtp({email: login.email, options:{emailRedirectTo: location.origin + location.pathname}});
  if (error) { login.msg = authMsg(error); render(); return; }
  login.sent = true; login.msg = ""; render();
}
function authMsg(error){
  const m = String((error && error.message) || "").toLowerCase();
  if (m.includes("rate limit") || (error && error.status===429)) return "Too many sign-in emails were sent in the last hour. Wait a bit, or use your password instead.";
  if (m.includes("invalid login") || m.includes("invalid credentials")) return "That email and password don't match. First time here? Use \"First time? Set a password.\"";
  if (m.includes("already registered") || m.includes("already been registered")) return "That email already has a password. Sign in instead, or use an email link if you forgot it.";
  if (m.includes("email not confirmed")) return "This account still needs email confirmation. Ask Coach Witt to turn off \"Confirm email\" in Supabase, or use an email link.";
  if (m.includes("password") && (m.includes("short") || m.includes("least") || m.includes("weak"))) return "Pick a longer password: at least 8 characters.";
  if (m.includes("signups not allowed") || m.includes("signup is disabled")) return "New passwords are turned off in Supabase. Use an email link, or ask Coach Witt.";
  return "Sign-in didn't work: " + ((error && error.message) || "unknown error") + ".";
}
// Give any Supabase call a time limit so the page can never hang on it.
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label || "Supabase didn't answer. Check your connection and try again.")), ms))]);
// Wipe any saved sign-in on this device directly (no network call, can't hang).
function clearLocalSession(){
  try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch(e) {}
}
// One shared coaches account. The email isn't secret; the password is checked by Supabase, never stored in this page.
const COACH_ACCOUNT = (window.HUB_CONFIG && window.HUB_CONFIG.coachAccount) || "coaches@bctrackhub.com";
async function pwLogin(){
  const pw = (document.getElementById("lg-pw")||{}).value || "";
  if (!pw) { login.msg = "Enter the password."; render(); return; }
  if (login.busy) return;
  login.busy = true;
  const btn = document.querySelector('button[onclick="pwLogin()"]');
  if (btn) { btn.disabled = true; btn.textContent = "Signing in…"; }
  const msgEl = document.querySelector(".ed-msg");
  if (msgEl) msgEl.textContent = "";
  try {
    // Clear any half-finished old sign-in first so it can't block the new one
    clearLocalSession();
    try { await withTimeout(SB.auth.signOut({scope:"local"}), 3000); } catch(e) {}
    const res = await withTimeout(SB.auth.signInWithPassword({email: COACH_ACCOUNT, password: pw}), 15000, "Supabase didn't answer after 15 seconds. Check your connection and try again.");
    if (res.error) {
      const m = res.error.message || "";
      login.msg = /invalid/i.test(m) ? "Wrong password. Try again." : "Sign-in didn't work: " + m;
      return;
    }
    login.msg = "";
    try { await withTimeout(checkCoach(res.data.session), 10000); } catch(e) {}
    if (!canPost) login.msg = "Signed in, but " + COACH_ACCOUNT + " isn't on the coaches list in Supabase.";
    if (!/^#(coaches|post)$/.test(location.hash)) location.hash = "#coaches";
  } catch (e) {
    login.msg = "Sign-in didn't work: " + ((e && e.message) || e);
  } finally {
    login.busy = false;
    try { render(); } catch(e) { showErr("render after sign-in: " + (e.stack || e.message)); }
  }
}
async function signOut(){ clearLocalSession(); try { await withTimeout(SB.auth.signOut({scope:"local"}), 3000); } catch(e) {} canPost = false; coachEmail = ""; location.hash = "#hub"; render(); }
if (SB) {
  // Don't call Supabase inside this callback directly (it can stall); hand off with setTimeout.
  SB.auth.onAuthStateChange((event, session)=>{ setTimeout(()=>checkCoach(session), 0); });
  if (/error_description=/.test(AUTH_RETURN)) {
    login.msg = /expired|invalid/i.test(decodeURIComponent(AUTH_RETURN)) ? "That sign-in link expired or was already used. Send a new one." : "Sign-in didn't finish. Send a new link.";
    history.replaceState(null, "", location.pathname + "#coaches"); render();
  }
}
