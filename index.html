<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC Track Hub</title>
<meta name="description" content="Benton Central Track & Field: schedule, workouts, athletes, records, and more.">
<meta name="theme-color" content="#1b4429">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky lane-stripe nav over one view at a time; hub = tile grid of sections, each view a lane-numbered sheet */
:root{
  --cold:#5b7fa6; --warm:#c8730a;
  --bg:#f4f5ee; --surface:#ffffff; --fg:#16211a; --muted:#5a685d; --line:#d7ddcf;
  --accent:#1e4d2f; --accent-ink:#ffffff; --gold:#e2ad12; --gold-soft:#fbf0c9;
  --brand:#1b4429; --on-brand:#ffffff; --gold-ink:#1d2a12;
  --track:#b5452f; --chip:#e8ecdf;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#17211a; --fg:#eaefe6; --muted:#9ba897; --line:#2a3829;
  --accent:#63bb7f; --accent-ink:#0b140d; --gold:#f2c230; --gold-soft:#2f2a12;
  --brand:#163a22; --on-brand:#ffffff; --gold-ink:#1d2a12;
  --track:#e0735c; --chip:#223024; --cold:#86a9cf; --warm:#f0a040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#17211a; --fg:#eaefe6; --muted:#9ba897; --line:#2a3829;
  --accent:#63bb7f; --accent-ink:#0b140d; --gold:#f2c230; --gold-soft:#2f2a12;
  --brand:#163a22; --on-brand:#ffffff; --gold-ink:#1d2a12;
  --track:#e0735c; --chip:#223024; --cold:#86a9cf; --warm:#f0a040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--gold);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/8 - 2px),rgba(255,255,255,.12) calc(100%/8 - 2px) calc(100%/8))}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-decoration:none;color:var(--gold);text-transform:uppercase;line-height:1}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;display:block;color:var(--on-brand);opacity:.85}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{color:inherit;text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:4px;opacity:.85}
nav.tabs a[aria-current="page"]{background:var(--gold);color:var(--gold-ink);opacity:1}
nav.tabs a:hover{opacity:1}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(34px,6vw,52px);font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.stack{display:grid;gap:24px}
.sample{display:inline-block;color:var(--fg);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-soft);color:var(--fg);border:1px dashed var(--gold);padding:2px 8px;border-radius:3px}
.backlink{font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;gap:6px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.mono,td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Hub */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.nextmeet{background:var(--brand);color:var(--on-brand);border-top:4px solid var(--gold);border-radius:6px;padding:20px;display:grid;gap:6px;position:relative;overflow:hidden}
.nextmeet .count{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;color:var(--gold);margin:6px 0 4px}
.nextmeet .count span{font-size:18px;color:var(--on-brand);margin-left:8px;opacity:.8}
.nm-eye{color:inherit;opacity:.7}
.nm-name{font-size:30px}
.nm-facts{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;margin:6px 0 4px;font-size:15px;position:relative;max-width:calc(100% - 70px)}
.nm-facts dt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.6;padding-top:3px}
.nm-facts dd{margin:0}
.nm-link{color:var(--gold);font-weight:600;margin-top:4px;position:relative}
.nextmeet .lanes{position:absolute;right:-10px;top:0;bottom:0;width:90px;background:repeating-linear-gradient(90deg,var(--track) 0 18px,transparent 18px 22px);opacity:.25}
.week ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.week li{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:15px}
.week li b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:13px;padding-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold);transform:translateY(-2px)}
.tile .lane{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--gold-ink);background:var(--gold);border-radius:4px;min-width:40px;height:40px;display:grid;place-items:center}
.tile h3{font-size:20px}
.tile p{margin:0;color:var(--muted);font-size:14px}
/* toggles */
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto}
.seg button{font:600 14px var(--body);padding:7px 14px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td a{font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--chip);border-radius:3px;padding:1px 7px;margin:1px 2px 1px 0;white-space:nowrap}
.chip.home{background:var(--accent);color:var(--accent-ink)}
.chip.past{opacity:.55}
.lvl{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track)}
/* roster cards */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ath{display:grid;gap:4px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:5px;padding:12px 14px}
.ath:hover{border-color:var(--accent)}
.ath strong{font-size:17px}
.ath span{font-size:13px;color:var(--muted)}
.lk-ed{display:grid;gap:10px;max-width:560px;margin-top:10px}
.cf-yrs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cf-yr{flex:1 1 90px;border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:grid;gap:2px}
.cf-yr span{font:600 12px var(--mono);color:var(--muted)}.cf-yr b{font:800 26px var(--display);line-height:1}.cf-yr small{font-size:12px;color:var(--muted)}
.cf-yr.top{border-color:var(--gold);background:var(--gold-soft)}
.cf-ch{text-align:right;white-space:nowrap}
.cf-d,.cf-p{display:inline-block;font:700 12px var(--mono);border-radius:3px;padding:1px 5px;margin-left:4px;color:var(--muted)}
.cf-d.up,.cf-p.up{color:#1f7a3d;background:#e3f3e8}.cf-d.dn,.cf-p.dn{color:#b3261e;background:#fbe7e5}
.cf-d.new{color:var(--gold-ink);background:var(--gold-soft)}
.cf-yd{margin-top:4px}.cf-yd .cf-d:first-child{margin-left:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cf-d.up,:root:not([data-theme="light"]) .cf-p.up{color:#7fd69a;background:#163a22}:root:not([data-theme="light"]) .cf-d.dn,:root:not([data-theme="light"]) .cf-p.dn{color:#ff9b91;background:#3a1714}}
:root[data-theme="dark"] .cf-d.up,:root[data-theme="dark"] .cf-p.up{color:#7fd69a;background:#163a22}:root[data-theme="dark"] .cf-d.dn,:root[data-theme="dark"] .cf-p.dn{color:#ff9b91;background:#3a1714}
.cf-sub{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:12px}
.cf-card .bar{margin-bottom:6px}
tr.cf-bc td{background:var(--gold-soft);font-weight:700}
.su-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.su-stat{padding:14px 16px;display:grid;gap:2px}.su-stat b{font:800 28px var(--display);line-height:1}.su-stat span{font-size:13px;color:var(--muted)}
.su-stat.gold{border-color:var(--gold);background:var(--gold-soft)}
.su-list{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.su-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.su-row:first-child{border-top:0}.su-row.su-out{opacity:.62}
.su-who{min-width:0;display:grid}.su-who a{color:var(--fg);text-decoration:none}.su-who small{color:var(--muted);font-size:12px}
.su-tag{font-size:12px;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap;background:var(--chip)}
.su-tag.su-new{background:var(--gold);color:var(--gold-ink)}.su-tag.su-rec{background:var(--accent);color:var(--accent-ink)}
.su-tag.su-xc{background:var(--gold-soft);border:1px solid var(--gold)}
.su-boxes{display:flex;gap:12px}
.su-box{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.su-box.ro{cursor:default}.su-box.ro input{cursor:default;opacity:1}
.su-box input{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer}
.new-chip{background:var(--gold);color:var(--gold-ink);justify-self:start}
@media (max-width:620px){.su-row{grid-template-columns:minmax(0,1fr) auto}.su-boxes{grid-column:1/-1}}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:600 14px var(--body);display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);cursor:pointer}
.filters button span{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.athtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvlchip{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.weekpick button:disabled{opacity:.35;cursor:default}
.shared{margin-bottom:10px}
.lvsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.lvsplit{grid-template-columns:1fr}}
.lvcol{background:var(--bg);border-radius:5px;padding:10px 12px;min-width:0}
.lvcol ul{margin:4px 0 0}
.lvcol.off{opacity:.6}
.lvhead{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted);font-size:14px;margin:4px 0 0;list-style:none}
.evlist{display:grid;gap:8px;min-width:0}
.evblock{display:grid;grid-template-columns:120px 1fr;gap:12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.evblock:last-child{border-bottom:0;padding-bottom:0}
.evblock ul{margin:0}
.evname{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:2px}
@media (max-width:600px){.evblock{grid-template-columns:1fr;gap:2px}}
.lvsplit{margin-top:6px}
.anetrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.anet{display:inline-flex;gap:6px;align-items:center;font-size:14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px}
.anet b{color:var(--accent)}
.anet:hover{border-color:var(--accent)}
.search{font:15px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 180px;max-width:260px}
.cov{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;font-family:var(--mono);font-size:12px;font-weight:500}
.cov.ok{background:var(--accent);color:var(--accent-ink)}
.cov.thin{background:var(--gold);color:var(--gold-ink)}
.cov.gap{background:var(--track);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend>span{display:inline-flex;gap:6px;align-items:center}
.rec-hit td{background:var(--gold-soft)}
.chip.gold{background:var(--gold);color:var(--gold-ink)}
.staff .open{border-style:dashed;background:transparent}
.staff .open h3{color:var(--muted)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.exp{margin:10px 0 0;padding-left:18px;display:grid;gap:6px}
.btn{font:600 14px var(--body);padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--track);border-color:var(--track);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.ed{display:grid;gap:16px}
.ed-help{font-size:15px;line-height:1.55}
.ed-help code{font-family:var(--mono);font-size:13px;background:var(--chip);padding:1px 5px;border-radius:3px}
.ed-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;max-width:520px}
.ed-row span,.ed-g span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ed input[type=text],.ed input[type=date],.ed input[type=password],.ed input[type=email],.ed textarea{font:15px var(--body);width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);min-width:0}
.ed textarea{resize:vertical;line-height:1.4}
.ed-day{border-top:2px solid var(--line);padding-top:14px;display:grid;gap:10px}
.ed-dayhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ed-dayhead h3{font-size:24px}
.ed-dayhead .btn{margin-left:auto}
.ed-check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.ed-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.ed-grid2{grid-template-columns:1fr}.ed-row{grid-template-columns:1fr;gap:4px}}
.ed-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ed-g{display:grid;gap:4px;min-width:0}
.ed-g.all{grid-column:1/-1}
.ed-g.all span{color:var(--accent)}
.ed-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.ed-save{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:14px}
.ed-msg{font-size:14px}
.ed-msg.ok{color:var(--accent);font-weight:600}
.ed-msg.err{color:var(--track);font-weight:600}
.ed-acts{white-space:nowrap;display:flex;gap:6px}
.tchip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--gold-soft);border:1px solid var(--gold);border-radius:3px;padding:0 5px;margin-right:5px;white-space:nowrap;vertical-align:1px}
.pbox summary{cursor:pointer;list-style:none}
.pbox summary::-webkit-details-marker{display:none}
.pbtn{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:6px;color:var(--accent);white-space:nowrap;vertical-align:1px}
.pbox[open] .pbtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbody{margin:6px 0 4px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:4px;font-size:14px}
.pbody table{width:100%;border-collapse:collapse}.pbody td{padding:3px 8px 3px 0;vertical-align:top;border-top:1px solid var(--line)}
.pbody .mono{font-family:var(--mono);font-size:13px}
.wcode{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:1px;color:#fff}
.ty-speed{background:#b4472b}.ty-aero{background:var(--accent)}.ty-race{background:var(--gold);color:var(--gold-ink)}.ty-str{background:#5d6470}.ty-rec{background:#8a8f98}.ty-meet{background:#2f4f8f}
.tchip.xo{background:transparent;border:1px dashed #6b4fa3;color:#6b4fa3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tchip.xo{border-color:#b9a3e6;color:#b9a3e6}}
.mdtabs{display:flex;flex-wrap:wrap;gap:6px}
.mdtbl td,.mdtbl th{vertical-align:top}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .mh{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.mcell{min-height:78px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:4px 5px;font-size:12px;line-height:1.25;display:grid;align-content:start;gap:3px;text-align:left;cursor:pointer;color:var(--fg);font-family:var(--body)}
.mcell.off{background:transparent;border-style:dashed;cursor:default;opacity:.55}
.mcell.today{outline:2px solid var(--gold)}
.mcell .dn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mcell .fc{font-weight:700;border-radius:3px;padding:0 4px;color:#fff;justify-self:start;font-size:11px}
.mcell .cds{display:flex;flex-wrap:wrap;gap:2px}.mcell .cds .wcode{margin:0;font-size:10px;padding:0 3px}
@media (max-width:640px){.mcell{min-height:56px;padding:3px}.mcell .fc{font-size:10px;padding:0 2px}}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.calc input,.calc select{font:16px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg)}
.splits{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.days{display:grid;gap:10px}
.day{display:grid;grid-template-columns:110px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}

.note{font-size:14px;color:var(--muted);max-width:70ch}

/* ---- Supabase data store ----
   Table hub_data(key, value, updated_at). Keys: workouts, warmups, logs, recruits, assignments.
   Everyone can read; only signed-in coaches on the coaches list can write (enforced by the database). */
const SB = (window.supabase && window.HUB_CONFIG && window.HUB_CONFIG.url && !/YOUR_/.test(window.HUB_CONFIG.url))
  ? window.supabase.createClient(window.HUB_CONFIG.url, window.HUB_CONFIG.anonKey, {auth:{flowType:"implicit", detectSessionInUrl:true, persistSession:true, autoRefreshToken:true, lock: async (name, acquireTimeout, fn) => await fn()}})
  : null;
// Sign-in links come back with tokens (or an error) in the address. Grab it before the client tidies the URL.
const AUTH_RETURN = /access_token=|error_description=/.test(location.hash) ? location.hash : "";
const STAMP = {};   // key -> updated_at we last loaded, to catch two coaches saving at once
let coachEmail = "";
function saveErr(e){
  const c = e && e.code;
  if (c==="conflict") return "Another coach just saved this. The latest version is loading now; redo your change after it loads.";
  if (c==="denied") return "This sign-in can't save. Sign out and sign back in with the coaches password.";
  if (c==="signin") return "You've been signed out. Sign in again with the coaches password and redo your change.";
  return "The save didn't go through. Check your connection and try again.";
}
async function saveKey(key, value){
  const now = new Date().toISOString();
  if (STAMP[key]) {
    const {data, error} = await SB.from("hub_data").update({value, updated_at:now, updated_by:coachEmail}).eq("key", key).eq("updated_at", STAMP[key]).select("updated_at");
    if (error) throw {code: error.code==="42501" ? "denied" : error.code==="PGRST301" ? "signin" : "other"};
    if (!data || !data.length) { await loadAll(); throw {code:"conflict"}; }
    STAMP[key] = data[0].updated_at;
  } else {
    const {data, error} = await SB.from("hub_data").insert({key, value, updated_at:now, updated_by:coachEmail}).select("updated_at");
    if (error) { if (error.code==="23505") { await loadAll(); throw {code:"conflict"}; } throw {code: error.code==="42501" ? "denied" : "other"}; }
    STAMP[key] = data[0].updated_at;
  }
}
// Saves data; returns null on success or an error message.
async function publishFiles(files){
  if(!SB || !canPost) return "Sign in as a coach to save.";
  saving = true; render();
  try {
    for (const [name, json] of Object.entries(files)) await saveKey(name.replace(/\.json$/,""), JSON.parse(json));
    saving = false; return null;
  } catch(e){ saving = false; return saveErr(e); }
}
async function publishWeeks(next, okText){
  edMsg={kind:"",text:""};
  const err = await publishFiles({"workouts.json": JSON.stringify(next, null, 1)});
  if(err){ edMsg={kind:"err",text:err}; render(); return false; }
  WORKOUTS = next; edMsg={kind:"ok",text:okText}; render(); return true;
}

function heat(r){
  if(r.status==="joined") return {k:"joined", l:HEAT_NAMES.joined, lvl:5};
  if(r.status==="closed") return {k:"closed", l:HEAT_NAMES.closed, lvl:0};
  const cs = REC.contacts.filter(c=>c.rid===r.id);
  if(!cs.length) return {k:"none", l:HEAT_NAMES.none, lvl:0, score:0, n:0};
  const score = cs.reduce((a,c)=>a+SCALE[cHeat(c)].w,0);
  const self = cs.some(c=>c.self);
  const k = score>=5?"hot":(score>=3||self)?"warm":score>=1?"warming":score<=-3?"cold":"cool";
  const lvl = {hot:5,warm:4,warming:3,cool:2,cold:1}[k];

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","||c==="\t"){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function rcImport(){
  const rows = parseCSV(val("rc-imp"));

  const next = recCopy(); let added=0; const miss=[];
  rows.slice(1).forEach(r=>{
    const raw = (r[ci.who]||"").trim(); const rec = next.list.find(x=>x.name.toLowerCase()===raw.toLowerCase());
    if(!rec){ if(raw) miss.push(raw); return; }

    next.contacts.push(c); added++;
  });
  await saveRec(next, `Imported ${added} contact${added===1?"":"s"}.${miss.length?` Not on the list: ${[...new Set(miss)].join(", ")}.`:""}`);
}

const RELAY_PROXY = {"4x100":["100","200","100H","110H"], "4x400":["400","400 split","200","300H","800","100"], "4x800":["800","1600"]};
function rankMark(a, ev){ const ks = RELAY_PROXY[ev]||[ev]; for(let i=0;i<ks.length;i++){ const k=ks[i]; if(a.prs[k]) return {k, mk:a.prs[k], tier: (k==="400 split"?0:i)}; } return null; }
function rankIds(ev, ids){

}

/* ---- Hub: fires to put out ---- */
function coverageGaps(){
  const out = [];
  ["HS","JH"].forEach(lv=>["B","G"].forEach(g=>{
    const team = lv+"-"+g;
    const useA = Object.values(ASSIGN[team]||{}).some(x=>x.length);
    const evs = useA ? teamEvents(team) : COVER_EVENTS[lv][g];
    const gaps = evs.map(ev=>{
      const n = useA ? (((ASSIGN[team]||{})[ev])||[]).length : ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[ev]).length;
      return {ev, n};
    }).filter(x=>x.n<2).sort((a,b)=>a.n-b.n);
    out.push({lv, g, team, gaps, useA});
  }));
  return out;
}
function hotRecruits(n){
  return REC.list.filter(r=>r.status==="open").map(r=>({r, h:heat(r), cs:REC.contacts.filter(c=>c.rid===r.id)}))
    .filter(x=>x.cs.length && x.h.score>0).sort((a,b)=>b.h.score-a.h.score || b.cs.length-a.cs.length).slice(0,n);
}
function recordWatch(n){
  const out = [];
  ["HS","JH"].forEach(lv=>["B","G"].forEach(g=>{
    (RECORDS[lv+"-"+g]||[]).forEach(r=>{
      if(!r.key) return;
      const rv = markVal(r.key, r.mk); if(!isFinite(rv)) return;
      ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[r.key] && !(lv==="HS" && a.grade===9) && !String(r.who).includes(a.name)).forEach(a=>{
        const av = markVal(r.key, a.prs[r.key]); if(!isFinite(av)) return;
        const field = FIELD.has(r.key);
        const gap = field ? rv-av : av-rv;          // >0 means still short of the record
        const pct = gap / rv;
        if(pct <= (field?0.10:0.06)) out.push({a, r, lv, g, gap, pct, field});
      });
    });
  }));
  return out.sort((x,y)=>x.pct-y.pct).slice(0,n);
}

};

/* ---- Training paces (VDOT, Daniels/Gilbert formulas) ---- */
const PACE_SRC = [["1600",1600],["3200",3200],["XC 5K",5000],["XC 3K",3000]];  // 800 only if nothing else
const vdotOf = (m, sec) => { const t = sec/60, v = m/t; const vo2 = -4.60 + 0.182258*v + 0.000104*v*v;
  const pct = 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t); return vo2/pct; };
const vAt = V => (-0.182258 + Math.sqrt(0.182258**2 - 4*0.000104*(-4.60 - V))) / (2*0.000104);  // m/min
const paceFor = (V, frac, dist) => dist / vAt(V*frac) * 60;  // seconds
const mmss = s => { s = Math.round(s); const m = Math.floor(s/60), r = s - m*60; return m ? `${m}:${String(r).padStart(2,"0")}` : `${r}`; };
// Coach-set VDOT (hub_data key "vdot"): {id: {V, why, d}}. Wins over race-based VDOT until cleared.
let VOVR = {}, voMsg = {};
const MEET_M = {"800":800, "1600":1600, "1609":1609.34, "Mile":1609.34, "3200":3200, "XC 3K":3000, "XC 5K":5000, "3000":3000, "5000":5000};
const meetEv = ev => { const s = String(ev||"").replace(/\s+/g," ").trim(); const n = s.replace(/m$/i,"").replace(/^XC\s*/i, m => "XC ").toUpperCase();
  if (/^XC 5K|^5K|^5000/.test(n)) return "XC 5K"; if (/^XC 3K|^3K|^3000/.test(n)) return "XC 3K"; if (/^MILE/.test(n)) return "Mile";

const CROSS_OK = new Set(["100","200","400","800","1600","HJ","LJ"]);
function rankIn(pool, key, mk){
  const v = markVal(key, mk); if(!isFinite(v)) return null;
  const vals = pool.map(x=>markVal(key, x.prs[key])).filter(isFinite);
  const ahead = vals.filter(x => FIELD.has(key) ? x > v : x < v).length;
  return {r: ahead+1, n: vals.length};
}
function markRank(a, key){
  if(!a.prs[key] || key==="400 split") return null;
  const own = ATHLETES.filter(x=>x.level===a.level && x.g===a.g && x.prs[key]);
  const mine = rankIn(own, key, a.prs[key]);
  // JH athlete in the top 3 of everyone (HS + JH, same gender) in that event
  let hs = null;
  if(a.level==="JH" && CROSS_OK.has(key)){
    const all = ATHLETES.filter(x=>x.g===a.g && x.prs[key]);
    const r = rankIn(all, key, a.prs[key]);
    if(r && r.r <= 3) hs = r;
  }

}
function bestRank(a){
  let best = null, bestHs = null;
  Object.keys(a.prs).forEach(k=>{ const m = markRank(a,k); if(!m) return;
    const score = m.r / Math.max(m.n,1);
    if(!best || m.r < best.r || (m.r===best.r && score < best.score)) best = {...m, k, score};
    if(m.hs && (!bestHs || m.hs.r < bestHs.r)) bestHs = {...m.hs, k}; });
  return {best, bestHs};

// Who goes on a group's sheet: kids assigned to an event in that group on the Event Assignments board.
// If a team has no assignments saved yet, fall back to the athlete's event groups.
function groupRoster(lv, cat){
  const out = [];
  ["B","G"].forEach(g=>{
    const team = lv+"-"+g, t = ASSIGN[team] || {};
    const hasA = Object.values(t).some(x=>x && x.length);
    ATHLETES.filter(a=>a.level===lv && a.g===g).forEach(a=>{
      const inIt = hasA ? Object.keys(t).some(ev=>EV_CAT[ev]===cat && (t[ev]||[]).includes(a.id)) : a.cats.includes(cat);
      if (inIt) out.push(a);

}

const REP_RX = /\d\s*×\s*(flying\s+)?\d+\s*(m|min|sec)\b/;
const isRepLine = t => { const x = splitTags(t).text; return REP_RX.test(x) && !/^(E[12]\b|Strength|Warm-up)/i.test(x); };
function kidPace(a, d, cat, lv){
  const seen = new Set(), out = [];
  sheetRaw(d, cat, lv).filter(it => sheetFit(splitTags(it.t).tags, a) && !splitTags(it.t).tags.includes("Crossover")).forEach(it => {
    const text = splitTags(it.t).text; if (/^Warm-up/i.test(text)) return;
    linePaces(a, text).forEach(([k,v]) => { const s = k+" "+v.replace(/<[^>]+>/g,"").replace(/\s*\((from|est)[^)]*\)/,""); if (!seen.has(s)) { seen.add(s); out.push([k, s.slice(k.length+1)]); } });
  });

}
// Timed reps in a line: "3–4 × 400m", "3 × 5 min", "2 × flying 20m". Accelerations and strides aren't timed.
function lineReps(text){
  const out = [], rx = /(\d+)(?:\s*[–-]\s*(\d+))?\s*×\s*(flying\s+)?(\d+)\s*(m|min|sec)\b/g; let m;
  while ((m = rx.exec(text))) {
    const after = text.slice(rx.lastIndex, rx.lastIndex + 30);
    if (/^\s*(?:\(?[\w-]+\)?\s+){0,2}?(accelerations?|strides?)\b/i.test(after) || /^\s*(accelerations?|strides?)\b/i.test(after)) continue;
    const n = +(m[2] || m[1]), lab = (m[3] ? "fly " : "") + m[4] + (m[5]==="m" ? "" : m[5]==="min" ? "′" : "s");
    for (let i=0;i<Math.min(n,12);i++) out.push(lab);

}
const timedLine = it => { const {tags, text} = splitTags(it.t); return !tags.includes("Crossover") && isRepLine(it.t) && lineReps(text).length; };
// On a printed sheet every kid needs one version: untagged kids get the as-written (Level A) version of their usual group.
function sheetFit(tags, a){
  const t = DTAGS[a.id] || {}, saved = DTAGS[a.id];
  DTAGS[a.id] = {lv: t.lv || "A", path: t.path || (a.cats.includes("Distance") ? "Distance" : a.cats.includes("Mid Distance") ? "Mid" : undefined)};
  try { return tagsFit(tags, a); } finally { if (saved) DTAGS[a.id] = saved; else delete DTAGS[a.id]; }
}
function kidReps(a, d, cat, lv){ return sheetRaw(d, cat, lv).filter(it => timedLine(it) && sheetFit(splitTags(it.t).tags, a)).flatMap(it => lineReps(splitTags(it.t).text)); }
// A workout's "shape" so repeated workouts can be matched: main pace word + rep sizes. "3 × 5 min Tempo" ~ "4 × 5 min Tempo".
function wSig(text){
  const k = paceKinds(text).filter(x => x!=="Easy"), reps = [...new Set(lineReps(text))].sort();
  if (!reps.length) return "";
  return (k[0] || (/flying/i.test(text) ? "fly" : "reps")) + "|" + reps.join(",");
}
function logSig(l){
  const s = wSig(l.w || ""); if (s) return s;
  if (!l.reps || !l.reps.length) return "";
  const k = paceKinds(l.w || "").filter(x => x!=="Easy");
  return (k[0] || "reps") + "|" + [...new Set(l.reps.map(r => r.unit==="mi" ? r.dist+"mi" : String(r.dist)))].sort().join(",");
}
// Most recent logged session that matches this line (before the given date)
function lastTime(a, text, before){
  const sig = wSig(text); if (!sig) return null;
  const b4 = before ? iso(before) : "9999";
  return (a.log||[]).filter(l => l.kind==="run" && l.reps && l.reps.length && (l.iso||"") < b4 && logSig(l)===sig)
    .sort((x,y)=>(y.iso||"").localeCompare(x.iso||""))[0] || null;
}
const per400 = r => { const t = tSec(r.time), m = r.unit==="mi" ? r.dist*1609.34 : +r.dist; return isFinite(t) && m>0 ? t*400/m : NaN; };
const lastShort = l => l ? `${l.d}: ${splitsText(l)}` : "";
// How a logged session compares with the target pace for its main pace word
function sessionCheck(a, l){
  const k = paceKinds(l.w||"").find(x => x!=="Easy"); if (!k || !l.reps || !l.reps.length) return null;
  const secs = l.reps.map(per400).filter(isFinite); if (!secs.length) return null;
  const actual = secs.reduce((x,y)=>x+y,0)/secs.length, b = raceVdot(a) || athleteVdot(a);
  let target = null, frac = PACE_FRAC[k];
  if (frac && b) target = paceFor(athleteVdot(a).V, frac, 400);
  else if (RACE_M[k]) { const r = raceSec(a, b, k); if (r) target = r.s*400/RACE_M[k]; }
  if (!target) return null;
  const pct = (target-actual)/target*100;   // + = faster than target
  const implied = frac ? (() => { const v = 400/actual*60; return (-4.60 + 0.182258*v + 0.000104*v*v)/frac; })() : null;
  const r0 = l.reps[0], dist = r0.unit==="mi" ? r0.dist*1609.34 : +r0.dist || 400;
  return {k, actual, target, pct, implied, l, dist: Math.round(dist)};
}
function workoutCheck(a){
  const s = (a.log||[]).filter(l=>l.kind==="run").sort((x,y)=>(y.iso||"").localeCompare(x.iso||"")).map(l=>sessionCheck(a,l)).filter(Boolean).slice(0,4);
  const fast = s.filter(x=>x.pct>=2), slow = s.filter(x=>x.pct<=-3);
  const imp = s.map(x=>x.implied).filter(Boolean);
  const sugg = fast.length>=2 && imp.length ? Math.min(...imp.slice(0,3)) : null;   // conservative: the lowest of the recent workout VDOTs
  return {s, fast, slow, sugg: sugg && sugg > (athleteVdot(a)||{V:0}).V + 0.3 ? sugg : null};
}

const sheetLine = t => { const {tags, text} = splitTags(t); return (tags.length ? "(" + tags.map(x=>TAG_CHIP[x]||x).join(", ") + ") " : "") + text; };

function buildSheets(){
  const weeks = sortedWeeks(); const w = weeks.find(x=>x.start===sh.week);

  days.forEach(d=>{
    const date = w && d ? dayDate(w, d.day) : (sh.blankDate ? parseD(sh.blankDate) : null);
    const dateLabel = date ? date.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}) : "Date: ____________";
    sh.groups.forEach(cat=>{
      const lvs = sh.lv==="Both" ? ["Both"] : [sh.lv];
      lvs.forEach(lv=>{
        const focus = d ? (typeof d.focus==="string" ? d.focus : (lv==="Both" ? Object.entries(d.focus||{}).map(([l,f])=>l+": "+f).join(" · ") : (d.focus||{})[lv]||"")) : "";

/* ---- Week packets: cover page with the whole program, then a sheet per group per day ---- */
const STAFF_MAP = {"Distance":["Distance","Mid Distance"], "Sprints":["Sprints","Hurdles"], "Hurdles":["Hurdles"], "Jumps":["Long Jump","High Jump","Pole Vault"],
  "Pole Vault":["Pole Vault"], "Throws":["Shot Put","Discus"], "Long Jump":["Long Jump"], "High Jump":["High Jump"], "Shot Put":["Shot Put"], "Discus":["Discus"], "Mid Distance":["Mid Distance"]};

function pickCoach(name){

  const s = name ? STAFF.find(x=>x.name===name) : null;
  if (s) { const g = staffGroups(s); if (g.length) sh.groups = g; sh.plv = staffLv(s); }
  else { sh.groups = [...CATEGORIES]; sh.plv = "Both"; }

const restOnly = items => !items.length || items.every(t => /^(\[[^\]]+\]\s*)*Rest\b/i.test(t));
function coverHTML(w, lvs){
  const fmt = d => dayDate(w, d.day).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  const who = sh.coach ? `${sh.coach} · ${sh.groups.join(", ")}` : "Full program";
  const days = w.days.map(d => ({d, blocks: sh.groups.flatMap(cat => lvs.map(lv => ({cat, lv, items: sheetItems(d, cat, lv)}))).filter(b => b.items.length)})).filter(x => x.blocks.length);
  return `<section class="sheet cover">
    <div class="sh-head"><div><div class="sh-brand">Benton Central Track &amp; Field · Week Packet</div><div class="sh-title">${esc(weekLabel(w))}</div></div>
      <div class="sh-meta"><div><b>${esc(who)}</b></div><div>${lvs.join(" + ")}</div></div></div>
    ${days.length ? `<div class="cv-days">${days.map(({d,blocks})=>`<div class="cv-day"><h4>${esc(fmt(d))}</h4>
      ${blocks.map(b=>{ const f = gFocus(d,b.cat) || focusFor(d,b.lv); return `<div class="cv-blk"><b>${esc(b.cat)}${lvs.length>1?" · "+b.lv:""}</b>${f?` <span class="cv-f">${esc(f)}</span>`:""}
        <ul>${b.items.map(t=>`<li>${esc(sheetLine(t))}</li>`).join("")}</ul></div>`; }).join("")}</div>`).join("")}</div>`
      : `<p>Nothing posted for these groups this week.</p>`}

}
function buildPacket(){
  const w = sortedWeeks().find(x=>x.start===sh.week); if (!w) return `<p class="note">Pick a posted week.</p>`;
  const lvs = sh.plv==="Both" ? ["HS","JH"] : [sh.plv];
  const out = [coverHTML(w, lvs)];
  lvs.forEach(lv => sh.groups.forEach(cat => w.days.forEach(d => {
    const items = sheetItems(d, cat, lv); if (restOnly(items)) return;
    const date = dayDate(w, d.day);
    const focus = gFocus(d,cat) || focusFor(d, lv);
    out.push(sheetHTML({dateLabel: date.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}), dayName: d.day, focus, cat, lv, items, d, date}));
  })));

let imp = {text:"", rows:null, msg:{kind:"",text:""}};
function impParse(){

  try { arr = JSON.parse(imp.text.trim().replace(/^```(json)?|```$/g,"").trim()); } catch(e) { imp.msg = {kind:"err", text:"That text isn't in the right format. Paste exactly what Claude sent, including the [ ] brackets."}; render(); return; }
  if (!Array.isArray(arr)) arr = [arr];
  const rows = arr.map(r=>{
    const a = ATHLETES.find(x=>x.id===r.id) || ATHLETES.find(x=>(x.fullName||x.name).toLowerCase()===String(r.name||"").toLowerCase());
    return {r, a};
  });
  imp.rows = rows;
  const bad = rows.filter(x=>!x.a).length;
  imp.msg = {kind: bad?"err":"ok", text: `${rows.length - bad} entr${rows.length-bad===1?"y":"ies"} ready.${bad?` ${bad} didn't match an athlete and will be skipped.`:""} Check them below, then save.`};

}
function impSummary(r){
  if (r.meet) return `Meet: ${r.meet.m||""} · ${r.meet.ev||""} ${r.meet.mk||""}`;
  const fake = {kind:r.kind||"run", reps:r.reps, att:r.att, ev:r.ev, lifts:r.lifts, s:r.s};

}
async function impSave(){
  if (!imp.rows) return;
  const next = logsCopy(); let n = 0, dup = 0;
  imp.rows.filter(x=>x.a).forEach(({r,a})=>{
    const L = ensure(next, a.id);
    if (r.meet) { const m = {m:r.meet.m||"", ev:r.meet.ev||"", mk:r.meet.mk||"", pl:r.meet.pl||""};
      if (L.meets.some(x=>x.m===m.m && x.ev===m.ev && x.mk===m.mk)) { dup++; return; } L.meets.push(m); n++; return; }
    const isoD = r.d || iso(today);
    const e = {d: parseD(isoD).toLocaleDateString("en-US",{month:"short",day:"numeric"}), iso: isoD, kind: r.kind||"run", w: r.w||"", n: r.n||""};
    if (r.reps) e.reps = r.reps; if (r.att) { e.att = r.att; e.ev = r.ev; } if (r.lifts) e.lifts = r.lifts; if (r.s) e.s = r.s;
    const key = JSON.stringify([e.iso, e.w, e.reps||e.att||e.lifts||e.s]);
    if (L.log.some(x=>JSON.stringify([x.iso, x.w, x.reps||x.att||x.lifts||x.s])===key)) { dup++; return; }
    L.log.push(e); L.log.sort((x,y)=>(x.iso||"").localeCompare(y.iso||"")); n++;
  });
  if (!n) { imp.msg = {kind:"err", text: dup ? "All of these were already saved. Nothing new to add." : "Nothing to save."}; render(); return; }
  if (await saveLogs(next, `Imported ${n} entr${n===1?"y":"ies"}.${dup?` Skipped ${dup} already saved.`:""}`)) { imp.msg = {kind:"ok", text: dlMsg.text}; imp.rows = null; imp.text = ""; render(); }
  else { imp.msg = dlMsg; render(); }
}

  },
  hub(){

      <div class="anetrow">${["JH","HS"].map(l=>`<a class="anet" href="${anetTeam(l)}" target="_blank" rel="noopener"><b>Athletic.net</b> ${ANET_TEAMS[l].name} ↗</a>`).join("")}</div></div>
      <div class="hero">
        <div class="nextmeet"><div class="lanes"></div>
                    ${nm ? `<div class="eyebrow nm-eye">Next meet · ${nm.level==="JH"?"Junior High":"High School"}</div>
            <h2 class="nm-name">${esc(nm.meet)}</h2>
            <div class="count">${days}<span>${days===1?"day away":"days away"}</span></div>

            <div class="nw">${groups.map(([n,it])=>`${groups.length>1&&n?`<div class="nw-g">${esc(n)}</div>`:""}<ul>${it.map(x=>`<li>${itemHTML(x)}</li>`).join("")}</ul>`).join("")}</div>

        })()}</div>
      </div>
      ${(()=>{ const nx = nextWorkout(); const w = (nx && nx.w) || currentWeek() || nextWeek(); if (!w) return "";
        const rest = w.days.filter(d => dayDate(w,d.day) >= today && !(nx && nx.w===w && nx.d===d));

      ${(()=>{ const cg = coverageGaps(), hr = hotRecruits(5), rw = recordWatch(5);

          <div class="panel fire"><div class="fire-h"><h3>Coverage gaps</h3><span class="fire-n">${totalGaps}</span></div>

            <a class="fire-link" href="#coverage">Coverage →</a></div>

            ${hr.length?`<ol class="fire-list">${hr.map(({r,h,cs})=>`<li><span><b>${esc(r.name)}</b><small>${r.lvl} ${r.g==="B"?"Boys":"Girls"}${r.sport&&r.sport!=="Other"?" · "+esc(r.sport):""} · ${cs[cs.length-1].self?"self signed up on Final Forms":"last: "+esc(cs[cs.length-1].by)}</small></span>${meter(h)}</li>`).join("")}</ol>`

          <div class="panel fire"><div class="fire-h"><h3>Record watch</h3><span class="fire-n">${rw.length}</span></div>
            <p class="note" style="margin:0">Closest to a school record.</p>
            ${rw.length?`<ol class="fire-list">${rw.map(x=>`<li><span><b><a href="#a-${x.a.id}">${esc(x.a.name)}</a></b><small>${x.lv} ${GN[x.g]} ${esc(x.r.ev)} · ${esc(x.a.prs[x.r.key])} vs ${esc(x.r.mk)}</small></span><span class="rw-gap">${gapText(x)}</span></li>`).join("")}</ol>`

            <a class="fire-link" href="#records">Records →</a></div>
        </div></section>`; })()}

  schedule(){

  athletes(){
    const base = ATHLETES.filter(a => (alv==="All"||a.level===alv) && (ag==="All"||a.g===ag) && (!q || a.name.toLowerCase().includes(q.toLowerCase())));
    const list = base.filter(a => cat==="All" || a.cats.includes(cat)).sort((a,b)=>a.level.localeCompare(b.level)*-1 || (b.grade||0)-(a.grade||0) || a.name.localeCompare(b.name));

      <div class="bar" style="justify-content:flex-start">
        ${segBtns(alv,[["All","All"],["HS","HS"],["JH","JH"]],"(v=>setA('lv',v))")}
        ${segBtns(ag,[["All","All"],["B","Boys"],["G","Girls"]],"(v=>setA('g',v))")}
        <input id="asearch" class="search" type="search" placeholder="Search name" value="${esc(q)}" oninput="q=this.value;render();const e=document.getElementById('asearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)">

      ${list.length?`<div class="roster">${list.map(a=>`<a class="ath" href="#a-${a.id}">
        <div class="athtop"><strong>${esc(a.name)}</strong><span class="lvlchip">${a.level} · ${a.g==="B"?"Boys":"Girls"}</span></div>${a.isNew?`<span class="chip new-chip">New</span>`:""}
        <span>Grade ${a.grade??"—"} · ${a.isNew?"New this season":a.events[0]==="XC"?"Cross country":a.events.map(evn).join(", ")}</span>
        ${(()=>{ const {best,bestHs} = bestRank(a); return best||bestHs ? `<div class="card-rank">${best?`<span class="rk ${best.r===1?"r1":best.r<=3?"r3":""}">#${best.r} ${esc(evn(best.k))}</span>`:""}${bestHs?`<span class="hs-tag">★ Top 3 overall · ${esc(evn(bestHs.k))}</span>`:""}</div>` : ""; })()}
        <div>${a.cats.map(c=>`<span class="chip ${c===cat?"on":""}">${esc(c)}</span>`).join("")}</div></a>`).join("")}</div>`

      <p class="note">Track marks are spring 2026 bests. Cross country times are from this fall (JH 3000m, HS 5000m). <b>#</b> is the athlete's best rank on their team. <span class="hs-tag">★ Top 3 overall</span> means a JH athlete is top 3 in that event among all boys or girls, HS and JH combined (flat races and jumps only, since hurdles, shot, and discus use different heights and weights).</p></div>`;

  workouts(){

    if(!vw.length) return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Spring 2027</div><h1>Workouts</h1></div>${postBtn}</div>

          ${d.split?`<div class="ed-grid2">

              <label class="ed-row" for="ed-fh-${di}"><span>HS focus</span><input id="ed-fh-${di}" type="text" value="${esc(d.fHS)}" placeholder="e.g. Speed" oninput="ed.days[${di}].fHS=this.value"></label></div>`

  warmups(){

    const tellCoach = `<div class="panel care-alert"><b>If something hurts in a way that changes how you run, stop and tell a coach that day.</b> Coaches and the athletic trainer decide when you're ready to go again. This page is general info, not a diagnosis.</div>`;

    if (wtab==="stretch") {
      const list = WARMUPS.stretch || STRETCH_DEFAULT;
      body = `<div class="panel"><h2>Stretching basics</h2><ul class="exp">${STRETCH_RULES.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
        <div class="muscles">${list.map(g=>`<div class="panel muscle"><h3>${esc(g.m)}</h3>${g.why?`<p class="note" style="margin:4px 0 0">${esc(g.why)}</p>`:""}
          ${g.s&&g.s.length?`<div class="mlabel">Stretches</div><ul class="mlist">${g.s.map(x=>`<li><span>${itemHTML(x)}</span>${x.d?`<em>${esc(x.d)}</em>`:""}</li>`).join("")}</ul>`:""}
          ${g.x&&g.x.length?`<div class="mlabel">Also try</div><ul class="mlist">${g.x.map(x=>`<li><span>${itemHTML(x)}</span>${x.d?`<em>${esc(x.d)}</em>`:""}</li>`).join("")}</ul>`:""}

      body = `<div class="cols">
          <div class="panel care-sore"><h2>Normal soreness</h2><p class="note" style="margin:4px 0 0">Keep training, maybe a little easier.</p><ul class="exp">${SORE_VS_PAIN.sore.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
          <div class="panel care-pain"><h2>Pain to report</h2><p class="note" style="margin:4px 0 0">Stop and tell a coach.</p><ul class="exp">${SORE_VS_PAIN.pain.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        </div>
        <div class="panel"><h2>DOMS: the day-after soreness</h2><p style="margin:8px 0 0;max-width:68ch">${esc(DOMS.what)}</p>

          <p class="note">${esc(DOMS.note)}</p></div>
        ${tellCoach}`;

      const R = ICE_RESEARCH;
      const acro = (word, rows) => `<div class="panel"><h2 class="acro-word">${word}</h2><dl class="acro">${rows.map(([l,w,d])=>`<dt>${l}</dt><dd><b>${esc(w)}</b><span>${esc(d)}</span></dd>`).join("")}</dl></div>`;
      body = `<div class="panel care-alert"><b>Short version:</b> ${esc(R.bottom)}</div>
        <div class="cols">${R.points.map(x=>`<div class="panel"><h3>${esc(x.h)}</h3><p style="margin:6px 0 0">${esc(x.p)}</p></div>`).join("")}</div>
        <div><h2>What's replaced RICE: PEACE &amp; LOVE</h2><p class="note" style="margin:4px 0 0">PEACE for the first few days, then LOVE as it heals.</p></div>

        <div class="panel"><h3>Sources</h3><ul class="exp">${R.sources.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`).join("")}</ul></div>
        ${tellCoach}`;

      body = `<div class="injuries">${INJURIES.map(i=>`<div class="panel inj"><h3>${esc(i.n)}</h3>
          <dl class="inj-dl"><dt>Feels like</dt><dd>${esc(i.feel)}</dd><dt>Usually from</dt><dd>${esc(i.why)}</dd></dl>

  records(){

            ${b.length?`<tr class="rec-hit"><td colspan="4"><span class="chip gold">Beaten?</span> ${b.map(x=>`<a href="#a-${x.a.id}">${esc(x.a.name)}</a> ${esc(x.mk)}${x.a.pri&&x.a.pri[r.key]?` <span class="muted">(${esc(x.a.pri[r.key])})</span>`:""}`).join(", ")}</td></tr>`:""}`; }).join("")}</tbody></table></div>`

  coverage(){
    const lv = level;
    const teamHas = g => Object.values(ASSIGN[lv+"-"+g]||{}).some(x=>x.length);
    const cell = (g, ev) => {
      const marks = ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[ev]).sort((x,y)=>better(ev)({mk:x.prs[ev]},{mk:y.prs[ev]}));
      const asgd = rankIds(ev, (((ASSIGN[lv+"-"+g]||{})[ev])||[]));
      const useA = teamHas(g);
      const n = useA ? asgd.length : marks.length;
      const st = n>=2?"ok":n===1?"thin":"gap";
      const list = useA
        ? (asgd.length ? asgd.map(a=>`<a href="#a-${a.id}">${esc(a.name)}</a>${a.prs[ev]?` <span class="muted">${esc(a.prs[ev])}</span>`:""}`).join(", ") : `<span class="muted">Nobody assigned yet</span>`)
        : (marks.length ? marks.map(a=>`<a href="#a-${a.id}">${esc(a.name)}</a>`).join(", ") : `<span class="muted">Nobody with a mark yet</span>`);
      return `<tr><td>${esc(evLabel(ev))}</td><td><span class="cov ${st}">${n}</span></td><td>${list}</td></tr>`;
    };
    const xc = ATHLETES.filter(a=>a.level===lv && Object.keys(a.prs).every(k=>k.startsWith("XC"))).length;
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Goal: two prepared athletes in every event</div><h1>Event Coverage</h1></div>${levelToggle()}</div>
      <div class="legend"><span><span class="cov ok">2+</span> Covered</span><span><span class="cov thin">1</span> Thin</span><span><span class="cov gap">0</span> Gap</span></div>

        <div class="tbl"><table><thead><tr><th>Event</th><th>#</th><th>${useA?"Assigned":"Athletes with a mark"}</th></tr></thead><tbody>
        ${[...COVER_EVENTS[lv][g], ...(useA?RELAYS[lv]:[])].map(ev=>cell(g,ev)).join("")}</tbody></table></div></div>`; }).join("")}</div>
      ${canPost?`<p><a class="anet" href="#coaches" onclick="ctab='assign';asg.team='${lv}-B'"><b>Edit event assignments</b> →</a></p>`:""}
      <p class="note">${xc?`${xc} ${lv} athletes only have cross country times so far.`:""}</p></div>`;

  recruiting(){

          <optgroup label="Athletes">${[...ATHLETES].sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${a.id===me?"selected":""}>${esc(a.name)}</option>`).join("")}</optgroup></select></label>

      ${top.length?`<div class="panel"><h2>Top recruiters</h2><ol class="toprec">${top.map(([n,x])=>`<li><b>${esc(n)}</b><span>${joinedBy[n]?`${joinedBy[n]} joined · `:""}${x.y} warm/hot · ${x.n} talk${x.n===1?"":"s"}</span></li>`).join("")}</ol></div>`:""}
      <div class="bar" style="justify-content:flex-start">
        ${segBtns(rf.lv,[["All","All"],["HS","HS"],["JH","JH"]],"(v=>{rf.lv=v;render()})")}
        ${segBtns(rf.g,[["All","All"],["B","Boys"],["G","Girls"]],"(v=>{rf.g=v;render()})")}
        ${segBtns(rf.gr,[["All","All grades"],["9","Fr"],["10","So"],["11","Jr"],["12","Sr"],["JH","JH"]],"(v=>{rf.gr=v;render()})")}
        ${segBtns(rf.sort,[["heat","Closest to joining"],["name","A–Z"]],"(v=>{rf.sort=v;render()})")}
        <input id="rsearch" class="search" type="search" placeholder="Search name" value="${esc(rf.q)}" oninput="rf.q=this.value;render();const e=document.getElementById('rsearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
      </div>
      <div class="legend">${["none","cold","cool","warming","warm","hot","joined"].map(k=>meter({k,l:HEAT_NAMES[k],lvl:{none:0,cold:1,cool:2,warming:3,warm:4,hot:5,joined:5}[k]})).join("")}</div>
      <div class="tbl"><table class="rtable"><thead><tr><th>Name</th><th>Heat</th><th>Talked to</th><th>Last contact</th><th></th></tr></thead><tbody>
        ${rows.map(({r,h,cs})=>{ const last = cs[cs.length-1]; const by = [...new Set(cs.filter(c=>!c.self).map(c=>c.by))];
          return `<tr class="${r.status==="closed"?"dim":""}"><td><b>${esc(r.name)}</b><div class="muted">${r.lvl} ${r.g==="B"?"Boys":"Girls"}${recGr(r)?" · "+recGr(r):""}${r.sport&&r.sport!=="Other"?" · "+esc(r.sport):""}</div></td>
            <td>${meter(h)}</td>
            <td>${by.length?by.map(b=>`<span class="chip">${esc(b)}</span>`).join(""):`<span class="muted">Nobody yet</span>`}</td>
            <td>${last?(last.self?`<span class="resp sc-warm">${esc(SELF_BY)}</span>`:`${esc(last.by)} · ${scaleTag(last)}`)+`<div class="muted">${shortD(last.d)}</div>`:"—"}</td>
            <td>${r.status==="open"?form(r):""}</td></tr>`; }).join("")}
      </tbody></table></div>

  _talk(){

            ${[["4 × 200m at 800 pace","Event-specific endurance","race"],["3 × 300m at 800 pace","Event-specific endurance","race"],["3 × flying 20m","Maximum velocity","speed"],["4 × 100m strides","Mechanics and controlled speed","aero"]].map(([w,a,t])=>`<tr><td>${w}</td><td><span class="wcode ty-${t}" style="vertical-align:0">&nbsp;</span>${a}</td></tr>`).join("")}</tbody></table></div>

  paces(){
    let rows = paceAthletes().filter(x=>(level==="All"||x.a.level===level) && (ag==="All"||x.a.g===ag));
    if(pq) rows = rows.filter(x=>x.a.name.toLowerCase().includes(pq.toLowerCase()));
    rows.sort((x,y)=>y.b.V-x.b.V);
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">VDOT training paces</div><h1>Paces</h1></div>
        <div class="bar">${segBtns(level,[["HS","HS"],["JH","JH"]],"(v=>{level=v;render()})")}${segBtns(ag,[["All","All"],["B","Boys"],["G","Girls"]],"(v=>setA('g',v))")}</div></div>
      <p class="lede" style="margin:0">Paces come from each runner's best race (mile, 3200, or this fall's XC). Find your name, then use these for <b>Easy</b>, <b>Steady</b>, <b>Tempo</b>, <b>Interval</b>, <b>Rep</b>, and <b>800/1600 pace</b> days. These are the same words used on the Workouts page.</p>
      <input id="psearch" class="search" type="search" placeholder="Search name" value="${esc(pq)}" oninput="pq=this.value;render();const e=document.getElementById('psearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
      <div class="tbl"><table class="ptable"><thead><tr><th>Athlete</th><th>Based on</th><th>VDOT</th><th>Easy /mi</th><th>Steady /mi</th><th>Tempo /mi</th><th>Tempo /400</th><th>Interval /400</th><th>Interval /800</th><th>Rep /200</th><th>Rep /400</th><th>800 pace /200</th><th>1600 pace /400</th></tr></thead><tbody>
        ${rows.map(({a,b})=>{ const p = paceSet(b.V); return `<tr><td><a href="#a-${a.id}"><b>${esc(a.name)}</b></a><div class="muted">${a.g==="B"?"Boys":"Girls"} · ${a.grade??"—"}</div></td>
          <td>${esc(evn(b.k))} ${esc(b.mk)}</td><td class="mono"><b>${b.V.toFixed(1)}</b></td>
          <td class="mono">${p.easy[0]}–${p.easy[1]}</td><td class="mono">${p.steady}</td><td class="mono">${p.tempo}</td><td class="mono">${p.tempo400}</td>
          <td class="mono">${p.int400}</td><td class="mono">${p.int800}</td><td class="mono">${p.rep200}</td><td class="mono">${p.rep400}</td>
          ${["800","1600"].map(ev=>{ const r = raceSec(a, b, ev); return `<td class="mono">${r?mmss(r.s*(ev==="800"?200:400)/RACE_M[ev]):"—"}${r&&r.src==="est."?"*":""}</td>`; }).join("")}</tr>`; }).join("") || `<tr><td colspan="13" class="muted">No runners match.</td></tr>`}
      </tbody></table></div>
      <div class="cols">
        <div class="panel"><h3>What each pace is for</h3><dl class="inj-dl">
          <dt>Easy</dt><dd>Recovery runs and long runs. Conversational. Slower is fine.</dd>
          <dt>Steady</dt><dd>Strong but relaxed, a notch slower than Tempo. Used for the middle of some aerobic runs.</dd>
          <dt>Tempo</dt><dd>Comfortably hard, about 20 minutes of steady effort. Tempo runs and cruise intervals.</dd>
          <dt>Interval</dt><dd>Hard. 400s to 1000s with jog recovery about as long as the rep.</dd>
          <dt>Rep</dt><dd>Fast and smooth. 200s and 400s with full recovery. Speed and form.</dd>
          <dt>800 / 1600 pace</dt><dd>Your current race pace for that event, from your PR. * = estimated from your VDOT because there's no PR yet.</dd></dl></div>
        <div class="panel"><h3>About these numbers</h3><ul class="exp">
          <li>Calculated with Jack Daniels' VDOT formulas from the race shown.</li>
          <li>XC courses vary, so XC-based paces can run a little slow. A new track race updates them.</li>
          <li>800-only runners are rated off the 800, which can make distance paces too fast. Ease into them.</li>
          <li>Heat, wind, and a bad night of sleep all count. Effort matters more than hitting the exact number.</li></ul></div>
      </div></div>`;
  },

          <div class="muscles">${M.breath.map(b=>`<div class="panel"><h3>${esc(b.t)}</h3><dl class="inj-dl"><dt>How</dt><dd>${esc(b.how)}</dd><dt>When</dt><dd>${esc(b.when)}</dd></dl></div>`).join("")}</div></div>

      <div class="panel care-alert"><h3>Uniform rules</h3><ul class="exp">${G.rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
  },
  team(){
    return `${back}<div class="stack"><div><div class="eyebrow">Benton Central Track &amp; Field</div><h1>Team</h1></div>
      <div><h2 style="margin-bottom:10px">Coaching staff</h2><div class="staff">${STAFF.map(c=>`<div class="panel ${c.name?"":"open"}"><div class="eyebrow">${esc(c.role)}</div><h3>${c.name?esc(c.name):"To be named"}</h3></div>`).join("")}</div></div>
      <div><h2 style="margin-bottom:10px">How we run</h2><div class="cols">${PHILOSOPHY.map(x=>`<div class="panel"><h3>${esc(x.h)}</h3><p style="margin:6px 0 0">${esc(x.p)}</p></div>`).join("")}</div></div>
      <div class="cols">
        <div class="panel"><h2>Daily practice</h2><ol class="steps">${PRACTICE_FLOW.map(x=>`<li><span>${esc(x)}</span><em></em></li>`).join("")}</ol></div>
        <div class="panel"><h2>Expectations</h2><ul class="exp">${EXPECTATIONS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      </div></div>`;
  },
  data(){
    const list = ATHLETES.filter(a=>a.level===level);
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Per-athlete pages</div><h1>Data Log</h1></div>${levelToggle()}</div>
      <div class="tbl"><table><thead><tr><th>Athlete</th><th>Categories</th><th>Logged workouts</th><th>Meets</th><th>Latest entry</th></tr></thead><tbody>
      ${list.map(a=>`<tr><td><a href="#a-${a.id}">${esc(a.name)}</a></td><td>${a.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</td><td class="mono">${a.log.length}</td><td class="mono">${a.meets.length}</td>
        <td>${a.log.length?esc(a.log[a.log.length-1].d+" · "+a.log[a.log.length-1].w):"—"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  },
  athlete(id){
    const a = ATHLETES.find(x=>x.id===id);
    if(!a) return `${back}<h1>Athlete not found</h1><p><a href="#athletes">Back to Athletes</a></p>`;
    const evs = [...new Set([...Object.keys(a.prs), ...assignedEvents(a), ...Object.keys(a.goals||{}), ...a.events.filter(e=>e!=="XC" && !e.startsWith("4x"))])].sort((x,y)=>Object.keys(EV_NAME).indexOf(x)-Object.keys(EV_NAME).indexOf(y));
    return `<a class="backlink" href="#athletes">← Athletes</a>
      <div class="stack"><div><div class="eyebrow">${a.level} · ${a.g==="B"?"Boys":"Girls"} · Grade ${a.grade??"—"}${a.cats.length?" · "+a.cats.map(esc).join(" · "):""}</div><h1>${esc(a.name)}</h1>
        <p class="lede">${a.isNew?"New this season. Events to be decided.":a.events[0]==="XC"?"Cross country runner, no track marks yet":`Events: ${a.events.map(e=>`<span class="chip">${esc(evn(e))}</span>`).join("")}`}</p>
        <div class="anetrow"><a class="anet" href="${anetTeam(a.level)}" target="_blank" rel="noopener"><b>Athletic.net</b> ${a.level==="JH"?"Junior High":"High School"} team page ↗</a></div></div>
      <div class="panel"><h2>Best marks &amp; goals</h2>${a.level==="JH"&&evs.some(e=>{const m=markRank(a,e);return m&&m.hs;})?`<p class="hs-note"><span class="hs-tag">★ Top 3 overall</span> = top 3 of all ${a.g==="B"?"boys":"girls"} in the program, high school included.</p>`:""}<div class="prgrid">
        ${evs.map(e=>{ const m = markRank(a,e); return `<div class="pr ${m&&m.hs?"pr-hs":""}"><div class="ev">${esc(evn(e))}</div><div class="mk">${esc(a.prs[e]||"—")}</div>${a.pri&&a.pri[e]?`<div class="when2">${esc(a.pri[e])}</div>`:""}
          ${m?`<div class="rank"><span class="rk ${m.r===1?"r1":m.r<=3?"r3":""}">${ordinalTag(m,a)}</span>${m.hs?`<span class="hs-tag" title="Rank among all ${a.g==="B"?"boys":"girls"}, HS and JH">★ Top 3 overall · #${m.hs.r} of ${m.hs.n}</span>`:""}</div>`:""}
          <div class="gl">Goal <b>${esc(a.goals[e]||"—")}</b></div></div>`; }).join("")}
      </div></div>
      ${(()=>{ if(!(a.cats.includes("Distance")||a.cats.includes("Mid Distance"))) return ""; const b = athleteVdot(a); if(!b) return ""; const p = paceSet(b.V);
        return `<div class="panel"><div class="bar"><h2>Training paces</h2><span class="muted">VDOT ${b.V.toFixed(1)} · from ${esc(evn(b.k))} ${esc(b.mk)}</span></div>
          <div class="prgrid">${[["Easy","/mi",`${p.easy[0]}–${p.easy[1]}`],["Tempo","/mi",p.tempo],["Tempo","/400",p.tempo400],["Interval","/400",p.int400],["Interval","/800",p.int800],["Rep","/200",p.rep200],["Rep","/400",p.rep400]]
            .map(([l,u,v])=>`<div class="pr"><div class="ev">${l} ${u}</div><div class="mk">${v}</div></div>`).join("")}</div>
          <p class="note" style="margin:8px 0 0">${a.level==="HS"?(()=>{ const t = DTAGS[a.id]||{}; return (t.lv?`<span class="tchip">${esc(TAG_CHIP[t.lv])}</span>`:"")+(t.path?`<span class="tchip">${esc(TAG_CHIP[t.path])}</span>`:"")+``; })():""}<a href="#paces">What each pace means →</a></p></div>`; })()}
      ${myWeekHTML(a)}
      ${checkHTML(a)}
      <div><h2 style="margin-bottom:10px">Workout log</h2>
        ${a.log.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Workout</th><th>Splits / marks</th><th>Notes</th></tr></thead><tbody>
          ${a.log.map(l=>`<tr><td class="mono">${esc(l.d)}</td><td>${esc(l.w)}</td><td class="split">${esc(splitsText(l))||"—"}</td><td>${esc(l.n)}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note">No workouts logged yet.</p>`}</div>
      <div><h2 style="margin-bottom:10px">Meet results</h2>
        ${a.meets.length?`<div class="tbl"><table><thead><tr><th>Meet</th><th>Event</th><th>Mark</th><th>Place</th></tr></thead><tbody>
          ${a.meets.map(m=>`<tr><td>${esc(m.m)}</td><td>${esc(m.ev)}</td><td class="mono">${esc(m.mk)}</td><td>${esc(m.pl)}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note">No meet results yet.</p>`}</div>
      </div>`;
  },
};

function applyNameMode(){
  const short = PUBLIC_INITIALS && !canPost;
  ATHLETES.forEach(a=>{ a.fullName = a.fullName || a.name; a.name = short ? shortName(a.fullName) : a.fullName; });
  REC.list.forEach(r=>{ r.fullName = r.fullName || r.name; r.name = short ? shortName(r.fullName) : r.fullName; });
}
function render(){
  applyNameMode();
  const h = (location.hash || "#hub").slice(1);
  const isAth = h.startsWith("a-");
  if (h==="post") { ctab="workouts"; }
  const key = isAth ? "athletes" : h==="post" ? "coaches" : (views[h] && h!=="athlete" && !h.startsWith("_") ? h : "hub");
  const curG = (SECTIONS.find(x=>x.id===key)||{}).g || "";
  const top = [`<a href="#hub" ${key==="hub"?'aria-current="page"':""}>Hub</a>`,
    ...NAV_GROUPS.map(([g,l])=>{ const first = SECTIONS.find(x=>x.g===g); return `<a href="#${first.id}" ${curG===g?'aria-current="page"':""}>${l}</a>`; }),
    `<a href="#coaches" ${key==="coaches"?'aria-current="page"':""}>${canPost?"Coaches":"Coach login"}</a>`].join("");
  document.getElementById("tabs").innerHTML = top;
  const sub = document.getElementById("subnav");
  if (curG) { sub.hidden = false; sub.innerHTML = `<div class="wrap subnav-in">${SECTIONS.filter(x=>x.g===curG && (!x.coach || canPost)).map(x=>`<a href="#${x.id}" ${x.id===key?'aria-current="page"':""}>${x.name}</a>`).join("")}</div>`; }
  else { sub.hidden = true; sub.innerHTML = ""; }
  document.getElementById("view").innerHTML = isAth ? views.athlete(h.slice(2)) : views[key]();
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => { if(location.hash!==lastHash){ lastHash=location.hash; awIdx=null; fmp=false; window.scrollTo(0,0); lk={id:null,msg:{kind:"",text:""}}; } render(); });
render();
async function loadAll(){
  if (!SB) return;
  const {data, error} = await SB.from("hub_data").select("key,value,updated_at");
  if (error || !data) return;
  const byKey = {}; data.forEach(r=>{ byKey[r.key] = r.value; STAMP[r.key] = r.updated_at; });
  const w = byKey.workouts, wu0 = byKey.warmups, lg = byKey.logs, rj = byKey.recruits, aj = byKey.assignments;
  if (aj && typeof aj === "object") ASSIGN = Object.assign({"HS-B":{}, "HS-G":{}, "JH-B":{}, "JH-G":{}}, aj);
  if (rj && Array.isArray(rj.list)) REC = {list: rj.list, contacts: (rj.contacts||[]).map(({note, ...c})=>c)};
  if (Array.isArray(w)) WORKOUTS = w;
  if (wu0 && wu0.practice) WARMUPS = Object.assign({}, WARMUPS, wu0);
  if (lg && typeof lg === "object") LOGS = lg;
  if (byKey.links && typeof byKey.links === "object") LINKS = byKey.links;
  if (byKey.dtags && typeof byKey.dtags === "object") { DTAGS = byKey.dtags; dtDraft = null; }
  if (byKey.vdot && typeof byKey.vdot === "object") VOVR = byKey.vdot;
  if (byKey.winter && Array.isArray(byKey.winter.ids)) WINTER = {ids: byKey.winter.ids};
  if (byKey.midnotes && typeof byKey.midnotes === "object") { MDNOTES = Object.assign({general:"", mods:""}, byKey.midnotes); mdn = null; }
  if (byKey.signups && typeof byKey.signups === "object") SIGN = Object.assign(JSON.parse(JSON.stringify(SIGNUPS_SEED)), byKey.signups);
  applyLogs();
  applySelfSignups();
  render();
}
applySelfSignups(); render();
loadAll();
/* ---- Coach sign-in (email link) ---- */
let checking = false;
async function checkCoach(session){
  if (!SB) return;
  if (session === undefined) { try { const r = await withTimeout(SB.auth.getSession(), 8000); session = r.data.session; } catch(e) { session = null; } }
  coachEmail = session && session.user ? (session.user.email||"").toLowerCase() : "";
  if (!coachEmail) { canPost = false; render(); return; }
  let data = null, error = null;
  try { ({data, error} = await withTimeout(SB.from("coaches").select("email").eq("email", coachEmail).maybeSingle(), 10000)); } catch(e) { error = e; }
  canPost = !!data && !error;
  // Just came back from a sign-in link: go straight to the Coaches tab
  if (AUTH_RETURN && !checking) { checking = true; if (!/^#(coaches|post)$/.test(location.hash)) location.hash = "#coaches"; }
  render();
}
async function sendLogin(){
  const email = (document.getElementById("lg-email")||{}).value || "";
  if (!/.+@.+\..+/.test(email.trim())) { login.msg = "Enter your email address."; render(); return; }
  login.email = email.trim();
  const {error} = await SB.auth.signInWithOtp({email: login.email, options:{emailRedirectTo: location.origin + location.pathname}});
  if (error) { login.msg = authMsg(error); render(); return; }
  login.sent = true; login.msg = ""; render();
}
function authMsg(error){
  const m = String((error && error.message) || "").toLowerCase();
  if (m.includes("rate limit") || (error && error.status===429)) return "Too many sign-in emails were sent in the last hour. Wait a bit, or use your password instead.";
  if (m.includes("invalid login") || m.includes("invalid credentials")) return "That email and password don't match. First time here? Use \"First time? Set a password.\"";
  if (m.includes("already registered") || m.includes("already been registered")) return "That email already has a password. Sign in instead, or use an email link if you forgot it.";
  if (m.includes("email not confirmed")) return "This account still needs email confirmation. Ask Coach Witt to turn off \"Confirm email\" in Supabase, or use an email link.";
  if (m.includes("password") && (m.includes("short") || m.includes("least") || m.includes("weak"))) return "Pick a longer password: at least 8 characters.";
  if (m.includes("signups not allowed") || m.includes("signup is disabled")) return "New passwords are turned off in Supabase. Use an email link, or ask Coach Witt.";
  return "Sign-in didn't work: " + ((error && error.message) || "unknown error") + ".";
}
// Give any Supabase call a time limit so the page can never hang on it.
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label || "Supabase didn't answer. Check your connection and try again.")), ms))]);
// Wipe any saved sign-in on this device directly (no network call, can't hang).
function clearLocalSession(){
  try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch(e) {}
}
// One shared coaches account. The email isn't secret; the password is checked by Supabase, never stored in this page.
const COACH_ACCOUNT = (window.HUB_CONFIG && window.HUB_CONFIG.coachAccount) || "coaches@bctrackhub.com";
async function pwLogin(){
  const pw = (document.getElementById("lg-pw")||{}).value || "";
  if (!pw) { login.msg = "Enter the password."; render(); return; }
  if (login.busy) return;
  login.busy = true;
  const btn = document.querySelector('button[onclick="pwLogin()"]');
  if (btn) { btn.disabled = true; btn.textContent = "Signing in…"; }
  const msgEl = document.querySelector(".ed-msg");
  if (msgEl) msgEl.textContent = "";
  try {
    // Clear any half-finished old sign-in first so it can't block the new one
    clearLocalSession();
    try { await withTimeout(SB.auth.signOut({scope:"local"}), 3000); } catch(e) {}
    const res = await withTimeout(SB.auth.signInWithPassword({email: COACH_ACCOUNT, password: pw}), 15000, "Supabase didn't answer after 15 seconds. Check your connection and try again.");
    if (res.error) {
      const m = res.error.message || "";
      login.msg = /invalid/i.test(m) ? "Wrong password. Try again." : "Sign-in didn't work: " + m;
      return;
    }
    login.msg = "";
    try { await withTimeout(checkCoach(res.data.session), 10000); } catch(e) {}
    if (!canPost) login.msg = "Signed in, but " + COACH_ACCOUNT + " isn't on the coaches list in Supabase.";
    if (!/^#(coaches|post)$/.test(location.hash)) location.hash = "#coaches";
  } catch (e) {
    login.msg = "Sign-in didn't work: " + ((e && e.message) || e);
  } finally {
    login.busy = false;
    try { render(); } catch(e) { showErr("render after sign-in: " + (e.stack || e.message)); }
  }
}
async function signOut(){ clearLocalSession(); try { await withTimeout(SB.auth.signOut({scope:"local"}), 3000); } catch(e) {} canPost = false; coachEmail = ""; location.hash = "#hub"; render(); }
if (SB) {
  // Don't call Supabase inside this callback directly (it can stall); hand off with setTimeout.
  SB.auth.onAuthStateChange((event, session)=>{ setTimeout(()=>checkCoach(session), 0); });
  if (/error_description=/.test(AUTH_RETURN)) {
    login.msg = /expired|invalid/i.test(decodeURIComponent(AUTH_RETURN)) ? "That sign-in link expired or was already used. Send a new one." : "Sign-in didn't finish. Send a new link.";
    history.replaceState(null, "", location.pathname + "#coaches"); render();
  }
}
