<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC Track Hub</title>
<meta name="description" content="Benton Central Track & Field: schedule, workouts, athletes, records, and more.">
<meta name="theme-color" content="#1b4429">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky lane-stripe nav over one view at a time; hub = tile grid of sections, each view a lane-numbered sheet */
:root{
  --cold:#5b7fa6; --warm:#c8730a;
  --bg:#f4f5ee; --surface:#ffffff; --fg:#16211a; --muted:#5a685d; --line:#d7ddcf;
  --accent:#1e4d2f; --accent-ink:#ffffff; --gold:#e2ad12; --gold-soft:#fbf0c9;
  --brand:#1b4429; --on-brand:#ffffff; --gold-ink:#1d2a12;
  --track:#b5452f; --chip:#e8ecdf;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#17211a; --fg:#eaefe6; --muted:#9ba897; --line:#2a3829;
  --accent:#63bb7f; --accent-ink:#0b140d; --gold:#f2c230; --gold-soft:#2f2a12;
  --brand:#163a22; --on-brand:#ffffff; --gold-ink:#1d2a12;
  --track:#e0735c; --chip:#223024; --cold:#86a9cf; --warm:#f0a040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#17211a; --fg:#eaefe6; --muted:#9ba897; --line:#2a3829;
  --accent:#63bb7f; --accent-ink:#0b140d; --gold:#f2c230; --gold-soft:#2f2a12;
  --brand:#163a22; --on-brand:#ffffff; --gold-ink:#1d2a12;
  --track:#e0735c; --chip:#223024; --cold:#86a9cf; --warm:#f0a040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--gold);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/8 - 2px),rgba(255,255,255,.12) calc(100%/8 - 2px) calc(100%/8))}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-decoration:none;color:var(--gold);text-transform:uppercase;line-height:1}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;display:block;color:var(--on-brand);opacity:.85}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{color:inherit;text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:4px;opacity:.85}
nav.tabs a[aria-current="page"]{background:var(--gold);color:var(--gold-ink);opacity:1}
nav.tabs a:hover{opacity:1}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(34px,6vw,52px);font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.stack{display:grid;gap:24px}
.sample{display:inline-block;color:var(--fg);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-soft);color:var(--fg);border:1px dashed var(--gold);padding:2px 8px;border-radius:3px}
.backlink{font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;gap:6px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.mono,td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Hub */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.nextmeet{background:var(--brand);color:var(--on-brand);border-top:4px solid var(--gold);border-radius:6px;padding:20px;display:grid;gap:6px;position:relative;overflow:hidden}
.nextmeet .count{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;color:var(--gold);margin:6px 0 4px}
.nextmeet .count span{font-size:18px;color:var(--on-brand);margin-left:8px;opacity:.8}
.nm-eye{color:inherit;opacity:.7}
.nm-name{font-size:30px}
.nm-facts{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;margin:6px 0 4px;font-size:15px;position:relative;max-width:calc(100% - 70px)}
.nm-facts dt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.6;padding-top:3px}
.nm-facts dd{margin:0}
.nm-link{color:var(--gold);font-weight:600;margin-top:4px;position:relative}
.nextmeet .lanes{position:absolute;right:-10px;top:0;bottom:0;width:90px;background:repeating-linear-gradient(90deg,var(--track) 0 18px,transparent 18px 22px);opacity:.25}
.week ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.week li{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:15px}
.week li b{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:13px;padding-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold);transform:translateY(-2px)}
.tile .lane{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--gold-ink);background:var(--gold);border-radius:4px;min-width:40px;height:40px;display:grid;place-items:center}
.tile h3{font-size:20px}
.tile p{margin:0;color:var(--muted);font-size:14px}
/* toggles */
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto}
.seg button{font:600 14px var(--body);padding:7px 14px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td a{font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--chip);border-radius:3px;padding:1px 7px;margin:1px 2px 1px 0;white-space:nowrap}
.chip.home{background:var(--accent);color:var(--accent-ink)}
.chip.past{opacity:.55}
.lvl{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track)}
/* roster cards */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ath{display:grid;gap:4px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:5px;padding:12px 14px}
.ath:hover{border-color:var(--accent)}
.ath strong{font-size:17px}
.ath span{font-size:13px;color:var(--muted)}
.su-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.su-stat{padding:14px 16px;display:grid;gap:2px}.su-stat b{font:800 28px var(--display);line-height:1}.su-stat span{font-size:13px;color:var(--muted)}
.su-stat.gold{border-color:var(--gold);background:var(--gold-soft)}
.su-list{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.su-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.su-row:first-child{border-top:0}.su-row.su-out{opacity:.62}
.su-who{min-width:0;display:grid}.su-who a{color:var(--fg);text-decoration:none}.su-who small{color:var(--muted);font-size:12px}
.su-tag{font-size:12px;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap;background:var(--chip)}
.su-tag.su-new{background:var(--gold);color:var(--gold-ink)}.su-tag.su-rec{background:var(--accent);color:var(--accent-ink)}
.su-tag.su-xc{background:var(--gold-soft);border:1px solid var(--gold)}
.su-boxes{display:flex;gap:12px}
.su-box{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.su-box input{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer}
.new-chip{background:var(--gold);color:var(--gold-ink);justify-self:start}
@media (max-width:620px){.su-row{grid-template-columns:minmax(0,1fr) auto}.su-boxes{grid-column:1/-1}}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:600 14px var(--body);display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);cursor:pointer}
.filters button span{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.athtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvlchip{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.weekpick button:disabled{opacity:.35;cursor:default}
.shared{margin-bottom:10px}
.lvsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.lvsplit{grid-template-columns:1fr}}
.lvcol{background:var(--bg);border-radius:5px;padding:10px 12px;min-width:0}
.lvcol ul{margin:4px 0 0}
.lvcol.off{opacity:.6}
.lvhead{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--track);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted);font-size:14px;margin:4px 0 0;list-style:none}
.evlist{display:grid;gap:8px;min-width:0}
.evblock{display:grid;grid-template-columns:120px 1fr;gap:12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.evblock:last-child{border-bottom:0;padding-bottom:0}
.evblock ul{margin:0}
.evname{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:2px}
@media (max-width:600px){.evblock{grid-template-columns:1fr;gap:2px}}
.lvsplit{margin-top:6px}
.anetrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.anet{display:inline-flex;gap:6px;align-items:center;font-size:14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px}
.anet b{color:var(--accent)}
.anet:hover{border-color:var(--accent)}
.search{font:15px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 180px;max-width:260px}
.cov{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;font-family:var(--mono);font-size:12px;font-weight:500}
.cov.ok{background:var(--accent);color:var(--accent-ink)}
.cov.thin{background:var(--gold);color:var(--gold-ink)}
.cov.gap{background:var(--track);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend>span{display:inline-flex;gap:6px;align-items:center}
.rec-hit td{background:var(--gold-soft)}
.chip.gold{background:var(--gold);color:var(--gold-ink)}
.staff .open{border-style:dashed;background:transparent}
.staff .open h3{color:var(--muted)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.exp{margin:10px 0 0;padding-left:18px;display:grid;gap:6px}
.btn{font:600 14px var(--body);padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--track);border-color:var(--track);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.ed{display:grid;gap:16px}
.ed-help{font-size:15px;line-height:1.55}
.ed-help code{font-family:var(--mono);font-size:13px;background:var(--chip);padding:1px 5px;border-radius:3px}
.ed-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;max-width:520px}
.ed-row span,.ed-g span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ed input[type=text],.ed input[type=date],.ed input[type=password],.ed input[type=email],.ed textarea{font:15px var(--body);width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);min-width:0}
.ed textarea{resize:vertical;line-height:1.4}
.ed-day{border-top:2px solid var(--line);padding-top:14px;display:grid;gap:10px}
.ed-dayhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ed-dayhead h3{font-size:24px}
.ed-dayhead .btn{margin-left:auto}
.ed-check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.ed-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.ed-grid2{grid-template-columns:1fr}.ed-row{grid-template-columns:1fr;gap:4px}}
.ed-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ed-g{display:grid;gap:4px;min-width:0}
.ed-g.all{grid-column:1/-1}
.ed-g.all span{color:var(--accent)}
.ed-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.ed-save{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:14px}
.ed-msg{font-size:14px}
.ed-msg.ok{color:var(--accent);font-weight:600}
.ed-msg.err{color:var(--track);font-weight:600}
.ed-acts{white-space:nowrap;display:flex;gap:6px}
.ed select{font:15px var(--body);width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);min-width:0}
.ed-fe{display:grid;gap:6px}
.reps{display:grid;gap:6px}
.rep,.rephead{display:grid;grid-template-columns:24px minmax(70px,1fr) 70px minmax(80px,1.2fr) 36px;gap:6px;align-items:center}
.rep.fa,.rephead.fa{grid-template-columns:24px minmax(60px,1fr) minmax(60px,1fr) 44px 36px}
.rephead span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.repn{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.ed input[type=number]{font:15px var(--mono);width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);min-width:0}
.rep input[type=text]{font-family:var(--mono)}
.rep input[type=checkbox]{width:20px;height:20px;justify-self:center}
.rep .btn{padding:4px 0}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rstat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:2px}
.rstat b{font-family:var(--display);font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rstat span{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toprec{margin:10px 0 0;padding-left:22px;display:grid;gap:6px 20px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.toprec li span{display:block;font-size:13px;color:var(--muted)}
.heat{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px}
.heat .bars{display:inline-flex;gap:2px}
.heat i{width:7px;height:16px;border-radius:2px;background:var(--line)}
.heat b{font-weight:600}
.h-cold i.on{background:var(--cold)} .h-cold b{color:var(--cold)}
.h-cool i.on{background:var(--cold);opacity:.55}
.h-warming i.on{background:var(--gold)}
.h-warm i.on{background:var(--warm)}
.h-hot i.on{background:var(--track)} .h-hot b{color:var(--track)}
.h-joined i.on{background:var(--accent)} .h-joined b{color:var(--accent)}
.h-none b,.h-closed b{color:var(--muted);font-weight:500}
.resp{font-weight:600}
.r-yes{color:var(--accent)} .r-no{color:var(--track)} .r-maybe{color:var(--warm)}
.rtable tr.dim{opacity:.5}
.ed .seg{flex-wrap:wrap}
.me{display:grid;gap:6px}
.talk{display:grid;gap:14px;border:2px solid var(--gold)}
.slider{display:grid;gap:6px;max-width:520px}
.slider label{font-weight:600}
.slider input[type=range]{width:100%;accent-color:var(--track);height:28px}
.slider-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tk-val{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase}
.sc-cold{color:var(--cold)} .sc-cool{color:var(--cold)} .sc-warming{color:var(--warm)} .sc-warm{color:var(--warm)} .sc-hot{color:var(--track)}
.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
a.btn{text-decoration:none;display:inline-block}
.asg{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.asg{grid-template-columns:1fr}}
.asg-pool{display:grid;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:760px){.asg-pool{position:static;max-height:300px}}
.asg-pool select{font:14px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
.asg-list{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;gap:6px;align-items:baseline;font:600 13px var(--body);padding:5px 9px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px;background:var(--surface);color:var(--fg);cursor:grab}
.pchip small{font-family:var(--mono);font-weight:400;color:var(--muted)}
.pchip.full{opacity:.5;cursor:not-allowed;border-left-color:var(--line)}
.asg-sec{display:grid;gap:6px}
.asg-sec h4{margin:4px 0 0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.asg-sec h4 span{font-family:var(--mono)}
.asg-sec.bad h4{color:var(--track)} .asg-sec.new h4{color:var(--accent)}
.pchip.over{border-color:var(--track);border-left-color:var(--track);background:color-mix(in srgb,var(--track) 12%,var(--surface));opacity:1;cursor:grab}
.pchip.over small{color:var(--track);font-weight:600}
.pchip.fresh{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.achip.over{background:color-mix(in srgb,var(--track) 18%,var(--surface));box-shadow:inset 3px 0 0 var(--track)}
.pchip.sel{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.pchip.sel small{color:var(--gold-ink)}

    {t:"Belly breathing", how:"Hand on your stomach. Breathe in slowly so your belly rises, not your shoulders. Breathe out longer than you breathed in.", when:"Before bed the night before a meet, or during a cool-down."},
  ],
  meditate:{
    what:"Meditation is just practicing paying attention. You sit, focus on your breath, and when your mind wanders (it will), you gently bring it back. That's the whole thing.",
    steps:["Sit or lie down somewhere quiet. Set a timer for 3 to 5 minutes.","Close your eyes and notice your breath going in and out.","When your mind drifts to a test, a race, or your phone, notice it and come back to the breath.","That 'coming back' is the rep. It trains you to refocus mid-race."],
    tip:"A few minutes most days beats one long session once a week. Free apps like Insight Timer or a YouTube guided meditation work fine.",
  },
  visual:{
    what:"Your brain fires a lot of the same signals when you vividly imagine a race as when you run it. Athletes at every level use visualization to rehearse races before they happen.",
    steps:[["See it from your own eyes","Not like watching TV. Picture it from where you'd actually be standing."],["Use every sense","The noise of the crowd, the feel of the blocks, your breathing, the bend of the pole, the weight of the shot."],["Run the whole thing","Warm-up, the line, the gun, the middle, the finish. Hit your splits in your head."],["Rehearse the hard part","Picture getting boxed in, a bad first attempt, or the last 200 hurting, and see yourself handling it."],["Finish strong","See yourself crossing the line or nailing the mark, and feel how good it is."]],
    events:[["Sprinters","Rehearse the set position, the gun, and driving out low."],["Distance","Picture your pace, where you'll make your move, and staying tough when it hurts."],["Jumpers","Walk through your approach, hitting the board, and the takeoff."],["Throwers","Feel the full rhythm of the turn or glide and the release."]],
  },
  tools:[
    ["Cue words","Pick 1 to 3 words for your event: \"Push, drive, tall,\" \"Smooth and strong,\" \"Hips first.\" Say them in your head when it counts."],
    ["Nerves are fuel","A pounding heart and butterflies mean your body is getting ready to go fast. Call it excited, not scared."],
    ["Control the controllables","You can't control the weather, the heat sheets, or other runners. You can control your warm-up, your effort, and your attitude."],
    ["Have a routine","Same warm-up, same cue words, same breaths before every race. Routine makes big meets feel normal."],
    ["Short memory","Bad race? Take 10 minutes to be upset, find one thing to learn, then let it go. The next event doesn't care about the last one."],
  ],
  // Representing BC
  motto:{h:"Be a Nightmare, Not a Dreamer", src:"Inspired by Jon Gruden's \"nightmares\" speech to the Raiders on HBO's Hard Knocks (2019): \"I'm really not into dreams anymore.\" He wanted nightmares.", p:"Dreamers wish they were faster. Nightmares put in the work every day, show up when it's cold and hard, and are the athlete nobody wants to line up next to. That grit is what this program is built on."},
  line:{h:"Friendly until the line", p:"Be the nicest person at the meet. Shake hands, learn names, wish people luck. Then when you step to the line, it's all business, and you compete with everything you have. After the finish, you're friendly again: congratulate the people around you, win or lose."},
  model:[
    ["Little kids are watching","Elementary and junior high kids watch how you act at meets. You are what they think a Bison athlete looks like."],
    ["Cheer for everyone","The last runner in the 3200 deserves the loudest cheer. Cheer for teammates in every event, not just your own."],
    ["Respect the people who run the meet","Thank the officials, timers, and volunteers. Listen to the starter. No arguing calls; tell a coach."],
    ["Leave it better","Clean up camp, pick up trash, and help carry gear. Every meet, every time."],
    ["Online counts too","What you post is part of the team's name. Nothing negative about opponents, officials, or teammates."],
    ["In the classroom","Eligibility, effort, and respect at school are part of being on this team."],
  ],
  positive:{
    p:"Positive energy spreads. One teammate cheering at the turn, one coach saying \"you've got this,\" one smile on the line, and the whole team starts racing looser and faster. Negative energy spreads just as fast. Choose which one you bring.",
    habits:["Say something encouraging to a teammate before every race.","High-five everyone after their event, good day or bad.","Talk about what went right before what went wrong.","Be the loudest one at the finish line for your team."],
  },
};

  const c = e && e.code;

    if (error) throw {code: error.code==="42501" ? "denied" : error.code==="PGRST301" ? "signin" : "other"};

    const {data, error} = await SB.from("hub_data").insert({key, value, updated_at:now, updated_by:coachEmail}).select("updated_at");
    if (error) { if (error.code==="23505") { await loadAll(); throw {code:"conflict"}; } throw {code: error.code==="42501" ? "denied" : "other"}; }

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","||c==="\t"){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

const RELAY_PROXY = {"4x100":["100","200","100H","110H"], "4x400":["400","400 split","200","300H","800","100"], "4x800":["800","1600"]};
function rankMark(a, ev){ const ks = RELAY_PROXY[ev]||[ev]; for(let i=0;i<ks.length;i++){ const k=ks[i]; if(a.prs[k]) return {k, mk:a.prs[k], tier: (k==="400 split"?0:i)}; } return null; }

/* ---- Hub: fires to put out ---- */
function coverageGaps(){
  const out = [];
  ["HS","JH"].forEach(lv=>["B","G"].forEach(g=>{
    const team = lv+"-"+g;
    const useA = Object.values(ASSIGN[team]||{}).some(x=>x.length);
    const evs = useA ? teamEvents(team) : COVER_EVENTS[lv][g];
    const gaps = evs.map(ev=>{
      const n = useA ? (((ASSIGN[team]||{})[ev])||[]).length : ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[ev]).length;
      return {ev, n};
    }).filter(x=>x.n<2).sort((a,b)=>a.n-b.n);
    out.push({lv, g, team, gaps, useA});
  }));
  return out;
}
function hotRecruits(n){
  return REC.list.filter(r=>r.status==="open").map(r=>({r, h:heat(r), cs:REC.contacts.filter(c=>c.rid===r.id)}))
    .filter(x=>x.cs.length && x.h.score>0).sort((a,b)=>b.h.score-a.h.score || b.cs.length-a.cs.length).slice(0,n);
}
function recordWatch(n){
  const out = [];
  ["HS","JH"].forEach(lv=>["B","G"].forEach(g=>{
    (RECORDS[lv+"-"+g]||[]).forEach(r=>{
      if(!r.key) return;
      const rv = markVal(r.key, r.mk); if(!isFinite(rv)) return;
      ATHLETES.filter(a=>a.level===lv && a.g===g && a.prs[r.key] && !(lv==="HS" && a.grade===9) && !String(r.who).includes(a.name)).forEach(a=>{
        const av = markVal(r.key, a.prs[r.key]); if(!isFinite(av)) return;
        const field = FIELD.has(r.key);
        const gap = field ? rv-av : av-rv;          // >0 means still short of the record
        const pct = gap / rv;
        if(pct <= (field?0.10:0.06)) out.push({a, r, lv, g, gap, pct, field});
      });
    });
  }));
  return out.sort((x,y)=>x.pct-y.pct).slice(0,n);
}

};

/* ---- Training paces (VDOT, Daniels/Gilbert formulas) ---- */
const PACE_SRC = [["1600",1600],["3200",3200],["XC 5K",5000],["XC 3K",3000]];  // 800 only if nothing else
const vdotOf = (m, sec) => { const t = sec/60, v = m/t; const vo2 = -4.60 + 0.182258*v + 0.000104*v*v;
  const pct = 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t); return vo2/pct; };
const vAt = V => (-0.182258 + Math.sqrt(0.182258**2 - 4*0.000104*(-4.60 - V))) / (2*0.000104);  // m/min
const paceFor = (V, frac, dist) => dist / vAt(V*frac) * 60;  // seconds
const mmss = s => { s = Math.round(s); const m = Math.floor(s/60), r = s - m*60; return m ? `${m}:${String(r).padStart(2,"0")}` : `${r}`; };
function athleteVdot(a){
  let best = null;
  const tryKey = (k, m) => { const mk = a.prs[k]; if(!mk) return; const sec = tSec(String(mk).replace(/[hc]$/,"")); if(!isFinite(sec)) return;
    const V = vdotOf(m, sec); if(!best || V > best.V) best = {V, k, mk, m}; };
  PACE_SRC.forEach(([k,m])=>tryKey(k,m));
  if(!best) tryKey("800", 800);
  return best;
}
function paceSet(V){
  return {
    easy: [mmss(paceFor(V,0.70,1609)), mmss(paceFor(V,0.62,1609))],
    tempo: mmss(paceFor(V,0.88,1609)), tempo400: mmss(paceFor(V,0.88,400)),
    int400: mmss(paceFor(V,0.98,400)), int800: mmss(paceFor(V,0.98,800)), int1k: mmss(paceFor(V,0.98,1000)),
    rep200: mmss(paceFor(V,1.06,200)), rep400: mmss(paceFor(V,1.06,400)),
  };
}
const paceAthletes = () => ATHLETES.filter(a=>a.cats.includes("Distance")||a.cats.includes("Mid Distance")).map(a=>({a, b:athleteVdot(a)})).filter(x=>x.b);

/* ---- Mark rankings ---- */
// HS vs JH comparison only where the event is the same: flat races and jumps.
// Hurdles (heights and spacing), shot and discus (implement weights) and XC (3K vs 5K) differ, so they're skipped.
const CROSS_OK = new Set(["100","200","400","800","1600","HJ","LJ"]);
function rankIn(pool, key, mk){
  const v = markVal(key, mk); if(!isFinite(v)) return null;
  const vals = pool.map(x=>markVal(key, x.prs[key])).filter(isFinite);
  const ahead = vals.filter(x => FIELD.has(key) ? x > v : x < v).length;
  return {r: ahead+1, n: vals.length};
}
function markRank(a, key){
  if(!a.prs[key] || key==="400 split") return null;
  const own = ATHLETES.filter(x=>x.level===a.level && x.g===a.g && x.prs[key]);
  const mine = rankIn(own, key, a.prs[key]);
  // JH athlete in the top 3 of everyone (HS + JH, same gender) in that event
  let hs = null;
  if(a.level==="JH" && CROSS_OK.has(key)){
    const all = ATHLETES.filter(x=>x.g===a.g && x.prs[key]);
    const r = rankIn(all, key, a.prs[key]);
    if(r && r.r <= 3) hs = r;
  }
  return {...mine, hs};
}
function bestRank(a){
  let best = null, bestHs = null;
  Object.keys(a.prs).forEach(k=>{ const m = markRank(a,k); if(!m) return;
    const score = m.r / Math.max(m.n,1);
    if(!best || m.r < best.r || (m.r===best.r && score < best.score)) best = {...m, k, score};
    if(m.hs && (!bestHs || m.hs.r < bestHs.r)) bestHs = {...m.hs, k}; });
  return {best, bestHs};
}

const tSec = t => { t=String(t||"").trim(); if(!t) return NaN; return t.split(":").reduce((a,x)=>a*60+parseFloat(x),0); };
const tFmt = sec => { if(!isFinite(sec)) return ""; const m=Math.floor(sec/60), r=sec-m*60; return m ? `${m}:${r.toFixed(1).padStart(4,"0")}` : r.toFixed(1); };
const ftin = a => `${a.ft||0}' ${a.inch||0}"`;

function splitsText(l){
  if(l.kind==="run" && l.reps){
    const groups = [];
    l.reps.forEach(r=>{ const k = r.dist+(r.unit==="mi"?" mi":"m"); let g = groups.find(x=>x.k===k); if(!g){ g={k,t:[]}; groups.push(g); } g.t.push(r.time); });
    return groups.map(g=>{ const secs=g.t.map(tSec).filter(isFinite); const avg = secs.length>1 ? ` (avg ${tFmt(secs.reduce((a,b)=>a+b,0)/secs.length)})` : "";
      return `${g.k}: ${g.t.join(", ")}${avg}`; }).join(" · ");
  }
  if(l.kind==="lift" && l.lifts){
    return l.lifts.map(x=>`${x.ex} ${x.sets}×${x.reps}${x.wt?` @ ${x.wt} lb`:""}`).join(" · ");
  }
  if(l.kind==="field" && l.att){
    const ok = l.att.filter(a=>!a.x); const best = ok.length ? ok.reduce((b,a)=>attIn(a)>attIn(b)?a:b) : null;
    return `${evn(l.ev)}: ${l.att.map(a=>a.x?(["HJ","PV"].includes(l.ev)?"X":"Foul"):ftin(a)).join(", ")}${best?` (best ${ftin(best)})`:""}`;
  }
  return l.s || "";
}

    if(!lifts.length){ dlMsg={kind:"err",text:"Enter at least one exercise."}; render(); return; }
    if(lifts.some(x=>!x.sets||!x.reps)){ dlMsg={kind:"err",text:"Each exercise needs sets and reps. Weight is optional."}; render(); return; }
    e.lifts = lifts;
    e.w = wf.w.trim() || "Weight room";
  } else {
    const att = wf.att.filter(x=>x.x || x.ft!=="" || x.inch!=="").map(x=>({ft:x.x?"":String(x.ft||0), inch:x.x?"":String(x.inch||0), x:!!x.x}));
    if(!att.length){ dlMsg={kind:"err",text:"Enter at least one attempt in feet and inches."}; render(); return; }
    if(att.some(x=>!x.x && (+x.inch>=12 || +x.inch<0 || +x.ft<0))){ dlMsg={kind:"err",text:"Inches should be between 0 and 11.75."}; render(); return; }
    e.ev = wf.ev; e.att = att;
    e.w = wf.w.trim() || `${evn(wf.ev)} · ${att.length} attempts`;
  }
  const next = logsCopy(); ensure(next,a.id).log.push(e);
  next[a.id].log.sort((x,y)=>(x.iso||"").localeCompare(y.iso||""));
  if(await saveLogs(next, `Workout added for ${a.name}.`)){ const keep = wf.kind, ev = wf.ev; wfReset(); wf.kind = keep; wf.ev = ev; render(); }
}

  _asgEdit(){

      .sort((a,b)=>a.name.localeCompare(b.name));

    const rest = pool.filter(a=>!over.includes(a) && !fresh.includes(a));
    const selA = ATHLETES.find(a=>a.id===asg.sel);

          ${(()=>{ const chip = a => { const n = asgCount(asg.team, a.id); return `<button type="button" class="pchip ${asg.sel===a.id?"sel":""} ${n>MAX_EVENTS?"over":n>=MAX_EVENTS?"full":""} ${!trackEvs(a).length&&!n?"fresh":""}" draggable="${n<MAX_EVENTS}"

              onclick="${n>=MAX_EVENTS?`asg.msg={kind:'err',text:'${esc(a.name).replace(/'/g,"\\'")} already has ${MAX_EVENTS} events.'};render()`:`asg.sel=asg.sel==='${a.id}'?null:'${a.id}';render()`}">
              <span>${esc(a.name)}</span><small>${a.grade??""} · ${n}/${MAX_EVENTS}</small></button>`; };
            const sec = (cls, title, arr) => arr.length ? `<div class="asg-sec ${cls}"><h4>${title} <span>${arr.length}</span></h4><div class="asg-list">${arr.map(chip).join("")}</div></div>` : "";

  coverage(){

      <div class="legend">${["none","cold","cool","warming","warm","hot","joined"].map(k=>meter({k,l:HEAT_NAMES[k],lvl:{none:0,cold:1,cool:2,warming:3,warm:4,hot:5,joined:5}[k]})).join("")}</div>

        ${rows.map(({r,h,cs})=>{ const last = cs[cs.length-1]; const by = [...new Set(cs.map(c=>c.by))];
          return `<tr class="${r.status==="closed"?"dim":""}"><td><b>${esc(r.name)}</b><div class="muted">${r.lvl} ${r.g==="B"?"Boys":"Girls"}${recGr(r)?" · "+recGr(r):""}${r.sport&&r.sport!=="Other"?" · "+esc(r.sport):""}</div></td>

            <td>${last?`${esc(last.by)} · ${scaleTag(last)}<div class="muted">${shortD(last.d)}</div>`:"—"}</td>
            <td>${r.status==="open"?form(r):""}</td></tr>`; }).join("")}

  },
  _talk(){
    const r = REC.list.find(x=>x.id===talk.rid); if(!r) return "";
    const sc = SCALE[talk.heat];
    return `<div class="panel talk" id="tk-panel"><div class="bar"><h2>You talked to ${esc(r.name)}</h2><button type="button" class="btn sm" onclick="talk=null;render()">Close</button></div>
      <label class="ed-row" for="tk-by"><span>Your name</span><input id="tk-by" type="text" list="tk-people" value="${esc(talk.by)}" placeholder="Your name" oninput="talk.by=this.value;document.getElementById('tk-go').toggleAttribute('aria-disabled',!this.value.trim())"></label>
      <datalist id="tk-people">${[...STAFF.filter(c=>c.name).map(c=>c.name), ...ATHLETES.map(a=>a.name)].map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
      <div class="slider"><label for="tk-heat">How likely are they to come out?</label>
        <input id="tk-heat" type="range" min="1" max="5" step="1" value="${talk.heat}" oninput="talk.heat=+this.value;document.getElementById('tk-val').textContent=SCALE[talk.heat].l+' ('+talk.heat+'/5)';document.getElementById('tk-val').className='tk-val sc-'+SCALE[talk.heat].k">
        <div class="slider-ends"><span>Cold</span><span>Cool</span><span>Maybe</span><span>Warm</span><span>Hot</span></div>

      ${RECRUIT_FORM ? `<div class="ed-save"><a id="tk-go" class="btn primary" href="#" onclick="if(!talk.by.trim()){return false;}this.href=talkLink();" target="_blank" rel="noopener" ${talk.by.trim()?"":"aria-disabled=\"true\""}>Send it ↗</a>
          <span class="note" style="margin:0">Opens a quick form with everything filled in. Hit Submit there.</span></div>`
        : `<div class="ed-save"><button id="tk-go" type="button" class="btn primary" onclick="if(talk.by.trim())talkCopy()">Copy message</button>
          <span class="note" style="margin:0">Then share it with any coach.</span></div>
          ${talk.sent==="copied"?`<p class="ed-msg ok" style="margin:0">Copied. Share it with any coach.</p>`:talk.sent==="select"?`<p class="note" style="margin:0">Copy this and share it with any coach:</p><input type="text" readonly value="${esc(talkText())}" onfocus="this.select()" aria-label="Message to copy">`:""}`}
    </div>`;
  },
  form(){
    const f = FORM.find(x=>x.id===ftab) || FORM[0];
    return `${back}<div class="stack"><div><div class="eyebrow">Technique</div><h1>Form</h1>
        <p class="lede">Pick your event. Each one has the steps in order, short cues to think about, common mistakes and fixes, and drills.</p></div>
      <div class="filters" role="group" aria-label="Event">${FORM.map(x=>`<button type="button" aria-pressed="${x.id===f.id}" onclick="ftab='${x.id}';render()">${esc(x.ev)}</button>`).join("")}</div>
      <div class="form-top"><h2>${esc(f.ev)}</h2>${f.safety?`<div class="panel form-safety"><b>Safety first.</b> ${esc(f.safety)}</div>`:""}</div>
      <div class="form-grid">
        <div class="panel"><h3>Step by step</h3><ol class="form-steps">${f.phases.map(ph=>`<li><b>${esc(ph.h)}</b><span>${esc(ph.p)}</span></li>`).join("")}</ol></div>
        <div class="stack" style="gap:12px">
          <div class="panel form-cues"><h3>Cues</h3><ul>${f.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
          <div class="panel"><h3>Drills</h3><ol class="steps">${f.drills.map(d=>`<li><span>${itemHTML(d)}</span><em>${esc(d.d||"")}</em></li>`).join("")}</ol></div>
        </div>
      </div>
      ${f.legs?`<div class="panel"><h3>4x100 leg chart</h3><div class="tbl" style="border:0"><table><thead><tr><th>Leg</th><th>Part of the track</th><th>Carry in</th><th>Run on</th><th>The pass</th></tr></thead><tbody>
        ${f.legs.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td><span class="chip ${r[2]==="Right"?"gold":"on"}">${esc(r[2])} hand</span></td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join("")}</tbody></table></div></div>`:""}

        ${f.fixes.map(([m,fx])=>`<tr><td>${esc(m)}</td><td>${esc(fx)}</td></tr>`).join("")}</tbody></table></div></div>
      <p class="note">More drills for each event are in <a href="#warmups">Warm-ups &amp; Care</a> and in each week's workouts.</p></div>`;
  },
  paces(){
    let rows = paceAthletes().filter(x=>(level==="All"||x.a.level===level) && (ag==="All"||x.a.g===ag));
    if(pq) rows = rows.filter(x=>x.a.name.toLowerCase().includes(pq.toLowerCase()));
    rows.sort((x,y)=>y.b.V-x.b.V);
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">VDOT training paces</div><h1>Paces</h1></div>
        <div class="bar">${segBtns(level,[["HS","HS"],["JH","JH"]],"(v=>{level=v;render()})")}${segBtns(ag,[["All","All"],["B","Boys"],["G","Girls"]],"(v=>setA('g',v))")}</div></div>
      <p class="lede" style="margin:0">Paces come from each runner's best race (mile, 3200, or this fall's XC). Find your name, then use these for <b>easy</b>, <b>tempo</b>, <b>interval</b>, and <b>rep</b> days.</p>
      <input id="psearch" class="search" type="search" placeholder="Search name" value="${esc(pq)}" oninput="pq=this.value;render();const e=document.getElementById('psearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
      <div class="tbl"><table class="ptable"><thead><tr><th>Athlete</th><th>Based on</th><th>VDOT</th><th>Easy /mi</th><th>Tempo /mi</th><th>Tempo /400</th><th>Interval /400</th><th>Interval /800</th><th>Rep /200</th><th>Rep /400</th></tr></thead><tbody>
        ${rows.map(({a,b})=>{ const p = paceSet(b.V); return `<tr><td><a href="#a-${a.id}"><b>${esc(a.name)}</b></a><div class="muted">${a.g==="B"?"Boys":"Girls"} · ${a.grade??"—"}</div></td>
          <td>${esc(evn(b.k))} ${esc(b.mk)}</td><td class="mono"><b>${b.V.toFixed(1)}</b></td>
          <td class="mono">${p.easy[0]}–${p.easy[1]}</td><td class="mono">${p.tempo}</td><td class="mono">${p.tempo400}</td>
          <td class="mono">${p.int400}</td><td class="mono">${p.int800}</td><td class="mono">${p.rep200}</td><td class="mono">${p.rep400}</td></tr>`; }).join("") || `<tr><td colspan="10" class="muted">No runners match.</td></tr>`}
      </tbody></table></div>
      <div class="cols">
        <div class="panel"><h3>What each pace is for</h3><dl class="inj-dl">
          <dt>Easy</dt><dd>Recovery runs and long runs. Conversational. Slower is fine.</dd>
          <dt>Tempo</dt><dd>Comfortably hard, about 20 minutes of steady effort. Tempo runs and cruise intervals.</dd>
          <dt>Interval</dt><dd>Hard. 400s to 1000s with jog recovery about as long as the rep.</dd>
          <dt>Rep</dt><dd>Fast and smooth. 200s and 400s with full recovery. Speed and form.</dd></dl></div>
        <div class="panel"><h3>About these numbers</h3><ul class="exp">
          <li>Calculated with Jack Daniels' VDOT formulas from the race shown.</li>
          <li>XC courses vary, so XC-based paces can run a little slow. A new track race updates them.</li>
          <li>800-only runners are rated off the 800, which can make distance paces too fast. Ease into them.</li>
          <li>Heat, wind, and a bad night of sleep all count. Effort matters more than hitting the exact number.</li></ul></div>
      </div></div>`;
  },
  mindset(){
    const M = MIND;
    const tabs = [["mental","The Mental Game"],["bc","Representing BC"]];
    const head = `${back}<div class="stack"><div><div class="eyebrow">Mindset</div><h1>${mtab==="bc"?"Representing BC":"The Mental Game"}</h1></div>
      <div class="seg" role="group" aria-label="Section">${tabs.map(([k,l])=>`<button type="button" aria-pressed="${mtab===k}" onclick="mtab='${k}';render()">${l}</button>`).join("")}</div>`;
    let body;
    if (mtab==="bc") {
      body = `<div class="motto"><div class="eyebrow">Who we are</div><h2>${esc(M.motto.h)}</h2><p>${esc(M.motto.p)}</p>${M.motto.src?`<p class="motto-src">${esc(M.motto.src)}</p>`:""}</div>

      body = `<p class="lede" style="margin:0">${esc(M.why)}</p>
        <div><h2 style="margin-bottom:4px">Breathing</h2><p class="note" style="margin:0 0 10px">Slow breathing tells your body to calm down. Practice at home so it works on race day.</p>
          <div class="muscles">${M.breath.map(b=>`<div class="panel"><h3>${esc(b.t)}</h3><dl class="inj-dl"><dt>How</dt><dd>${esc(b.how)}</dd><dt>When</dt><dd>${esc(b.when)}</dd></dl></div>`).join("")}</div></div>
        <div class="panel"><h2>Meditation</h2><p style="margin:6px 0 0;max-width:68ch">${esc(M.meditate.what)}</p>
          <ol class="form-steps">${M.meditate.steps.map(x=>`<li><b></b><span>${esc(x)}</span></li>`).join("")}</ol>
          <p class="note" style="margin:10px 0 0">${esc(M.meditate.tip)}</p></div>
        <div class="panel"><h2>Visualization</h2><p style="margin:6px 0 0;max-width:68ch">${esc(M.visual.what)}</p>
          <ol class="form-steps">${M.visual.steps.map(([h,p])=>`<li><b>${esc(h)}</b><span>${esc(p)}</span></li>`).join("")}</ol>
          <div class="mlabel">By event</div><dl class="inj-dl">${M.visual.events.map(([h,p])=>`<dt>${esc(h)}</dt><dd>${esc(p)}</dd>`).join("")}</dl>
          <p class="note" style="margin:10px 0 0">Try 5 minutes the night before a meet, and a quick run-through right before your event.</p></div>
        <div><h2 style="margin-bottom:10px">Race-day tools</h2><div class="muscles">${M.tools.map(([h,p])=>`<div class="panel"><h3>${esc(h)}</h3><p style="margin:6px 0 0">${esc(p)}</p></div>`).join("")}</div></div>
        <div class="panel care-alert">Stress or anxiety that sticks around outside of meets is worth talking about. A coach, parent, or the school counselor can help.</div>`;
    }
    return head + body + `</div>`;
  },

        <div class="ffww"><div class="bar"><h3>${esc(FF_WW.t)}</h3><a class="btn sm primary" href="${FF_WW.url}" target="_blank" rel="noopener">Learn more and sign up ↗</a></div>
          <p style="margin:6px 0 0">${esc(FF_WW.what)}</p>
          <dl class="inj-dl">${FF_WW.facts.map(([h,p])=>`<dt>${esc(h)}</dt><dd>${esc(p)}</dd>`).join("")}</dl>
          <p class="note" style="margin:8px 0 0">${esc(FF_WW.why)}</p></div></div>
      <div><h2 style="margin-bottom:4px">Trainers: which kind?</h2><p class="note" style="margin:0 0 10px">The fitting tells you which type you need. Here's what the words mean. Browse online to get ideas, but buy after you've been fitted so the size and type are right.</p>
        <div class="muscles">${TRAINERS.map(x=>`<div class="panel shoecard"><h3>${esc(x.t)}</h3><dl class="inj-dl"><dt>Best for</dt><dd>${esc(x.for)}</dd><dt>Feels</dt><dd>${esc(x.feel)}</dd></dl>
          ${x.links?`<div class="shoe-links"><span class="mlabel" style="margin:0">Browse at Fleet Feet</span>${x.links.map(([l,u])=>`<a class="btn sm" href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>`:""}
          ${x.tip?`<p class="note" style="margin:8px 0 0">${esc(x.tip)}</p>`:""}</div>`).join("")}</div>
        <p class="note">Replace trainers about every 300 to 500 miles, or sooner if the cushion feels flat or your legs start aching on easy runs.</p></div>
      <div class="cols">
        <div class="panel"><h3>Why spikes help</h3><dl class="inj-dl">${SPIKES_WHY.map(([h,p])=>`<dt>${esc(h)}</dt><dd>${esc(p)}</dd>`).join("")}</dl></div>
        <div class="panel care-alert"><h3>Using spikes the right way</h3><ul class="exp">${SPIKES_CARE.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
      <div><h2 style="margin-bottom:10px">Shoes for your event</h2><div class="muscles">${G.shoes.map(x=>`<div class="panel"><h3>${esc(x.t)}</h3><div class="mlabel" style="margin-top:4px">${esc(x.who)}</div><p style="margin:6px 0 0">${esc(x.d)}</p>${x.url?`<p style="margin:10px 0 0"><a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.link)} ↗</a></p>`:""}</div>`).join("")}</div>
        <p class="note">New to track? Start with good trainers. You can borrow or buy spikes once you and your coach know your events.</p></div>
      <div class="cols">
        <div class="panel"><h3>Practice bag</h3><ul class="checks">${G.practice.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="panel"><h3>Meet-day bag</h3><ul class="checks">${G.meet.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
      <div class="panel care-alert"><h3>Uniform rules</h3><ul class="exp">${G.rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
  },
  team(){
    return `${back}<div class="stack"><div><div class="eyebrow">Benton Central Track &amp; Field</div><h1>Team</h1></div>
      <div><h2 style="margin-bottom:10px">Coaching staff</h2><div class="staff">${STAFF.map(c=>`<div class="panel ${c.name?"":"open"}"><div class="eyebrow">${esc(c.role)}</div><h3>${c.name?esc(c.name):"To be named"}</h3></div>`).join("")}</div></div>
      <div><h2 style="margin-bottom:10px">How we run</h2><div class="cols">${PHILOSOPHY.map(x=>`<div class="panel"><h3>${esc(x.h)}</h3><p style="margin:6px 0 0">${esc(x.p)}</p></div>`).join("")}</div></div>
      <div class="cols">
        <div class="panel"><h2>Daily practice</h2><ol class="steps">${PRACTICE_FLOW.map(x=>`<li><span>${esc(x)}</span><em></em></li>`).join("")}</ol></div>
        <div class="panel"><h2>Expectations</h2><ul class="exp">${EXPECTATIONS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      </div></div>`;
  },
  data(){
    const list = ATHLETES.filter(a=>a.level===level);
    return `${back}<div class="stack"><div class="bar"><div><div class="eyebrow">Per-athlete pages</div><h1>Data Log</h1></div>${levelToggle()}</div>
      <div class="tbl"><table><thead><tr><th>Athlete</th><th>Categories</th><th>Logged workouts</th><th>Meets</th><th>Latest entry</th></tr></thead><tbody>
      ${list.map(a=>`<tr><td><a href="#a-${a.id}">${esc(a.name)}</a></td><td>${a.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</td><td class="mono">${a.log.length}</td><td class="mono">${a.meets.length}</td>
        <td>${a.log.length?esc(a.log[a.log.length-1].d+" · "+a.log[a.log.length-1].w):"—"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  },
  athlete(id){
    const a = ATHLETES.find(x=>x.id===id);
    if(!a) return `${back}<h1>Athlete not found</h1><p><a href="#athletes">Back to Athletes</a></p>`;
    const evs = [...new Set([...Object.keys(a.prs), ...assignedEvents(a), ...Object.keys(a.goals||{}), ...a.events.filter(e=>e!=="XC" && !e.startsWith("4x"))])].sort((x,y)=>Object.keys(EV_NAME).indexOf(x)-Object.keys(EV_NAME).indexOf(y));
    return `<a class="backlink" href="#athletes">← Athletes</a>
      <div class="stack"><div><div class="eyebrow">${a.level} · ${a.g==="B"?"Boys":"Girls"} · Grade ${a.grade??"—"}${a.cats.length?" · "+a.cats.map(esc).join(" · "):""}</div><h1>${esc(a.name)}</h1>
        <p class="lede">${a.isNew?"New this season. Events to be decided.":a.events[0]==="XC"?"Cross country runner, no track marks yet":`Events: ${a.events.map(e=>`<span class="chip">${esc(evn(e))}</span>`).join("")}`}</p>
        <div class="anetrow"><a class="anet" href="${a.anet?anetAthlete(a.anet):anetTeam(a.level)}" target="_blank" rel="noopener"><b>Athletic.net</b> ${a.anet?"Full results":"Team page"} ↗</a></div></div>
      <div class="panel"><h2>Best marks &amp; goals</h2>${a.level==="JH"&&evs.some(e=>{const m=markRank(a,e);return m&&m.hs;})?`<p class="hs-note"><span class="hs-tag">★ Top 3 overall</span> = top 3 of all ${a.g==="B"?"boys":"girls"} in the program, high school included.</p>`:""}<div class="prgrid">
        ${evs.map(e=>{ const m = markRank(a,e); return `<div class="pr ${m&&m.hs?"pr-hs":""}"><div class="ev">${esc(evn(e))}</div><div class="mk">${esc(a.prs[e]||"—")}</div>${a.pri&&a.pri[e]?`<div class="when2">${esc(a.pri[e])}</div>`:""}
          ${m?`<div class="rank"><span class="rk ${m.r===1?"r1":m.r<=3?"r3":""}">${ordinalTag(m,a)}</span>${m.hs?`<span class="hs-tag" title="Rank among all ${a.g==="B"?"boys":"girls"}, HS and JH">★ Top 3 overall · #${m.hs.r} of ${m.hs.n}</span>`:""}</div>`:""}
          <div class="gl">Goal <b>${esc(a.goals[e]||"—")}</b></div></div>`; }).join("")}
      </div></div>
      ${(()=>{ if(!(a.cats.includes("Distance")||a.cats.includes("Mid Distance"))) return ""; const b = athleteVdot(a); if(!b) return ""; const p = paceSet(b.V);
        return `<div class="panel"><div class="bar"><h2>Training paces</h2><span class="muted">VDOT ${b.V.toFixed(1)} · from ${esc(evn(b.k))} ${esc(b.mk)}</span></div>
          <div class="prgrid">${[["Easy","/mi",`${p.easy[0]}–${p.easy[1]}`],["Tempo","/mi",p.tempo],["Tempo","/400",p.tempo400],["Interval","/400",p.int400],["Interval","/800",p.int800],["Rep","/200",p.rep200],["Rep","/400",p.rep400]]
            .map(([l,u,v])=>`<div class="pr"><div class="ev">${l} ${u}</div><div class="mk">${v}</div></div>`).join("")}</div>
          <p class="note" style="margin:8px 0 0"><a href="#paces">What each pace means →</a></p></div>`; })()}
      <div><h2 style="margin-bottom:10px">Workout log</h2>
        ${a.log.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Workout</th><th>Splits / marks</th><th>Notes</th></tr></thead><tbody>
          ${a.log.map(l=>`<tr><td class="mono">${esc(l.d)}</td><td>${esc(l.w)}</td><td class="split">${esc(splitsText(l))||"—"}</td><td>${esc(l.n)}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note">No workouts logged yet.</p>`}</div>
      <div><h2 style="margin-bottom:10px">Meet results</h2>
        ${a.meets.length?`<div class="tbl"><table><thead><tr><th>Meet</th><th>Event</th><th>Mark</th><th>Place</th></tr></thead><tbody>
          ${a.meets.map(m=>`<tr><td>${esc(m.m)}</td><td>${esc(m.ev)}</td><td class="mono">${esc(m.mk)}</td><td>${esc(m.pl)}</td></tr>`).join("")}</tbody></table></div>`
          :`<p class="note">No meet results yet.</p>`}</div>
      </div>`;
  },
};

function applyNameMode(){
  const short = PUBLIC_INITIALS && !canPost;
  ATHLETES.forEach(a=>{ a.fullName = a.fullName || a.name; a.name = short ? shortName(a.fullName) : a.fullName; });
  REC.list.forEach(r=>{ r.fullName = r.fullName || r.name; r.name = short ? shortName(r.fullName) : r.fullName; });
}
function render(){
  applyNameMode();
  const h = (location.hash || "#hub").slice(1);
  const isAth = h.startsWith("a-");
  if (h==="post") { ctab="workouts"; }
  const key = isAth ? "athletes" : h==="post" ? "coaches" : (views[h] && h!=="athlete" && !h.startsWith("_") ? h : "hub");
  const curG = (SECTIONS.find(x=>x.id===key)||{}).g || "";
  const top = [`<a href="#hub" ${key==="hub"?'aria-current="page"':""}>Hub</a>`,
    ...NAV_GROUPS.map(([g,l])=>{ const first = SECTIONS.find(x=>x.g===g); return `<a href="#${first.id}" ${curG===g?'aria-current="page"':""}>${l}</a>`; }),
    `<a href="#coaches" ${key==="coaches"?'aria-current="page"':""}>${canPost?"Coaches":"Coach login"}</a>`].join("");
  document.getElementById("tabs").innerHTML = top;
  const sub = document.getElementById("subnav");
  if (curG) { sub.hidden = false; sub.innerHTML = `<div class="wrap subnav-in">${SECTIONS.filter(x=>x.g===curG && (!x.coach || canPost)).map(x=>`<a href="#${x.id}" ${x.id===key?'aria-current="page"':""}>${x.name}</a>`).join("")}</div>`; }
  else { sub.hidden = true; sub.innerHTML = ""; }
  document.getElementById("view").innerHTML = isAth ? views.athlete(h.slice(2)) : views[key]();
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => { if(location.hash!==lastHash){ lastHash=location.hash; window.scrollTo(0,0); } render(); });
render();
async function loadAll(){
  if (!SB) return;
  const {data, error} = await SB.from("hub_data").select("key,value,updated_at");
  if (error || !data) return;
  const byKey = {}; data.forEach(r=>{ byKey[r.key] = r.value; STAMP[r.key] = r.updated_at; });
  const w = byKey.workouts, wu0 = byKey.warmups, lg = byKey.logs, rj = byKey.recruits, aj = byKey.assignments;
  if (aj && typeof aj === "object") ASSIGN = Object.assign({"HS-B":{}, "HS-G":{}, "JH-B":{}, "JH-G":{}}, aj);
  if (rj && Array.isArray(rj.list)) REC = {list: rj.list, contacts: (rj.contacts||[]).map(({note, ...c})=>c)};
  if (Array.isArray(w)) WORKOUTS = w;
  if (wu0 && wu0.practice) WARMUPS = Object.assign({}, WARMUPS, wu0);
  if (lg && typeof lg === "object") LOGS = lg;
  if (byKey.signups && typeof byKey.signups === "object") SIGN = Object.assign(JSON.parse(JSON.stringify(SIGNUPS_SEED)), byKey.signups);
  applyLogs();
  render();
}
loadAll();
/* ---- Coach sign-in (email link) ---- */
let checking = false;
async function checkCoach(session){
  if (!SB) return;
  if (session === undefined) { const r = await SB.auth.getSession(); session = r.data.session; }
  coachEmail = session && session.user ? (session.user.email||"").toLowerCase() : "";
  if (!coachEmail) { canPost = false; render(); return; }
  const {data, error} = await SB.from("coaches").select("email").eq("email", coachEmail).maybeSingle();
  canPost = !!data && !error;
  // Just came back from a sign-in link: go straight to the Coaches tab
  if (AUTH_RETURN && !checking) { checking = true; if (!/^#(coaches|post)$/.test(location.hash)) location.hash = "#coaches"; }
  render();
}
async function sendLogin(){
  const email = (document.getElementById("lg-email")||{}).value || "";
  if (!/.+@.+\..+/.test(email.trim())) { login.msg = "Enter your email address."; render(); return; }
  login.email = email.trim();
  const {error} = await SB.auth.signInWithOtp({email: login.email, options:{emailRedirectTo: location.origin + location.pathname}});
  if (error) { login.msg = authMsg(error); render(); return; }
  login.sent = true; login.msg = ""; render();
}
function authMsg(error){
  const m = String((error && error.message) || "").toLowerCase();
  if (m.includes("rate limit") || (error && error.status===429)) return "Too many sign-in emails were sent in the last hour. Wait a bit, or use your password instead.";
  if (m.includes("invalid login") || m.includes("invalid credentials")) return "That email and password don't match. First time here? Use \"First time? Set a password.\"";
  if (m.includes("already registered") || m.includes("already been registered")) return "That email already has a password. Sign in instead, or use an email link if you forgot it.";
  if (m.includes("email not confirmed")) return "This account still needs email confirmation. Ask Coach Witt to turn off \"Confirm email\" in Supabase, or use an email link.";
  if (m.includes("password") && (m.includes("short") || m.includes("least") || m.includes("weak"))) return "Pick a longer password: at least 8 characters.";
  if (m.includes("signups not allowed") || m.includes("signup is disabled")) return "New passwords are turned off in Supabase. Use an email link, or ask Coach Witt.";
  return "Sign-in didn't work: " + ((error && error.message) || "unknown error") + ".";
}
// One shared coaches account. The email isn't secret; the password is checked by Supabase, never stored in this page.
const COACH_ACCOUNT = (window.HUB_CONFIG && window.HUB_CONFIG.coachAccount) || "coaches@bctrackhub.com";
async function pwLogin(){
  const pw = (document.getElementById("lg-pw")||{}).value || "";
  if (!pw) { login.msg = "Enter the password."; render(); return; }
  const res = await SB.auth.signInWithPassword({email: COACH_ACCOUNT, password: pw});
  if (res.error) { login.msg = /invalid/i.test(res.error.message||"") ? "Wrong password. Try again." : "Sign-in didn't work: " + res.error.message; render(); return; }
  login.msg = "";
  await checkCoach(res.data.session);
  if (!/^#(coaches|post)$/.test(location.hash)) location.hash = "#coaches";
}
async function signOut(){ await SB.auth.signOut(); canPost = false; coachEmail = ""; location.hash = "#hub"; render(); }
if (SB) {
  // Don't call Supabase inside this callback directly (it can stall); hand off with setTimeout.
  SB.auth.onAuthStateChange((event, session)=>{ setTimeout(()=>checkCoach(session), 0); });
  if (/error_description=/.test(AUTH_RETURN)) {
    login.msg = /expired|invalid/i.test(decodeURIComponent(AUTH_RETURN)) ? "That sign-in link expired or was already used. Send a new one." : "Sign-in didn't finish. Send a new link.";
    history.replaceState(null, "", location.pathname + "#coaches"); render();
  }
}
</script>
